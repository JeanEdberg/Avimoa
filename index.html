    // =========================================================================
    // MÓDULO 4: FAENADO Y MERMA POST-MORTEM (BLOQUEADO HASTA AUTORIZACIÓN ADMIN)
    // =========================================================================
    function ModuloFaenadoPostMortem({
      basePreFaenado, faenadoManana, pesoFaenado, mermaPost, detalleFaenadoObs,
      saldoTeoricoPost, confirmacionPost, usuario, authAprobada, authPendiente,
      onSolicitarAuth, onRegistrarFaenado, onConfirmarPost, onError
    }) {
      const [cantFaenado, setCantFaenado] = useState(faenadoManana ?? basePreFaenado);
      const [pesoTotalKg, setPesoTotalKg] = useState(pesoFaenado || 0);
      const [cantPostMortem, setCantPostMortem] = useState(mermaPost || 0);
      const [detalleObs, setDetalleObs] = useState(detalleFaenadoObs || 'Lote beneficio turno mañana');
      const [saldoRemanenteFisico, setSaldoRemanenteFisico] = useState(confirmacionPost?.fisico || 0);
      const [pin, setPin] = useState('');

      const [solicitandoAuthUI, setSolicitandoAuthUI] = useState(false);
      const [motivoSolAuth, setMotivoSolAuth] = useState('');

      useEffect(() => {
        if (faenadoManana !== null) setCantFaenado(faenadoManana);
        if (pesoFaenado) setPesoTotalKg(pesoFaenado);
        if (mermaPost !== undefined) setCantPostMortem(mermaPost);
        if (detalleFaenadoObs) setDetalleObs(detalleFaenadoObs);
        if (confirmacionPost) setSaldoRemanenteFisico(confirmacionPost.fisico);
      }, [faenadoManana, pesoFaenado, mermaPost, detalleFaenadoObs, confirmacionPost]);

      const yaRegistradoFaena = faenadoManana !== null || !!confirmacionPost;
      const bloqueadoEdicion = yaRegistradoFaena && !authAprobada;

      const handleGuardarFaenado = (e) => {
        e.preventDefault();
        if (bloqueadoEdicion) {
          return onError('El faenado ya fue registrado. Solicita autorización al Administrador para editar.');
        }
        onRegistrarFaenado(Number(cantFaenado), Number(pesoTotalKg), Number(cantPostMortem), detalleObs, !!authAprobada);
        setSolicitandoAuthUI(false);
        setMotivoSolAuth('');
      };

      const handleCierrePost = (e) => {
        e.preventDefault();
        if (confirmacionPost && !authAprobada) {
          return onError('El cierre ya fue sellado. Solicita autorización al Administrador para editar.');
        }
        if (pin !== usuario.pin) {
          return onError('PIN incorrecto. Ingresa tu PIN personal para confirmar el cierre.');
        }
        onConfirmarPost({
          teorico: saldoTeoricoPost,
          fisico: Number(saldoRemanenteFisico),
          diferencia: Number(saldoRemanenteFisico) - saldoTeoricoPost,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        }, !!authAprobada);
        setPin('');
        setSolicitandoAuthUI(false);
        setMotivoSolAuth('');
      };

      return (
        <div className="space-y-4">
          {bloqueadoEdicion && (
            <div className="bg-slate-900 border border-amber-500/60 rounded-3xl p-4 space-y-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <p className="text-xs font-black text-amber-400 uppercase">🔒 Módulo Protegido Contra Edición</p>
                  <p className="text-xs text-slate-300">Para corregir cantidades, kilos o remanente de faenado se requiere autorización con PIN del Administrador.</p>
                </div>
                {!authPendiente && !solicitandoAuthUI && (
                  <button
                    type="button"
                    onClick={() => setSolicitandoAuthUI(true)}
                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs"
                  >
                    🔓 SOLICITAR AUTORIZACIÓN PARA EDITAR
                  </button>
                )}
              </div>

              {authPendiente && (
                <div className="bg-amber-950/70 border border-amber-500 p-3 rounded-2xl text-xs text-amber-200 font-bold animate-pulse">
                  ⏳ Esperando autorización del Administrador desde su celular o computadora...
                </div>
              )}

              {solicitandoAuthUI && !authPendiente && (
                <div className="bg-slate-950 border border-amber-500 p-3.5 rounded-2xl flex flex-wrap gap-2">
                  <input
                    type="text"
                    value={motivoSolAuth}
                    onChange={(e) => setMotivoSolAuth(e.target.value)}
                    placeholder="Motivo de edición en Faenado (obligatorio)..."
                    className="flex-1 min-w-[200px] bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs"
                  />
                  <button
                    type="button"
                    onClick={() => onSolicitarAuth(motivoSolAuth)}
                    className="bg-amber-500 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs"
                  >
                    ENVIAR SOLICITUD
                  </button>
                  <button
                    type="button"
                    onClick={() => setSolicitandoAuthUI(false)}
                    className="bg-slate-800 text-slate-300 font-bold px-3 py-2.5 rounded-xl text-xs"
                  >
                    Cancelar
                  </button>
                </div>
              )}
            </div>
          )}

          {authAprobada && (
            <div className="bg-emerald-950 border border-emerald-400 p-3.5 rounded-2xl text-xs text-emerald-200 font-bold">
              ✅ Edición de Faenado AUTORIZADA por {authAprobada.autorizado_por}. Guarda tus cambios para volver a sellar el módulo.
            </div>
          )}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
              <span className="text-xs font-extrabold text-purple-400 uppercase">Módulo 4A • Turno Mañana</span>
              <h3 className="text-base font-black text-white">Faenado y Merma Post-Mortem</h3>
              <p className="text-xs text-slate-400">Disponible Pre-Faena: <strong className="text-sky-400">{basePreFaenado} aves</strong></p>
              <form onSubmit={handleGuardarFaenado} className="space-y-3">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">Cantidad Aves Faenado</label>
                    <input type="number" disabled={bloqueadoEdicion} value={cantFaenado} onChange={(e) => setCantFaenado(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg disabled:opacity-60" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Peso Total (kg)</label>
                    <input type="number" step="0.1" disabled={bloqueadoEdicion} value={pesoTotalKg} onChange={(e) => setPesoTotalKg(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg disabled:opacity-60" />
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Merma Post-Mortem (Decomiso / Descarte Línea)</label>
                  <input type="number" disabled={bloqueadoEdicion} value={cantPostMortem} onChange={(e) => setCantPostMortem(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg text-rose-400 disabled:opacity-60" />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Detalle / Observación</label>
                  <input type="text" disabled={bloqueadoEdicion} value={detalleObs} onChange={(e) => setDetalleObs(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs disabled:opacity-60" />
                </div>
                {!bloqueadoEdicion && (
                  <button type="submit" className="w-full py-3.5 bg-purple-600 hover:bg-purple-500 rounded-xl font-black text-sm">
                    {authAprobada ? '💾 GUARDAR CORRECCIÓN DE FAENADO' : 'REGISTRAR FAENADO MAÑANA'}
                  </button>
                )}
              </form>
            </div>

            <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl p-5 space-y-4">
              <span className="text-xs font-extrabold text-emerald-400 uppercase">Módulo 4B • Cierre Final del Día</span>
              <h3 className="text-base font-black text-white">Confirmación Saldo Post-Faenado</h3>
              <p className="text-xs text-slate-400">Aves vivas remanentes en acopio (arrastre para siguiente noche).</p>
              {confirmacionPost && !authAprobada ? (
                <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                  <p className="font-black text-emerald-300">✓ CIERRE POST-FAENADO SELLADO</p>
                  <p>Responsable: {confirmacionPost.responsable} ({confirmacionPost.hora})</p>
                  <p>Saldo Remanente Confirmado: {confirmacionPost.fisico} aves</p>
                </div>
              ) : (
                <form onSubmit={handleCierrePost} className="space-y-3">
                  <div className="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-xl text-center">
                    <div>
                      <p className="text-xs text-slate-400">Remanente Teórico</p>
                      <p className="font-black text-xl text-sky-400">{saldoTeoricoPost}</p>
                    </div>
                    <div>
                      <p className="text-xs text-slate-400">Descuadre</p>
                      <p className={`font-black text-xl ${Number(saldoRemanenteFisico) - saldoTeoricoPost === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {Number(saldoRemanenteFisico) - saldoTeoricoPost}
                      </p>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Aves Vivas Remanentes Contadas</label>
                    <input type="number" value={saldoRemanenteFisico} onChange={(e) => setSaldoRemanenteFisico(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                  </div>
                  <input
                    type="password"
                    maxLength={4}
                    value={pin}
                    onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                    placeholder="Ingresa tu PIN personal para cerrar"
                    className="w-full bg-slate-800 border border-emerald-500/60 rounded-xl p-3 text-center font-mono text-lg"
                  />
                  <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-black text-sm">
                    {authAprobada ? '💾 GUARDAR CORRECCIÓN Y CERRAR' : 'CONFIRMAR SALDO POST-FAENADO'}
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 5: KARDEX VERTICAL Y REPORTES
    // =========================================================================
    function ModuloKardexDashboard({ fechaOperativa, ingresos, guias, mermasAnte, confirmacionPre, faenadoManana, pesoFaenado, mermaPost, confirmacionPost, saldoTeoricoPreFaenado, alertas, notificar }) {
      let saldoCorriente = 0;

      const exportarCSV = () => {
        let saldo = 0;
        const filas = [['FECHA', 'BLOQUE', 'CONCEPTO', 'EMPRESA', 'JABAS', 'ENTRADA', 'SALIDA', 'SALDO']];
        ingresos.forEach(i => {
          saldo += i.aves;
          filas.push([fechaOperativa, 'NOCHE', `${i.sector} - ${i.numeroGalpon} (${i.placa} - ${i.chofer})`, i.empresa, i.jabas, i.aves, 0, saldo]);
        });
        guias.forEach(g => {
          if (!g.anulada) saldo -= g.aves;
          filas.push([fechaOperativa, 'NOCHE', `Guía #${g.numero}${g.anulada ? ' [ANULADA]' : ''} - [${g.cod}] ${g.cliente}`, g.empresa, g.anulada ? 0 : g.jabas, 0, g.anulada ? 0 : g.aves, saldo]);
        });
        mermasAnte.forEach(m => {
          saldo -= m.aves;
          filas.push([fechaOperativa, 'ANTE-MORTEM', `Merma Ante-Mortem (${m.placa})`, 'CONSOLIDADO', 0, 0, m.aves, saldo]);
        });
        if (faenadoManana !== null) {
          saldo -= (faenadoManana + mermaPost);
          filas.push([fechaOperativa, 'MAÑANA', `Faenado (${pesoFaenado} kg) + Post-Mortem (${mermaPost})`, 'CONSOLIDADO', 0, 0, faenadoManana + mermaPost, saldo]);
        }
        const csvContent = 'data:text/csv;charset=utf-8,' + filas.map(e => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Kardex_Avimoa_${fechaOperativa}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notificar('Archivo CSV del Kardex descargado.');
      };

      return (
        <div className="space-y-5">
          {alertas.length > 0 && (
            <div className="bg-rose-950/80 border border-rose-500 p-4 rounded-2xl space-y-1">
              <p className="text-xs font-black text-rose-300 uppercase">Alertas de Auditoría Activas</p>
              {alertas.map((a, i) => <p key={i} className="text-xs text-white">• {a}</p>)}
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 overflow-x-auto">
            <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
              <div>
                <h2 className="text-lg font-black text-white">Kardex Vertical Consolidado ({fechaOperativa})</h2>
                <p className="text-xs text-slate-400">Arrastre automático de saldos desde apertura nocturna hasta cierre post-faenado.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={exportarCSV}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-xl"
                >
                  ⬇ Exportar Kardex CSV
                </button>
                <span className="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold text-amber-400">
                  {confirmacionPre ? `Sellado: ${confirmacionPre.responsable}` : 'Pendiente Conteo'}
                </span>
              </div>
            </div>

            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="border-b border-slate-700 text-slate-400">
                  <th className="py-2 px-2">BLOQUE</th>
                  <th className="py-2 px-2">CONCEPTO / GALPÓN / CLIENTE</th>
                  <th className="py-2 px-2">EMPRESA</th>
                  <th className="py-2 px-2 text-right">JABAS</th>
                  <th className="py-2 px-2 text-right">ENTRADA</th>
                  <th className="py-2 px-2 text-right">SALIDA</th>
                  <th className="py-2 px-2 text-right">SALDO</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {ingresos.map((ing) => {
                  saldoCorriente += ing.aves;
                  return (
                    <tr key={ing.id} className="bg-emerald-950/20">
                      <td className="py-2.5 px-2 font-bold text-emerald-400">NOCHE</td>
                      <td className="py-2.5 px-2">{ing.sector} — <strong>{ing.numeroGalpon}</strong> ({ing.placa} - {ing.chofer})</td>
                      <td className="py-2.5 px-2 font-mono">{ing.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{ing.jabas}</td>
                      <td className="py-2.5 px-2 text-right font-bold text-emerald-400">+{ing.aves}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {guias.map((g) => {
                  if (!g.anulada) saldoCorriente -= g.aves;
                  return (
                    <tr key={g.id} className={g.anulada ? 'bg-rose-950/15 text-slate-500' : 'bg-sky-950/20'}>
                      <td className="py-2.5 px-2 font-bold text-sky-400">NOCHE</td>
                      <td className="py-2.5 px-2">
                        {g.anulada ? (
                          <span className="line-through">Guía #{g.numero} — [{g.cod}] {g.cliente}</span>
                        ) : (
                          <>Guía #{g.numero} — [{g.cod}] {g.cliente}</>
                        )}
                        {g.anulada && <span className="ml-2 bg-rose-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded">ANULADA</span>}
                      </td>
                      <td className="py-2.5 px-2 font-mono">{g.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{g.anulada ? 0 : g.jabas}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-sky-400">{g.anulada ? '0' : `-${g.aves}`}</td>
                      <td className="py-2.5 px-2 text-right font-black text-white">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {mermasAnte.map((m) => {
                  saldoCorriente -= m.aves;
                  return (
                    <tr key={m.id} className="bg-rose-950/20">
                      <td className="py-2.5 px-2 font-bold text-rose-400">ANTE-M</td>
                      <td className="py-2.5 px-2">Merma Ante-Mortem ({m.placa}) {m.conFoto ? '📷' : ''}</td>
                      <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-rose-400">-{m.aves}</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                <tr className="bg-amber-950/30 font-bold">
                  <td className="py-2.5 px-2 text-amber-400">SALDO</td>
                  <td className="py-2.5 px-2">SALDO DISPONIBLE PARA FAENADO</td>
                  <td className="py-2.5 px-2">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right font-black text-amber-400">{saldoTeoricoPreFaenado}</td>
                </tr>
                {faenadoManana !== null && (
                  <tr className="bg-slate-800/60">
                    <td className="py-2.5 px-2 font-bold text-purple-400">MAÑANA</td>
                    <td className="py-2.5 px-2">FAENADO 7P - PL ({pesoFaenado} kg | Post-Mortem: {mermaPost} aves)</td>
                    <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                    <td className="py-2.5 px-2 text-right">-</td>
                    <td className="py-2.5 px-2 text-right">0</td>
                    <td className="py-2.5 px-2 text-right font-bold text-purple-300">-{faenadoManana + mermaPost}</td>
                    <td className="py-2.5 px-2 text-right font-black">{confirmacionPost ? confirmacionPost.fisico : saldoTeoricoPreFaenado - faenadoManana - mermaPost}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 6: USUARIOS Y MAESTROS (INCLUYE VENDEDORES / DESPACHADORES)
    // =========================================================================
    function ModuloMaestros({
      usuarioActivo, usuarios, onGuardarUsuario,
      galpones, setGalpones, placas, setPlacas, choferes, setChoferes, clientes, setClientes, vendedores, setVendedores,
      nombreEmpresa, nombreChofer, sbUrl, setSbUrl, sbKey, setSbKey, webhookUrl, setWebhookUrl,
      sbConectado, onConectarSupabase, supabaseRef, notificar
    }) {
      const esDev = usuarioActivo.rol === 'DESARROLLADOR';
      const [subTab, setSubTab] = useState(esDev ? 'USUARIOS' : 'GALPONES');

      // Estados Usuarios (Crear / Editar)
      const [editandoUserDni, setEditandoUserDni] = useState(null);
      const [dniNuevoUser, setDniNuevoUser] = useState('');
      const [nombreNuevoUser, setNombreNuevoUser] = useState('');
      const [rolNuevoUser, setRolNuevoUser] = useState('TRASLADO');
      const [pinGeneradoPreview, setPinGeneradoPreview] = useState(() => generarPinAleatorio4());
      const [ultimoCredencialCreado, setUltimoCredencialCreado] = useState(null);

      // Estados Galpones (Crear / Editar)
      const [editandoGalponId, setEditandoGalponId] = useState(null);
      const [empresaGalpon, setEmpresaGalpon] = useState('emp-1');
      const [sectorGalpon, setSectorGalpon] = useState('');
      const [numeroGalpon, setNumeroGalpon] = useState('Galpón 1');
      const [referenciaGalpon, setReferenciaGalpon] = useState('');
      const [cantidadLote, setCantidadLote] = useState(1);

      // Estados Placas (Crear / Editar)
      const [editandoPlacaId, setEditandoPlacaId] = useState(null);
      const [nuevaPlaca, setNuevaPlaca] = useState('');
      const [modeloPlaca, setModeloPlaca] = useState('');
      const [empresaPlaca, setEmpresaPlaca] = useState('emp-1');
      const [choferHabitualPlaca, setChoferHabitualPlaca] = useState('');

      // Estados Choferes (Crear / Editar)
      const [editandoChoferId, setEditandoChoferId] = useState(null);
      const [nombreNuevoChofer, setNombreNuevoChofer] = useState('');
      const [dniNuevoChofer, setDniNuevoChofer] = useState('');
      const [telNuevoChofer, setTelNuevoChofer] = useState('');

      // Estados Vendedores / Despachadores (Crear / Editar / Importar)
      const [editandoVendedorId, setEditandoVendedorId] = useState(null);
      const [nombresVendForm, setNombresVendForm] = useState('');
      const [apodoVendForm, setApodoVendForm] = useState('');
      const [dniVendForm, setDniVendForm] = useState('');
      const [csvVendTexto, setCsvVendTexto] = useState('');

      // Estados Clientes (Crear / Editar / Importar)
      const [editandoClienteCod, setEditandoClienteCod] = useState(null);
      const [codClienteForm, setCodClienteForm] = useState('');
      const [nombreClienteForm, setNombreClienteForm] = useState('');
      const [apodoClienteForm, setApodoClienteForm] = useState('');
      const [docClienteForm, setDocClienteForm] = useState('');
      const [csvTexto, setCsvTexto] = useState('');

      const usuariosActivos = usuarios.filter(u => u.activo !== false);
      const galponesActivos = galpones.filter(g => g.activo !== false);
      const placasActivas = placas.filter(p => p.activo !== false);
      const choferesActivos = choferes.filter(c => c.activo !== false);
      const vendedoresActivos = vendedores.filter(v => v.activo !== false);
      const clientesActivos = clientes.filter(c => c.activo !== false);

      useEffect(() => {
        if (!editandoPlacaId && choferesActivos.length > 0 && !choferHabitualPlaca) {
          setChoferHabitualPlaca(choferesActivos[0].id);
        }
      }, [choferes]);

      // --- USUARIOS ---
      const guardarResponsable = async (e) => {
        e.preventDefault();
        if (dniNuevoUser.trim().length !== 8) {
          return notificar('El DNI debe tener exactamente 8 dígitos.', 'err');
        }
        if (!nombreNuevoUser.trim()) {
          return notificar('Ingrese el nombre del responsable.', 'err');
        }
        const existente = usuarios.find(u => u.dni === dniNuevoUser.trim());
        const pinFinal = pinGeneradoPreview || generarPinAleatorio4();
        const nuevoObj = {
          dni: dniNuevoUser.trim(),
          nombre: nombreNuevoUser.trim(),
          rol: existente?.rol === 'DESARROLLADOR' ? 'DESARROLLADOR' : rolNuevoUser,
          pin: pinFinal,
          intentosFallidos: 0,
          bloqueado: false,
          activo: true,
        };
        await onGuardarUsuario(nuevoObj);
        setUltimoCredencialCreado(nuevoObj);
        setEditandoUserDni(null);
        setDniNuevoUser('');
        setNombreNuevoUser('');
        setPinGeneradoPreview(generarPinAleatorio4());
        notificar(editandoUserDni ? `Usuario ${nuevoObj.nombre} actualizado.` : `Usuario ${nuevoObj.nombre} creado con PIN ${pinFinal}.`);
      };

      const eliminarUsuarioBaja = async (u) => {
        const actualizado = { ...u, activo: false, bloqueado: false };
        await onGuardarUsuario(actualizado);
        notificar(`🗑️ ${u.nombre} eliminado de la app (respaldado en base de datos).`, 'warn');
      };

      const desbloquearYRegenerarPin = async (u) => {
        const nuevoPin = generarPinAleatorio4();
        const actualizado = { ...u, pin: nuevoPin, intentosFallidos: 0, bloqueado: false };
        await onGuardarUsuario(actualizado);
        setUltimoCredencialCreado(actualizado);
        notificar(`Nuevo PIN generado para ${u.nombre}: ${nuevoPin}`);
      };

      const copiarCredencialesWhatsApp = (u) => {
        const rolDesc = ROLES_MODULO.find(r => r.value === u.rol)?.label || u.rol;
        const mensaje = `🐔 *AVIMOA — Acceso al Sistema*\n👤 *Responsable:* ${u.nombre}\n📋 *Módulo:* ${rolDesc}\n🪪 *DNI:* ${u.dni}\n🔑 *PIN de Acceso:* ${u.pin}\n🔗 *Enlace:* ${window.location.href}`;
        navigator.clipboard?.writeText(mensaje);
        notificar('Credenciales copiadas al portapapeles.');
      };

      // --- GALPONES / DIRECCIONES ---
      const guardarGalpon = async (e) => {
        e.preventDefault();
        if (!sectorGalpon.trim()) return;

        if (editandoGalponId) {
          const actualizado = {
            id: editandoGalponId,
            sector: sectorGalpon.trim(),
            numeroGalpon,
            referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
            empresaId: empresaGalpon,
            activo: true,
          };
          setGalpones(galpones.map(g => g.id === editandoGalponId ? actualizado : g));
          if (supabaseRef.current) {
            await supabaseRef.current.from('galpones').upsert({
              id: actualizado.id, sector: actualizado.sector, numero_galpon: actualizado.numeroGalpon,
              referencia: actualizado.referencia, empresa_id: actualizado.empresaId, activo: true
            });
          }
          setEditandoGalponId(null);
          notificar('Dirección / Galpón actualizado.');
        } else {
          const cant = Number(cantidadLote);
          const nuevos = [];
          if (cant > 1) {
            for (let i = 1; i <= cant; i++) {
              nuevos.push({
                id: 'g-' + Date.now() + '-' + i,
                sector: sectorGalpon.trim(),
                numeroGalpon: `Galpón ${i}`,
                referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
                empresaId: empresaGalpon,
                activo: true,
              });
            }
            notificar(`Se crearon ${cant} galpones (Galpón 1 al ${cant}) en ${sectorGalpon}.`);
          } else {
            nuevos.push({
              id: 'g-' + Date.now(),
              sector: sectorGalpon.trim(),
              numeroGalpon,
              referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
              empresaId: empresaGalpon,
              activo: true,
            });
            notificar(`Dirección ${sectorGalpon} (${numeroGalpon}) registrada.`);
          }
          setGalpones([...galpones, ...nuevos]);
          if (supabaseRef.current) {
            await supabaseRef.current.from('galpones').upsert(
              nuevos.map(n => ({ id: n.id, sector: n.sector, numero_galpon: n.numeroGalpon, referencia: n.referencia, empresa_id: n.empresaId, activo: true }))
            );
          }
        }
        setSectorGalpon('');
        setReferenciaGalpon('');
        setCantidadLote(1);
      };

      const eliminarGalponBaja = async (g) => {
        setGalpones(galpones.map(item => item.id === g.id ? { ...item, activo: false } : item));
        if (supabaseRef.current) {
          await supabaseRef.current.from('galpones').update({ activo: false }).eq('id', g.id);
        }
        notificar(`🗑️ ${g.sector} (${g.numeroGalpon}) eliminado de la app (conservado en BD).`, 'warn');
      };

      // --- PLACAS ---
      const guardarPlaca = async (e) => {
        e.preventDefault();
        if (!nuevaPlaca.trim()) return;
        const obj = {
          id: editandoPlacaId || ('v-' + Date.now()),
          placa: nuevaPlaca.trim().toUpperCase(),
          modelo: modeloPlaca.trim() || 'Camión Furgón',
          empresaId: empresaPlaca,
          choferId: choferHabitualPlaca,
          activo: true,
        };
        if (editandoPlacaId) {
          setPlacas(placas.map(p => p.id === editandoPlacaId ? obj : p));
        } else {
          setPlacas([...placas, obj]);
        }
        if (supabaseRef.current) {
          await supabaseRef.current.from('placas').upsert({
            id: obj.id, placa: obj.placa, modelo: obj.modelo, empresa_id: obj.empresaId, chofer_id: obj.choferId, activo: true
          });
        }
        setEditandoPlacaId(null);
        setNuevaPlaca('');
        setModeloPlaca('');
        notificar(editandoPlacaId ? 'Placa actualizada.' : 'Placa / Vehículo registrado.');
      };

      const eliminarPlacaBaja = async (p) => {
        setPlacas(placas.map(item => item.id === p.id ? { ...item, activo: false } : item));
        if (supabaseRef.current) {
          await supabaseRef.current.from('placas').update({ activo: false }).eq('id', p.id);
        }
        notificar(`🗑️ Placa ${p.placa} eliminada de la app (conservada en BD).`, 'warn');
      };

      // --- CHOFERES ---
      const guardarChofer = async (e) => {
        e.preventDefault();
        if (!nombreNuevoChofer.trim()) return;
        const obj = {
          id: editandoChoferId || ('ch-' + Date.now()),
          nombre: nombreNuevoChofer.trim(),
          dni: dniNuevoChofer.trim(),
          telefono: telNuevoChofer.trim(),
          activo: true,
        };
        if (editandoChoferId) {
          setChoferes(choferes.map(c => c.id === editandoChoferId ? obj : c));
        } else {
          setChoferes([...choferes, obj]);
        }
        if (supabaseRef.current) {
          await supabaseRef.current.from('choferes').upsert(obj);
        }
        setEditandoChoferId(null);
        setNombreNuevoChofer('');
        setDniNuevoChofer('');
        setTelNuevoChofer('');
        notificar(editandoChoferId ? 'Datos del chofer actualizados.' : 'Chofer registrado correctamente.');
      };

      const eliminarChoferBaja = async (ch) => {
        setChoferes(choferes.map(item => item.id === ch.id ? { ...item, activo: false } : item));
        if (supabaseRef.current) {
          await supabaseRef.current.from('choferes').update({ activo: false }).eq('id', ch.id);
        }
        notificar(`🗑️ Chofer ${ch.nombre} eliminado de la app (su historial permanece en BD).`, 'warn');
      };

      // --- VENDEDORES / DESPACHADORES ---
      const guardarVendedor = async (e) => {
        e.preventDefault();
        if (!nombresVendForm.trim() && !apodoVendForm.trim()) {
          return notificar('Ingresa el nombre o apodo del vendedor/despachador.', 'err');
        }
        const obj = {
          id: editandoVendedorId || ('vend-' + Date.now()),
          nombres: (nombresVendForm.trim() || apodoVendForm.trim()).toUpperCase(),
          apodo: apodoVendForm.trim() || nombresVendForm.trim(),
          dni: dniVendForm.trim(),
          activo: true,
        };
        if (editandoVendedorId) {
          setVendedores(vendedores.map(v => v.id === editandoVendedorId ? obj : v));
        } else {
          setVendedores([...vendedores, obj]);
        }
        if (supabaseRef.current) {
          await supabaseRef.current.from('vendedores').upsert(obj);
        }
        setEditandoVendedorId(null);
        setNombresVendForm('');
        setApodoVendForm('');
        setDniVendForm('');
        notificar(editandoVendedorId ? 'Vendedor / Despachador actualizado.' : 'Vendedor / Despachador registrado.');
      };

      const importarVendedores = async () => {
        const lineas = csvVendTexto.split('\n').map(l => l.trim()).filter(Boolean);
        if (lineas.length === 0) return notificar('Pega al menos una línea de vendedor.', 'err');
        const aSubir = [];
        lineas.forEach((linea, idx) => {
          const partes = linea.split(/\t|,|;/).map(p => p.trim());
          if (partes.length >= 1 && partes[0]) {
            aSubir.push({
              id: 'vend-' + Date.now() + '-' + idx,
              nombres: partes[0].toUpperCase(),
              apodo: partes[1] || partes[0],
              dni: partes[2] || '',
              activo: true,
            });
          }
        });
        setVendedores([...vendedores, ...aSubir]);
        if (supabaseRef.current && aSubir.length > 0) {
          await supabaseRef.current.from('vendedores').upsert(aSubir);
        }
        setCsvVendTexto('');
        notificar(`Importación completada (${aSubir.length} vendedores guardados).`);
      };

      const eliminarVendedorBaja = async (v) => {
        setVendedores(vendedores.map(item => item.id === v.id ? { ...item, activo: false } : item));
        if (supabaseRef.current) {
          await supabaseRef.current.from('vendedores').update({ activo: false }).eq('id', v.id);
        }
        notificar(`🗑️ Vendedor ${v.apodo} eliminado de la app (respaldado en BD).`, 'warn');
      };

      // --- CLIENTES ---
      const guardarClienteIndividual = async (e) => {
        e.preventDefault();
        if (!codClienteForm.trim() || !apodoClienteForm.trim()) return;
        const obj = {
          cod: codClienteForm.trim(),
          cliente: (nombreClienteForm.trim() || apodoClienteForm.trim()).toUpperCase(),
          apodo: apodoClienteForm.trim(),
          docIdentidad: docClienteForm.trim(),
          activo: true,
        };
        const idx = clientes.findIndex(c => c.cod === obj.cod);
        const copia = [...clientes];
        if (idx >= 0) copia[idx] = obj;
        else copia.push(obj);
        setClientes(copia);
        if (supabaseRef.current) {
          await supabaseRef.current.from('clientes').upsert({
            cod: obj.cod, cliente: obj.cliente, apodo: obj.apodo, doc_identidad: obj.docIdentidad, activo: true
          });
        }
        setEditandoClienteCod(null);
        setCodClienteForm('');
        setNombreClienteForm('');
        setApodoClienteForm('');
        setDocClienteForm('');
        notificar(idx >= 0 ? 'Cliente actualizado.' : 'Cliente registrado.');
      };

      const importarClientes = async () => {
        const lineas = csvTexto.split('\n').map(l => l.trim()).filter(Boolean);
        if (lineas.length === 0) return notificar('Pega al menos una línea de cliente.', 'err');
        const nuevos = [...clientes];
        const aSubir = [];
        lineas.forEach(linea => {
          const partes = linea.split(/\t|,|;/).map(p => p.trim());
          if (partes.length >= 3) {
            const idx = nuevos.findIndex(c => c.cod === partes[0]);
            const obj = { cod: partes[0], cliente: partes[1].toUpperCase(), apodo: partes[2], docIdentidad: partes[3] || '', activo: true };
            if (idx >= 0) nuevos[idx] = obj;
            else nuevos.push(obj);
            aSubir.push({ cod: obj.cod, cliente: obj.cliente, apodo: obj.apodo, doc_identidad: obj.docIdentidad, activo: true });
          }
        });

              <div className="space-y-2 max-h-96 overflow-y-auto">
                {choferesActivos.length === 0 && (
                  <p className="text-xs text-slate-500 bg-slate-950 p-4 rounded-2xl border border-slate-800">Sin choferes registrados aún.</p>
                )}
                {choferesActivos.map(ch => (
                  <div key={ch.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between gap-2">
                    <div>
                      <p className="text-sm font-black text-white">{ch.nombre}</p>
                      <p className="text-xs text-slate-400">DNI: {ch.dni || '—'} • Tel: {ch.telefono || '—'}</p>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          setEditandoChoferId(ch.id);
                          setNombreNuevoChofer(ch.nombre);
                          setDniNuevoChofer(ch.dni || '');
                          setTelNuevoChofer(ch.telefono || '');
                        }}
                        className="px-2.5 py-1.5 rounded-xl text-xs font-extrabold bg-sky-950 hover:bg-sky-900 border border-sky-700 text-sky-300"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        type="button"
                        onClick={() => eliminarChoferBaja(ch)}
                        className="px-2.5 py-1.5 rounded-xl text-xs font-extrabold bg-rose-950 hover:bg-rose-900 border border-rose-700 text-rose-300"
                      >
                        🗑️ Eliminar
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SUB-PESTAÑA VENDEDORES / DESPACHADORES */}
          {subTab === 'VENDEDORES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div className="space-y-4">
                <form onSubmit={guardarVendedor} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-black text-white">
                      {editandoVendedorId ? '✏️ Editando Vendedor / Despachador' : 'Registrar Vendedor / Despachador'}
                    </h3>
                    {editandoVendedorId && (
                      <button type="button" onClick={() => { setEditandoVendedorId(null); setNombresVendForm(''); setApodoVendForm(''); setDniVendForm(''); }} className="text-xs text-slate-400">
                        Cancelar ✕
                      </button>
                    )}
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Nombres y Apellidos Completos</label>
                    <input
                      value={nombresVendForm}
                      onChange={(e) => setNombresVendForm(e.target.value)}
                      placeholder="Ej. Adolfo Ramos Cachi"
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-400">Apodo / Sobrenombre (Para Guía)</label>
                      <input
                        value={apodoVendForm}
                        onChange={(e) => setApodoVendForm(e.target.value)}
                        placeholder="Ej. Adolfo"
                        className="w-full bg-slate-800 border border-amber-500/40 rounded-xl p-2.5 text-sm font-bold text-amber-200 mt-1"
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">DNI (8 dígitos - Opcional)</label>
                      <input
                        type="text"
                        inputMode="numeric"
                        maxLength={8}
                        value={dniVendForm}
                        onChange={(e) => setDniVendForm(e.target.value.replace(/\D/g, ''))}
                        placeholder="Ej. 45896321"
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1"
                      />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                    {editandoVendedorId ? '💾 GUARDAR CAMBIOS' : '+ GUARDAR VENDEDOR / DESPACHADOR'}
                  </button>
                </form>

                <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-2">
                  <h3 className="text-xs font-black text-slate-300 uppercase">Carga Masiva desde Excel (nombres | apodo | dni)</h3>
                  <textarea
                    rows={3}
                    value={csvVendTexto}
                    onChange={(e) => setCsvVendTexto(e.target.value)}
                    placeholder="ADOLFO RAMOS CACHI	Adolfo	45896321"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs font-mono"
                  />
                  <button type="button" onClick={importarVendedores} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 font-black rounded-xl text-xs">
                    IMPORTAR VENDEDORES MASIVO
                  </button>
                </div>
              </div>

              <div className="max-h-[430px] overflow-y-auto divide-y divide-slate-800 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs">
                {vendedoresActivos.length === 0 && (
                  <p className="text-slate-500 py-2">Sin vendedores o despachadores registrados aún.</p>
                )}
                {vendedoresActivos.map(v => (
                  <div key={v.id} className="py-2.5 flex items-center justify-between gap-2">
                    <div>
                      <span className="font-black text-amber-300">{v.apodo}</span>
                      <p className="text-[11px] text-slate-300">{v.nombres} {v.dni ? `• DNI: ${v.dni}` : ''}</p>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          setEditandoVendedorId(v.id);
                          setNombresVendForm(v.nombres);
                          setApodoVendForm(v.apodo);
                          setDniVendForm(v.dni || '');
                        }}
                        className="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-sky-950 border border-sky-700 text-sky-300"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        type="button"
                        onClick={() => eliminarVendedorBaja(v)}
                        className="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-rose-950 border border-rose-700 text-rose-300"
                      >
                        🗑️ Eliminar
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SUB-PESTAÑA CLIENTES */}
          {subTab === 'CLIENTES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div className="space-y-4">
                <form onSubmit={guardarClienteIndividual} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center">
                    <h3 className="text-sm font-black text-white">{editandoClienteCod ? `✏️ Editando Cliente [${editandoClienteCod}]` : 'Registrar / Editar Cliente'}</h3>
                    {editandoClienteCod && (
                      <button type="button" onClick={() => { setEditandoClienteCod(null); setCodClienteForm(''); setNombreClienteForm(''); setApodoClienteForm(''); setDocClienteForm(''); }} className="text-xs text-slate-400">
                        Cancelar ✕
                      </button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-400">Código</label>
                      <input disabled={!!editandoClienteCod} value={codClienteForm} onChange={(e) => setCodClienteForm(e.target.value)} placeholder="Ej. 001" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs font-mono mt-1 disabled:opacity-60" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">DNI / RUC</label>
                      <input value={docClienteForm} onChange={(e) => setDocClienteForm(e.target.value)} placeholder="Opcional" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs font-mono mt-1" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-xs text-slate-400">Apodo / Nombre Corto</label>
                      <input value={apodoClienteForm} onChange={(e) => setApodoClienteForm(e.target.value)} placeholder="Ej. Sra. Rosa" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs mt-1" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400">Nombre Completo / Razón</label>
                      <input value={nombreClienteForm} onChange={(e) => setNombreClienteForm(e.target.value)} placeholder="Nombre completo" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs mt-1" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-2.5 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                    {editandoClienteCod ? '💾 GUARDAR CAMBIOS' : '+ GUARDAR CLIENTE'}
                  </button>
                </form>

                <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-2">
                  <h3 className="text-xs font-black text-slate-300 uppercase">Carga Masiva desde Excel (cod | nombre | apodo | dni)</h3>
                  <textarea
                    rows={3}
                    value={csvTexto}
                    onChange={(e) => setCsvTexto(e.target.value)}
                    placeholder="001	ROSA PEREZ	Sra. Rosa	41258963"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-xs font-mono"
                  />
                  <button type="button" onClick={importarClientes} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-600 font-black rounded-xl text-xs">
                    IMPORTAR LISTA MASIVA
                  </button>
                </div>
              </div>

              <div className="max-h-[430px] overflow-y-auto divide-y divide-slate-800 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs">
                {clientesActivos.length === 0 && (
                  <p className="text-slate-500 py-2">Sin clientes registrados aún.</p>
                )}
                {clientesActivos.map(c => (
                  <div key={c.cod} className="py-2.5 flex items-center justify-between gap-2">
                    <div>
                      <span><strong className="text-sky-400">[{c.cod}]</strong> <strong className="text-white">{c.apodo}</strong></span>
                      <p className="text-[11px] text-slate-400 truncate max-w-[190px]">{c.cliente} {c.docIdentidad ? `• ${c.docIdentidad}` : ''}</p>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <button
                        type="button"
                        onClick={() => {
                          setEditandoClienteCod(c.cod);
                          setCodClienteForm(c.cod);
                          setNombreClienteForm(c.cliente);
                          setApodoClienteForm(c.apodo);
                          setDocClienteForm(c.docIdentidad || '');
                        }}
                        className="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-sky-950 border border-sky-700 text-sky-300"
                      >
                        ✏️ Editar
                      </button>
                      <button
                        type="button"
                        onClick={() => eliminarClienteBaja(c)}
                        className="px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-rose-950 border border-rose-700 text-rose-300"
                      >
                        🗑️ Eliminar
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SUB-PESTAÑA NUBE */}
          {subTab === 'NUBE' && esDev && (
            <div className="bg-slate-950 border border-emerald-500/40 p-5 rounded-2xl space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-base font-black text-emerald-400">Conexión en Tiempo Real (Supabase + Google Drive Sheets)</h3>
                  <p className="text-xs text-slate-400">Sincroniza usuarios, autorizaciones por PIN, bajas y movimientos al instante.</p>
                </div>
                <span className={`px-3 py-1 rounded-full text-xs font-black ${sbConectado ? 'bg-emerald-950 text-emerald-300 border border-emerald-500' : 'bg-slate-800 text-slate-400'}`}>
                  {sbConectado ? '● CONECTADO' : '○ LOCAL / SIN NUBE'}
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400">Supabase Project URL</label>
                  <input
                    type="text"
                    value={sbUrl}
                    onChange={(e) => setSbUrl(e.target.value)}
                    placeholder="https://lhkzagetgxgaxpjhugxy.supabase.co"
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Supabase Anon Public Key</label>
                  <input
                    type="password"
                    value={sbKey}
                    onChange={(e) => setSbKey(e.target.value)}
                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs text-slate-400">Google Apps Script Web App URL (Opcional — Espejo Tablilla Mensual en Drive)</label>
                <input
                  type="text"
                  value={webhookUrl}
                  onChange={(e) => setWebhookUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                />
              </div>

              <button
                type="button"
                onClick={onConectarSupabase}
                className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-sm"
              >
                CONECTAR Y SINCRONIZAR EN TIEMPO REAL
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
