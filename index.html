      const [mostrarPin, setMostrarPin] = useState(false);
      const [loginError, setLoginError] = useState('');
      const [cuentaBloqueadaMsg, setCuentaBloqueadaMsg] = useState(false);

      const [tabActiva, setTabActiva] = useState('KARDEX');
      const [fechaOperativa, setFechaOperativa] = useState('2026-11-19');
      const [online, setOnline] = useState(true);
      const [colaOffline, setColaOffline] = useState([]);
      const [toast, setToast] = useState(null);

      // Configuración Supabase / Tiempo Real
      const [sbUrl, setSbUrl] = useState(() => localStorage.getItem('avimoa_sb_url') || '');
      const [sbKey, setSbKey] = useState(() => localStorage.getItem('avimoa_sb_key') || '');
      const [webhookUrl, setWebhookUrl] = useState(() => localStorage.getItem('avimoa_webhook_url') || '');
      const [sbConectado, setSbConectado] = useState(false);
      const supabaseRef = useRef(null);

      // Correlativos Independientes por Talonario Empresa
      const [correlativos, setCorrelativos] = useState(() => {
        const guardado = localStorage.getItem('avimoa_correlativos');
        return guardado
          ? JSON.parse(guardado)
          : {
              'PLUMÍFERO': { numero: 1601, inicializado: false },
              'LOS 7 POLLITOS': { numero: 1432, inicializado: false },
            };
      });

      // Catálogos Maestros Editables
      const [galpones, setGalpones] = useState(GALPONES_INIT);
      const [placas, setPlacas] = useState(PLACAS_INIT);
      const [choferes, setChoferes] = useState(CHOFERES_INIT);
      const [clientes, setClientes] = useState(CLIENTES_INIT);

      // Movimientos del Turno
      const [saldoInicial] = useState(0);
      const [ingresos, setIngresos] = useState([
        { id: 'i-1', sector: 'San Francisco', numeroGalpon: 'Galpón Único', empresa: 'PLUMÍFERO', placa: 'PLU-801', chofer: 'Demetrio', jabas: 200, aves: 1600, modo: 'DIGITAL' }
      ]);
      const [guias, setGuias] = useState([]);
      const [mermasAnte, setMermasAnte] = useState([]);
      const [confirmacionPre, setConfirmacionPre] = useState(null);
      const [faenadoManana, setFaenadoManana] = useState(null);
      const [pesoFaenado, setPesoFaenado] = useState(0);
      const [mermaPost, setMermaPost] = useState(0);
      const [confirmacionPost, setConfirmacionPost] = useState(null);
      const [alertas, setAlertas] = useState([]);

      const [mostrarNotas, setMostrarNotas] = useState(false);
      const [notasCliente, setNotasCliente] = useState([]);
      const [nuevaNota, setNuevaNota] = useState('');

      const notificar = (msg, tipo = 'ok') => {
        setToast({ msg, tipo });
        setTimeout(() => setToast(null), 4000);
      };

      const guardarUsuariosLocalYNube = async (listaActualizada, usuarioModificado = null) => {
        setUsuarios(listaActualizada);
        localStorage.setItem('avimoa_usuarios', JSON.stringify(listaActualizada));
        if (supabaseRef.current && online && usuarioModificado) {
          await supabaseRef.current.from('usuarios_app').upsert({
            dni: usuarioModificado.dni,
            nombre: usuarioModificado.nombre,
            rol: usuarioModificado.rol,
            pin: usuarioModificado.pin,
            intentos_fallidos: usuarioModificado.intentosFallidos,
            bloqueado: usuarioModificado.bloqueado,
            updated_at: new Date().toISOString(),
          });
        }
      };

      const actualizarCorrelativoEmpresa = async (empresa, nuevoNumero, marcadoInicializado = true) => {
        const actualizado = {
          ...correlativos,
          [empresa]: { numero: Number(nuevoNumero), inicializado: marcadoInicializado },
        };
        setCorrelativos(actualizado);
        localStorage.setItem('avimoa_correlativos', JSON.stringify(actualizado));

        if (supabaseRef.current && online) {
          await supabaseRef.current
            .from('correlativos_talonario')
            .upsert({ empresa, correlativo_actual: Number(nuevoNumero), inicializado: marcadoInicializado });
        }
      };

      const conectarSupabase = async (urlParam = sbUrl, keyParam = sbKey, silencioso = false) => {
        if (!urlParam || !keyParam || !window.supabase) return;
        try {
          const client = window.supabase.createClient(urlParam.trim(), keyParam.trim());
          const { data: usersData, error } = await client.from('usuarios_app').select('*');
          if (error) throw error;

          supabaseRef.current = client;
          setSbConectado(true);
          localStorage.setItem('avimoa_sb_url', urlParam.trim());
          localStorage.setItem('avimoa_sb_key', keyParam.trim());

          if (usersData && usersData.length > 0) {
            const mapeados = usersData.map(u => ({
              dni: u.dni,
              nombre: u.nombre,
              rol: u.rol,
              pin: u.pin,
              intentosFallidos: u.intentos_fallidos || 0,
              bloqueado: !!u.bloqueado,
            }));
            setUsuarios(mapeados);
            localStorage.setItem('avimoa_usuarios', JSON.stringify(mapeados));
          }

          const { data: corrData } = await client.from('correlativos_talonario').select('*');
          if (corrData && corrData.length > 0) {
            const mapa = { ...correlativos };
            corrData.forEach(r => {
              mapa[r.empresa] = { numero: r.correlativo_actual, inicializado: r.inicializado };
            });
            setCorrelativos(mapa);
            localStorage.setItem('avimoa_correlativos', JSON.stringify(mapa));
          }

          await cargarDatosDelDiaDesdeNube(client, fechaOperativa);

          client
            .channel('avimoa-realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios_app' }, async () => {
              const { data } = await client.from('usuarios_app').select('*');
              if (data) {
                const m = data.map(u => ({
                  dni: u.dni, nombre: u.nombre, rol: u.rol, pin: u.pin,
                  intentosFallidos: u.intentos_fallidos || 0, bloqueado: !!u.bloqueado
                }));
                setUsuarios(m);
                localStorage.setItem('avimoa_usuarios', JSON.stringify(m));
              }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'movimientos_ingreso' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'guias_pluma' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'mermas_ante_mortem' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'correlativos_talonario' }, async () => {
              const { data } = await client.from('correlativos_talonario').select('*');
              if (data) {
                const m = {};
                data.forEach(r => { m[r.empresa] = { numero: r.correlativo_actual, inicializado: r.inicializado }; });
                setCorrelativos(prev => ({ ...prev, ...m }));
              }
            })
            .subscribe();

          if (!silencioso) notificar('Avimoa conectado en TIEMPO REAL con Supabase.');
        } catch (err) {
          setSbConectado(false);
          if (!silencioso) notificar('Error conectando a Supabase. Verifica URL/Key o ejecuta el SQL.', 'err');
        }
      };

      const cargarDatosDelDiaDesdeNube = async (client, fecha) => {
        try {
          const [resIng, resGuias, resMermas, resGalp, resPlacas, resChof, resCli] = await Promise.all([
            client.from('movimientos_ingreso').select('*').eq('fecha_operativa', fecha),
            client.from('guias_pluma').select('*').eq('fecha_operativa', fecha),
            client.from('mermas_ante_mortem').select('*').eq('fecha_operativa', fecha),
            client.from('galpones').select('*'),
            client.from('placas').select('*'),
            client.from('choferes').select('*'),
            client.from('clientes').select('*'),
          ]);

          if (resIng.data) {
            setIngresos(resIng.data.map(r => ({
              id: r.id, sector: r.sector, numeroGalpon: r.numero_galpon, empresa: r.empresa,
              placa: r.placa, chofer: r.chofer, jabas: r.jabas, aves: r.aves, modo: r.modo
            })));
          }
          if (resGuias.data) {
            setGuias(resGuias.data.map(r => ({
              id: r.id, fecha: r.fecha_operativa, empresa: r.empresa, numero: r.numero,
              cod: r.cod_cliente, cliente: r.cliente, docIdentidad: r.doc_identidad,
              vendedor: r.vendedor, detalle: r.detalle, precioKg: r.precio_kg,
              jabas: r.jabas, aves: r.aves, peso: r.peso, totalSoles: r.total_soles,
              filas: r.filas_json || []
            })));
          }
          if (resMermas.data) {
            setMermasAnte(resMermas.data.map(r => ({
              id: r.id, placa: r.placa, aves: r.aves, peso: r.peso, motivo: r.motivo, conFoto: r.con_foto
            })));
          }
          if (resGalp.data && resGalp.data.length > 0) {
            setGalpones(resGalp.data.map(r => ({
              id: r.id, sector: r.sector, numeroGalpon: r.numero_galpon, referencia: r.referencia, empresaId: r.empresa_id
            })));
          }
          if (resPlacas.data && resPlacas.data.length > 0) {
            setPlacas(resPlacas.data.map(r => ({
              id: r.id, placa: r.placa, modelo: r.modelo, empresaId: r.empresa_id, choferId: r.chofer_id
            })));
          }
          if (resChof.data && resChof.data.length > 0) setChoferes(resChof.data);
          if (resCli.data && resCli.data.length > 0) {
            setClientes(resCli.data.map(r => ({
              cod: r.cod, cliente: r.cliente, apodo: r.apodo, docIdentidad: r.doc_identidad || ''
            })));
          }
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        if (sbUrl && sbKey) conectarSupabase(sbUrl, sbKey, true);
      }, []);

      const sincronizarOperacionNube = async (tabla, payload, conceptoOffline) => {
        if (!online || !supabaseRef.current) {
          setColaOffline(prev => [...prev, { id: Date.now(), tabla, payload, concepto: conceptoOffline }]);
          return;
        }
        await supabaseRef.current.from(tabla).upsert(payload);
        if (webhookUrl) {
          fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tabla, fechaOperativa, payload })
          }).catch(() => {});
        }
      };

      // =======================================================================
      // VALIDACIÓN DE LOGIN CON DNI VISIBLE, PIN CON OJITO Y BLOQUEO AL 3ER INTENTO
      // =======================================================================
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        setCuentaBloqueadaMsg(false);

        const dniLimpio = dniInput.trim();
        if (dniLimpio.length !== 8) {
          setLoginError('Ingrese un número de DNI válido de 8 dígitos.');
          return;
        }
        if (pinInput.length !== 4) {
          setLoginError('Ingrese su PIN de 4 dígitos.');
          return;
        }

        // Si hay conexión Supabase, consultar estado fresco del usuario en la nube
        let listaBase = [...usuarios];
        if (supabaseRef.current && online) {
          const { data } = await supabaseRef.current.from('usuarios_app').select('*').eq('dni', dniLimpio).maybeSingle();
          if (data) {
            const idx = listaBase.findIndex(u => u.dni === dniLimpio);
            const objNube = {
              dni: data.dni,
              nombre: data.nombre,
              rol: data.rol,
              pin: data.pin,
              intentosFallidos: data.intentos_fallidos || 0,
              bloqueado: !!data.bloqueado,
            };
            if (idx >= 0) listaBase[idx] = objNube;
            else listaBase.push(objNube);
          }
        }

        const userIdx = listaBase.findIndex(u => u.dni === dniLimpio);
        if (userIdx === -1) {
          setLoginError('DNI no registrado en Avimoa. Solicite su alta al Desarrollador.');
          return;
        }

        const user = listaBase[userIdx];

        // Verificar que coincida el tipo de acceso elegido (Desarrollador vs Responsable)
        if (tipoAccesoLogin === 'DESARROLLADOR' && user.rol !== 'DESARROLLADOR') {
          setLoginError('Este DNI corresponde a un Responsable de módulo. Cambie a la opción "Responsable".');
          return;
        }
        if (tipoAccesoLogin === 'RESPONSABLE' && user.rol === 'DESARROLLADOR') {
          setLoginError('Este DNI pertenece al Desarrollador. Seleccione la opción "Desarrollador".');
          return;
        }

        // Verificar bloqueo previo
        if (user.bloqueado) {
          setCuentaBloqueadaMsg(true);
          setLoginError('USUARIO BLOQUEADO tras 3 intentos fallidos. Solo el Desarrollador puede generar un nuevo PIN.');
          return;
        }

        // Validar PIN
        if (user.pin !== pinInput) {
          const nuevosIntentos = (user.intentosFallidos || 0) + 1;
          const debeBloquear = user.rol !== 'DESARROLLADOR' && nuevosIntentos >= 3;

          const userActualizado = {
            ...user,
            intentosFallidos: nuevosIntentos,
            bloqueado: debeBloquear,
          };
          listaBase[userIdx] = userActualizado;
          await guardarUsuariosLocalYNube(listaBase, userActualizado);

          if (debeBloquear) {
            setCuentaBloqueadaMsg(true);
            setLoginError('🔒 CUENTA BLOQUEADA: Alcanzaste el 3er intento fallido. Pide al Desarrollador que te genere un nuevo PIN.');
          } else if (user.rol === 'DESARROLLADOR') {
            setLoginError('PIN de Desarrollador incorrecto. Verifica con el ícono del ojito e intenta nuevamente.');
          } else {
            const restantes = 3 - nuevosIntentos;
            setLoginError(`⚠️ PIN incorrecto. Te ${restantes === 1 ? 'queda 1 intento' : `quedan ${restantes} intentos`} antes del bloqueo.`);
          }
          return;
        }

        // Acceso Exitoso: reiniciar contador de intentos fallidos
        const userLimpio = { ...user, intentosFallidos: 0, bloqueado: false };
        listaBase[userIdx] = userLimpio;
        await guardarUsuariosLocalYNube(listaBase, userLimpio);

        setUsuarioActivo(userLimpio);
        setPinInput('');
        setMostrarPin(false);
        setLoginError('');
        setCuentaBloqueadaMsg(false);

        const permitidos = PERMISOS_ROL[userLimpio.rol];
        setTabActiva(permitidos.includes('KARDEX') ? 'KARDEX' : permitidos[0]);
      };

      const nombreEmpresa = (empId) => EMPRESAS.find(e => e.id === empId)?.nombreCorto || 'CONSOLIDADO';
      const nombreChofer = (chId) => choferes.find(c => c.id === chId)?.nombre || 'Sin asignar';

      const totalIngresosAves = ingresos.reduce((a, b) => a + b.aves, 0);
      const totalVentasVivoAves = guias.reduce((a, b) => a + b.aves, 0);
      const totalMermaAnteAves = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const saldoTeoricoPreFaenado = saldoInicial + totalIngresosAves - totalVentasVivoAves - totalMermaAnteAves;
      const basePreFaenado = confirmacionPre ? confirmacionPre.fisico : saldoTeoricoPreFaenado;
      const saldoTeoricoPostFaenado = basePreFaenado - (faenadoManana || 0) - mermaPost;

      const toggleRed = async () => {
        const nuevoEstado = !online;
        setOnline(nuevoEstado);
        if (nuevoEstado && colaOffline.length > 0) {
          if (supabaseRef.current) {
            for (const item of colaOffline) {
              if (item.tabla && item.payload) {
                await supabaseRef.current.from(item.tabla).upsert(item.payload);
              }
            }
          }
          notificar(`Sincronizados ${colaOffline.length} registros pendientes con la nube.`);
          setColaOffline([]);
        } else if (!nuevoEstado) {
          notificar('Modo SIN SEÑAL activado: Los registros se guardarán localmente.', 'warn');
        }
      };

      // =======================================================================
      // PANTALLA DE INGRESO (LOGIN AVIMOA: RESPONSABLE VS DESARROLLADOR)
      // =======================================================================
      if (!usuarioActivo) {
        const bloqueadosCount = usuarios.filter(u => u.bloqueado).length;

        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
            <div className="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
              {/* LOGO AVIMOA */}
              <div className="pt-1">
                <LogoAvimoa />
                <div className="flex justify-center mt-2">
                  <span className={`inline-flex items-center gap-1.5 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase border ${
                    sbConectado
                      ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
                      : 'bg-slate-800 text-slate-400 border-slate-700'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${sbConectado ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}`}></span>
                    {sbConectado ? 'Nube Tiempo Real Activa' : 'Plumífero & Los 7 Pollitos'}
                  </span>
                </div>
              </div>

              {/* SELECTOR DOS OPCIONES: RESPONSABLE vs DESARROLLADOR */}
              <div className="grid grid-cols-2 gap-1.5 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                <button
                  type="button"
                  onClick={() => {
                    setTipoAccesoLogin('RESPONSABLE');
                    setLoginError('');
                    setCuentaBloqueadaMsg(false);
                  }}
                  className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${
                    tipoAccesoLogin === 'RESPONSABLE'
                      ? 'bg-amber-500 text-slate-950 shadow-md'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>👷</span> RESPONSABLE
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setTipoAccesoLogin('DESARROLLADOR');
                    setLoginError('');
                    setCuentaBloqueadaMsg(false);
                  }}
                  className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 relative ${
                    tipoAccesoLogin === 'DESARROLLADOR'
                      ? 'bg-emerald-500 text-slate-950 shadow-md'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>🛡️</span> DESARROLLADOR
                  {bloqueadosCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">
                      {bloqueadosCount}
                    </span>
                  )}
                </button>
              </div>

              {/* FORMULARIO DNI VISIBLE + PIN CON OJITO */}
              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                    Número de DNI ({tipoAccesoLogin === 'DESARROLLADOR' ? 'Desarrollador' : 'Responsable de Módulo'})
                  </label>
                  <input
                    type="text"
                    inputMode="numeric"
                    maxLength={8}
                    value={dniInput}
                    onChange={(e) => {
                      setDniInput(e.target.value.replace(/\D/g, ''));
                      setLoginError('');
                    }}
                    placeholder="Ej. 47720216"
                    className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl px-4 py-3.5 text-center text-2xl tracking-[0.25em] font-mono font-bold text-white outline-none transition"
                  />
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1.5">
                    <label className="text-xs font-bold text-slate-300 uppercase">
                      PIN de Acceso (4 dígitos)
                    </label>
                    <span className="text-[11px] text-slate-400">
                      {mostrarPin ? 'PIN visible' : 'Pulsa el ojo para verificar'}
                    </span>
                  </div>
                  <div className="relative">
                    <input
                      type={mostrarPin ? 'text' : 'password'}
                      inputMode="numeric"
                      maxLength={4}
                      value={pinInput}
                      onChange={(e) => {
                        setPinInput(e.target.value.replace(/\D/g, ''));
                        setLoginError('');
                      }}
                      placeholder="••••"
                      className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl py-3.5 pl-4 pr-14 text-center text-3xl tracking-[0.6em] font-mono font-black text-amber-400 outline-none transition"
                    />
                    <button
                      type="button"
                      onClick={() => setMostrarPin(!mostrarPin)}
                      title={mostrarPin ? 'Ocultar PIN' : 'Mostrar PIN'}
                      className="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition"
                    >
                      {mostrarPin ? (
                        <svg className="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                        </svg>
                      ) : (
                        <svg className="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                          <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                          <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                      )}
                    </button>
                  </div>
                </div>

                {loginError && (
                  <div className={`p-3.5 rounded-2xl border text-xs font-bold text-center ${
                    cuentaBloqueadaMsg
                      ? 'bg-rose-950/90 border-rose-500 text-rose-200 animate-pulse'
                      : 'bg-amber-950/70 border-amber-500/60 text-amber-200'
                  }`}>
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className={`w-full py-4 font-black rounded-2xl text-base shadow-lg transition ${
                    tipoAccesoLogin === 'DESARROLLADOR'
                      ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                      : 'bg-amber-500 hover:bg-amber-400 text-slate-950'
                  }`}
                >
                  {tipoAccesoLogin === 'DESARROLLADOR' ? 'INGRESAR COMO DESARROLLADOR' : 'INGRESAR A AVIMOA'}
                </button>
              </form>

              <div className="border-t border-slate-800/80 pt-3 text-center">
                <p className="text-[11px] text-slate-500">
                  Seguridad activa: al <strong className="text-slate-300">3er intento fallido</strong> el usuario se bloquea automáticamente.
                </p>
              </div>
            </div>
          </div>
        );
      }

      const tabsDisponibles = [
        { id: 'INGRESOS', label: '1. Traslado Galpón' },
        { id: 'GUIAS', label: '2. Guía Pluma (PDF)' },
        { id: 'CONTEO_ANTE', label: '3. Conteo & Ante-Mortem' },
        { id: 'FAENADO_POST', label: '4. Faenado & Post-Mortem' },
        { id: 'KARDEX', label: '5. Kardex & Reportes' },
        { id: 'MAESTROS', label: '6. Usuarios, Maestros & Nube' },
      ].filter((t) => PERMISOS_ROL[usuarioActivo.rol].includes(t.id));

      const usuariosBloqueados = usuarios.filter(u => u.bloqueado);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-4">
                <LogoAvimoa compact />
                <div className="hidden sm:block h-8 w-px bg-slate-800"></div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded uppercase ${
                      usuarioActivo.rol === 'DESARROLLADOR' ? 'bg-emerald-500 text-slate-950' : 'bg-amber-500 text-slate-950'
                    }`}>
                      {usuarioActivo.rol}
                    </span>
                    <span className="text-xs font-bold text-white">{usuarioActivo.nombre}</span>
                    {sbConectado && (
                      <span className="bg-emerald-950 border border-emerald-600 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full">
                        LIVE
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[11px] text-slate-400">Fecha Operativa:</span>
                    <input
                      type="date"
                      value={fechaOperativa}
                      onChange={(e) => {
                        setFechaOperativa(e.target.value);
                        if (supabaseRef.current) cargarDatosDelDiaDesdeNube(supabaseRef.current, e.target.value);
                      }}
                      className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono text-amber-300"
                    />
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {usuarioActivo.rol === 'DESARROLLADOR' && usuariosBloqueados.length > 0 && (
                  <button
                    onClick={() => setTabActiva('MAESTROS')}
                    className="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-600 text-white animate-pulse"
                  >
                    🔒 {usuariosBloqueados.length} Bloqueado(s)
                  </button>
                )}

                <button
                  onClick={toggleRed}
                  className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
                    online
                      ? 'bg-emerald-950/80 border-emerald-600 text-emerald-300'
                      : 'bg-amber-950/90 border-amber-500 text-amber-300 animate-pulse'
                  }`}
                >
                  {online ? '● EN LÍNEA' : `○ SIN SEÑAL (${colaOffline.length})`}
                </button>

                <button
                  onClick={() => setMostrarNotas(!mostrarNotas)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-900/70 border border-sky-600 text-sky-200"
                >
                  Notas ({notasCliente.length})
                </button>

                <button
                  onClick={() => {
                    setUsuarioActivo(null);
                    setDniInput('');
                    setPinInput('');
                  }}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200"
                >
                  Salir
                </button>
              </div>
            </div>

            <nav className="max-w-5xl mx-auto flex gap-1.5 overflow-x-auto pt-3 pb-1">
              {tabsDisponibles.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTabActiva(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                    tabActiva === t.id
                      ? 'bg-amber-500 text-slate-950 shadow'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </nav>
          </header>

          {toast && (
            <div className="fixed bottom-4 right-4 left-4 md:left-auto md:w-96 z-50">
              <div
                className={`p-4 rounded-2xl shadow-2xl border text-sm font-bold ${
                  toast.tipo === 'err'
                    ? 'bg-rose-950 border-rose-500 text-rose-100'
                    : toast.tipo === 'warn'
                    ? 'bg-amber-950 border-amber-500 text-amber-100'
                    : 'bg-emerald-950 border-emerald-500 text-emerald-100'
                }`}
              >
                {toast.msg}
              </div>
            </div>
          )}

          {mostrarNotas && (
            <div className="max-w-5xl mx-auto px-4 pt-4">
              <div className="bg-sky-950/60 border border-sky-700 p-4 rounded-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sky-300 text-sm">Bitácora de Observaciones Operativas</h3>
                  <button onClick={() => setMostrarNotas(false)} className="text-xs text-slate-400">Cerrar ✕</button>
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={nuevaNota}
                    onChange={(e) => setNuevaNota(e.target.value)}
                    placeholder="Anota aquí cualquier incidencia o ajuste del turno..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                  />
                  <button
                    onClick={() => {
                      if (!nuevaNota.trim()) return;
                      setNotasCliente([...notasCliente, { hora: new Date().toLocaleTimeString(), texto: nuevaNota }]);
                      setNuevaNota('');
                    }}
                    className="bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold"
                  >
                    Guardar
                  </button>
                </div>
                {notasCliente.map((n, idx) => (
                  <p key={idx} className="text-xs bg-slate-900/90 p-2 rounded-lg border border-slate-800">
                    <span className="text-sky-400 font-mono">[{n.hora}]</span> {n.texto}
                  </p>
                ))}
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-4 space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Ingresos Galpón</p>
                <p className="text-2xl font-black text-emerald-400">+{totalIngresosAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Guías Pluma (Vivo)</p>
                <p className="text-2xl font-black text-sky-400">-{totalVentasVivoAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Merma Ante-Mortem</p>
                <p className="text-2xl font-black text-rose-400">-{totalMermaAnteAves}</p>
              </div>
              <div className="bg-slate-900 border border-amber-500/40 p-3.5 rounded-2xl">
                <p className="text-xs text-amber-300 font-bold">Saldo Vivo Disponible</p>
                <p className="text-2xl font-black text-white">{saldoTeoricoPreFaenado} aves</p>
              </div>
            </div>

            {tabActiva === 'INGRESOS' && (
              <ModuloIngresoGalpon
                galpones={galpones}
                placas={placas}
                choferes={choferes}
                nombreEmpresa={nombreEmpresa}
                congelado={!!confirmacionPre}
                onRegistrar={(nuevo) => {
                  setIngresos([...ingresos, nuevo]);
                  sincronizarOperacionNube(
                    'movimientos_ingreso',
                    {
                      id: nuevo.id,
                      fecha_operativa: fechaOperativa,
                      sector: nuevo.sector,
                      numero_galpon: nuevo.numeroGalpon,
                      empresa: nuevo.empresa,
                      placa: nuevo.placa,
                      chofer: nuevo.chofer,
                      jabas: nuevo.jabas,
                      aves: nuevo.aves,
                      modo: nuevo.modo,
                    },
                    `Ingreso ${nuevo.placa}: ${nuevo.aves} aves`
                  );
                  notificar(`Ingreso registrado: +${nuevo.aves} aves (${nuevo.sector} - ${nuevo.numeroGalpon})`);
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'GUIAS' && (
              <ModuloGuiaPluma
                fechaOperativa={fechaOperativa}
                clientes={clientes}
                guias={guias}
                correlativos={correlativos}
                onGuardarInicioCorrelativo={(emp, num) => {
                  actualizarCorrelativoEmpresa(emp, num, true);
                  notificar(`Correlativo inicial de ${emp} guardado en N° ${String(num).padStart(6, '0')}.`);
                }}
                congelado={!!confirmacionPre}
                onRegistrar={(guia, descargarAhora) => {
                  setGuias([...guias, guia]);
                  const siguiente = Number(guia.numero) + 1;
                  actualizarCorrelativoEmpresa(guia.empresa, siguiente, true);

                  sincronizarOperacionNube(
                    'guias_pluma',
                    {
                      id: guia.id,
                      fecha_operativa: fechaOperativa,
                      empresa: guia.empresa,
                      numero: guia.numero,
                      cod_cliente: guia.cod,
                      cliente: guia.cliente,
                      doc_identidad: guia.docIdentidad,
                      vendedor: guia.vendedor,
                      detalle: guia.detalle,
                      precio_kg: guia.precioKg,
                      jabas: guia.jabas,
                      aves: guia.aves,
                      peso: guia.peso,
                      total_soles: guia.totalSoles,
                      filas_json: guia.filas,
                    },
                    `Guía #${guia.numero}: ${guia.aves} aves`
                  );

                  if (descargarAhora) {
                    descargarPDFNotaPedido(guia);
                    notificar(`Nota de Pedido N° ${guia.numero} emitida y PDF descargado.`);
                  } else {
                    notificar(`Nota de Pedido N° ${guia.numero} guardada (-${guia.aves} aves).`);
                  }
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'CONTEO_ANTE' && (
              <ModuloConteoAnteMortem
                placas={placas}
                nombreChofer={nombreChofer}
                mermasAnte={mermasAnte}
                saldoTeorico={saldoTeoricoPreFaenado}
                confirmacionPre={confirmacionPre}
                usuario={usuarioActivo}
                onAgregarMerma={(m) => {
                  setMermasAnte([...mermasAnte, m]);
                  sincronizarOperacionNube(
                    'mermas_ante_mortem',
                    {
                      id: m.id,
                      fecha_operativa: fechaOperativa,
                      placa: m.placa,
                      aves: m.aves,
                      peso: m.peso,
                      motivo: m.motivo,
                      con_foto: m.conFoto,
                    },
                    `Merma Ante-Mortem: ${m.aves} aves`
                  );
                  notificar(`Merma Ante-Mortem registrada (-${m.aves} aves)`, 'warn');
                }}
                onConfirmarFisico={(acta) => {
                  setConfirmacionPre(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE CONTEO FÍSICO: Teórico ${acta.teorico} vs Físico ${acta.fisico} (Diff: ${acta.diferencia})`]);
                  }
                  sincronizarOperacionNube(
                    'cierres_turno',
                    {
                      id: `pre-${fechaOperativa}`,
                      fecha_operativa: fechaOperativa,
                      tipo: 'CONTEO_PRE',
                      teorico: acta.teorico,
                      fisico: acta.fisico,
                      diferencia: acta.diferencia,
                      responsable: acta.responsable,
                      hora: acta.hora,
                    },
                    'Acta Saldo Físico'
                  );
                  notificar('Acta de Saldo Físico sellada con PIN. Turno congelado.');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'FAENADO_POST' && (
              <ModuloFaenadoPostMortem
                basePreFaenado={basePreFaenado}
                faenadoManana={faenadoManana}
                mermaPost={mermaPost}
                saldoTeoricoPost={saldoTeoricoPostFaenado}
                confirmacionPost={confirmacionPost}
                usuario={usuarioActivo}
                onRegistrarFaenado={(f, pKg, mp) => {
                  setFaenadoManana(f);
                  setPesoFaenado(pKg);
                  setMermaPost(mp);
                  notificar(`Faenado registrado (${f} aves / ${pKg} kg) y Merma Post-Mortem (${mp} aves).`);
                }}
                onConfirmarPost={(acta) => {
                  setConfirmacionPost(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE POST-FAENADO: Remanente Teórico ${acta.teorico} vs Físico ${acta.fisico}`]);
                  }
                  sincronizarOperacionNube(
                    'cierres_turno',
                    {
                      id: `post-${fechaOperativa}`,
                      fecha_operativa: fechaOperativa,
                      tipo: 'CIERRE_POST',
                      teorico: acta.teorico,
                      fisico: acta.fisico,
                      diferencia: acta.diferencia,
                      faenado_aves: faenadoManana || 0,
                      faenado_kg: pesoFaenado || 0,
                      merma_post: mermaPost || 0,
                      responsable: acta.responsable,
                      hora: acta.hora,
                    },
                    'Cierre Post-Faenado'
                  );
                  notificar('Cierre Post-Faenado confirmado con PIN.');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'KARDEX' && (
              <ModuloKardexDashboard
                fechaOperativa={fechaOperativa}
                ingresos={ingresos}
                guias={guias}
                mermasAnte={mermasAnte}
                confirmacionPre={confirmacionPre}
                faenadoManana={faenadoManana}
                pesoFaenado={pesoFaenado}
                mermaPost={mermaPost}
                confirmacionPost={confirmacionPost}
                saldoTeoricoPreFaenado={saldoTeoricoPreFaenado}
                alertas={alertas}
                notificar={notificar}
              />
            )}

            {tabActiva === 'MAESTROS' && (
              <ModuloMaestros
                usuarioActivo={usuarioActivo}
                usuarios={usuarios}
                onGuardarUsuario={async (nuevoUser) => {
                  const idx = usuarios.findIndex(u => u.dni === nuevoUser.dni);
                  const copia = [...usuarios];
                  if (idx >= 0) copia[idx] = nuevoUser;
                  else copia.push(nuevoUser);
                  await guardarUsuariosLocalYNube(copia, nuevoUser);
                }}
                galpones={galpones}
                setGalpones={setGalpones}
                placas={placas}
                setPlacas={setPlacas}
                choferes={choferes}
                setChoferes={setChoferes}
                clientes={clientes}
                setClientes={setClientes}
                nombreEmpresa={nombreEmpresa}
                nombreChofer={nombreChofer}
                sbUrl={sbUrl}
                setSbUrl={setSbUrl}
                sbKey={sbKey}
                setSbKey={setSbKey}
                webhookUrl={webhookUrl}
                setWebhookUrl={(val) => {
                  setWebhookUrl(val);
                  localStorage.setItem('avimoa_webhook_url', val);
                }}
                sbConectado={sbConectado}
                onConectarSupabase={() => conectarSupabase(sbUrl, sbKey, false)}
                supabaseRef={supabaseRef}
                notificar={notificar}
              />
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 1: INGRESO DE GALPÓN
    // =========================================================================
    function ModuloIngresoGalpon({ galpones, placas, choferes, nombreEmpresa, congelado, onRegistrar, onError }) {
      const sectoresUnicos = [...new Set(galpones.map(g => g.sector))];
      const [sectorSel, setSectorSel] = useState(sectoresUnicos[0] || '');
      const galponesDelSector = galpones.filter(g => g.sector === sectorSel);
      const [galponId, setGalponId] = useState(galponesDelSector[0]?.id || '');

      const [placaId, setPlacaId] = useState(placas[0]?.id || '');
      const [choferId, setChoferId] = useState(placas[0]?.choferId || choferes[0]?.id || '');
      const [jabas, setJabas] = useState(60);
      const [avesPorJaba, setAvesPorJaba] = useState(9);

      const handleCambioSector = (nuevoSector) => {
        setSectorSel(nuevoSector);
        const lista = galpones.filter(g => g.sector === nuevoSector);
        setGalponId(lista[0]?.id || '');
      };

      const handleCambioPlaca = (nuevaPlacaId) => {
        setPlacaId(nuevaPlacaId);
        const veh = placas.find(p => p.id === nuevaPlacaId);
        if (veh?.choferId) setChoferId(veh.choferId);
      };

      const galponObj = galpones.find(g => g.id === galponId) || galponesDelSector[0];
      const placaObj = placas.find(p => p.id === placaId);
      const choferObj = choferes.find(c => c.id === choferId);

      const handleGuardar = (e) => {
        e.preventDefault();
        if (congelado) return onError('Turno congelado por Conteo Físico. Solicite permiso a Supervisión.');
        onRegistrar({
          id: 'ing-' + Date.now(),
          sector: galponObj?.sector || sectorSel,
          numeroGalpon: galponObj?.numeroGalpon || 'Galpón 1',
          empresa: nombreEmpresa(galponObj?.empresaId || placaObj?.empresaId),
          placa: placaObj?.placa || 'S/P',
          chofer: choferObj?.nombre || 'Chofer',
          jabas: Number(jabas),
          aves: Number(jabas) * Number(avesPorJaba),
          modo: 'DIGITAL',
        });
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
          <div>
            <span className="text-xs font-extrabold text-amber-400 uppercase">Módulo 1 • Traslado de Granja</span>
            <h2 className="text-lg font-black text-white">Ingreso de Pollo Vivo (Galpón → Acopio)</h2>
            <p className="text-xs text-slate-400">Selecciona Dirección, N° de Galpón, Placa y Chofer asignado.</p>
          </div>

          <form onSubmit={handleGuardar} className="space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">1. Dirección / Sector de Granja</label>
                <select
                  value={sectorSel}
                  onChange={(e) => handleCambioSector(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {sectoresUnicos.map((sec) => (
                    <option key={sec} value={sec}>{sec}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">2. Número de Galpón (Deduce Empresa)</label>
                <select
                  value={galponId}
                  onChange={(e) => setGalponId(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold text-amber-300"
                >
                  {galponesDelSector.map((g) => (
                    <option key={g.id} value={g.id}>
                      {g.numeroGalpon} — [{nombreEmpresa(g.empresaId)}]
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">3. Placa del Vehículo</label>
                <select
                  value={placaId}
                  onChange={(e) => handleCambioPlaca(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {placas.map((v) => (
                    <option key={v.id} value={v.id}>
                      {v.placa} ({v.modelo}) — [{nombreEmpresa(v.empresaId)}]
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">4. Chofer del Viaje</label>
                <select
                  value={choferId}
                  onChange={(e) => setChoferId(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {choferes.map((ch) => (
                    <option key={ch.id} value={ch.id}>
                      {ch.nombre} {ch.dni ? `(DNI: ${ch.dni})` : ''}
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Cant. Jabas</label>
                <input
                  type="number"
                  min={1}
                  value={jabas}
                  onChange={(e) => setJabas(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                />
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">Pollos x Jaba</label>
                <input
                  type="number"
                  min={1}
                  value={avesPorJaba}
                  onChange={(e) => setAvesPorJaba(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                />
              </div>
              <div className="flex flex-col justify-center items-center">
                <span className="text-xs text-slate-400">Total Ingreso</span>
                <span className="text-2xl font-black text-emerald-400">+{Number(jabas) * Number(avesPorJaba)}</span>
              </div>
            </div>

            <button type="submit" className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-black text-base">
              REGISTRAR INGRESO DE CARRO
            </button>
          </form>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 2: GUÍA PLUMA / NOTA DE PEDIDO (CORRELATIVO + PDF DESCARGABLE)
    // =========================================================================
    function ModuloGuiaPluma({ fechaOperativa, clientes, guias, correlativos, onGuardarInicioCorrelativo, congelado, onRegistrar, onError }) {
      const [empresa, setEmpresa] = useState('PLUMÍFERO');
      const corrInfo = correlativos[empresa] || { numero: 1, inicializado: false };
      const numeroFormateado = String(corrInfo.numero).padStart(6, '0');

      const [editandoCorrelativo, setEditandoCorrelativo] = useState(!corrInfo.inicializado);
      const [inputInicioCorr, setInputInicioCorr] = useState(String(corrInfo.numero));

      useEffect(() => {
        const info = correlativos[empresa] || { numero: 1, inicializado: false };
        setInputInicioCorr(String(info.numero));
        setEditandoCorrelativo(!info.inicializado);
      }, [empresa, correlativos]);

      const [busqueda, setBusqueda] = useState('');
      const [clienteSel, setClienteSel] = useState(clientes[1] || clientes[0]);
      const [clienteLibre, setClienteLibre] = useState('');
      const [docIdentidad, setDocIdentidad] = useState('');
      const [vendedor, setVendedor] = useState('Ferci');
      const [detalleGeneral, setDetalleGeneral] = useState('Pollo Vivo');
      const [precioKg, setPrecioKg] = useState('');

      const [filas, setFilas] = useState([{ peso: 141, jabas: 5, avesJaba: 8, dscto: 0 }]);

      const filtrados = busqueda.trim()
        ? clientes.filter(c =>
            c.cod.includes(busqueda) ||
            c.apodo.toLowerCase().includes(busqueda.toLowerCase()) ||
            c.cliente.toLowerCase().includes(busqueda.toLowerCase())
          )
        : [];

      const totalJabas = filas.reduce((a, b) => a + Number(b.jabas || 0), 0);
      const totalAves = filas.reduce((a, b) => a + Number(b.jabas || 0) * Number(b.avesJaba || 0), 0);
      const totalPeso = filas.reduce((a, b) => a + Number(b.peso || 0), 0);
      const totalDscto = filas.reduce((a, b) => a + Number(b.dscto || 0), 0);
      const pKg = Number(precioKg || 0);
      const totalSoles = pKg > 0 ? Math.max(0, totalPeso * pKg - totalDscto) : 0;

      const emitirGuia = (descargarPdfAhora) => {
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        if (!corrInfo.inicializado) {
          setEditandoCorrelativo(true);
          return onError('Primero fija y guarda el N° de inicio de correlativo del talonario.');
        }
        const nombreDestinatario = clienteLibre.trim() ? clienteLibre.trim() : clienteSel?.apodo;
        if (!nombreDestinatario) return onError('Seleccione un cliente o escriba el destinatario.');
        if (totalAves <= 0 && totalPeso <= 0) return onError('Ingrese al menos una fila de pesada o aves.');

        const nuevaGuia = {
          id: 'g-' + Date.now(),
          fecha: fechaOperativa,
          empresa,
          numero: numeroFormateado,
          cod: clienteLibre.trim() ? '000' : (clienteSel?.cod || '000'),
          cliente: nombreDestinatario,
          docIdentidad: docIdentidad.trim(),
          vendedor: vendedor.trim() || 'ACOPIO',
          detalle: detalleGeneral.trim() || 'Pollo Vivo',
          precioKg: pKg,
          jabas: totalJabas,
          aves: totalAves,
          peso: totalPeso,
          totalSoles,
          filas: filas.map(f => ({
            peso: Number(f.peso || 0),
            jabas: Number(f.jabas || 0),
            avesJaba: Number(f.avesJaba || 0),
            dscto: Number(f.dscto || 0),
            detalle: detalleGeneral.trim() || 'Pollo Vivo'
          }))
        };

        onRegistrar(nuevaGuia, descargarPdfAhora);
        setClienteLibre('');
        setFilas([{ peso: '', jabas: 5, avesJaba: 8, dscto: 0 }]);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
            <div className="flex flex-wrap justify-between items-start gap-3">
              <div>
                <span className="text-xs font-extrabold text-sky-400 uppercase">Módulo 2 • Nota de Pedido / Guía Pluma</span>
                <h2 className="text-lg font-black text-white">Emisión de Guía Pluma y PDF para Cliente</h2>
                <p className="text-xs text-slate-400">Replica el talonario físico (hasta 15 pesadas) con cuentas bancarias por empresa.</p>
              </div>

              <div className="flex items-center gap-2 bg-slate-950 border border-slate-700 px-3 py-2 rounded-2xl">
                <div>
                  <p className="text-[10px] text-slate-400 uppercase font-bold">Nota de Pedido ({empresa})</p>
                  <p className="text-lg font-mono font-black text-rose-400">N° {numeroFormateado}</p>
                </div>
                <button
                  type="button"
                  onClick={() => setEditandoCorrelativo(!editandoCorrelativo)}
                  className="bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500 text-amber-300 px-2.5 py-1.5 rounded-xl text-xs font-extrabold"
                >
                  ⚙️ {corrInfo.inicializado ? 'Ajustar Correlativo' : 'Iniciar Correlativo'}
                </button>
              </div>
            </div>

            {editandoCorrelativo && (
              <div className="bg-amber-950/40 border border-amber-500/60 p-4 rounded-2xl flex flex-wrap items-end justify-between gap-3">
                <div className="space-y-1 flex-1 min-w-[200px]">
                  <p className="text-xs font-black text-amber-300 uppercase">
                    Inicio de Correlativo Físico — Talonario {empresa}
                  </p>
                  <p className="text-xs text-slate-300">
                    Digita el número con el que arranca tu talonario físico hoy; se guardará y avanzará solo (+1) en cada guía.
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <input
                    type="number"
                    min={1}
                    value={inputInicioCorr}
                    onChange={(e) => setInputInicioCorr(e.target.value)}
                    className="w-32 bg-slate-900 border border-amber-400 rounded-xl p-2.5 text-center font-mono font-black text-lg text-white"
                  />
                  <button
                    type="button"
                    onClick={() => {
                      const val = Number(inputInicioCorr);
                      if (!val || val < 1) return onError('Ingrese un número de correlativo válido.');
                      onGuardarInicioCorrelativo(empresa, val);
                      setEditandoCorrelativo(false);
                    }}
                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs"
                  >
                    GUARDAR INICIO
                  </button>
                </div>
              </div>
            )}

            <div className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Talonario Empresa (Cuentas PDF)</label>
                  <select
                    value={empresa}
                    onChange={(e) => setEmpresa(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold text-amber-300"
                  >
                    <option value="PLUMÍFERO">PLUMÍFERO E.I.R.L.</option>
                    <option value="LOS 7 POLLITOS">LOS 7 POLLITOS E.I.R.L.</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Vendedor / Despachador</label>
                  <input
                    type="text"
                    value={vendedor}
                    onChange={(e) => setVendedor(e.target.value)}
                    placeholder="Ej. Ferci"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Doc. Identidad (Opcional)</label>
                  <input
                    type="text"
                    value={docIdentidad}
                    onChange={(e) => setDocIdentidad(e.target.value)}
                    placeholder="DNI o RUC"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-mono"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Buscar Cliente Registrado (Código o Apodo)</label>
                  <input
                    type="text"
                    value={busqueda}
                    onChange={(e) => { setBusqueda(e.target.value); setClienteLibre(''); }}
                    placeholder={clienteSel ? `Seleccionado: [${clienteSel.cod}] ${clienteSel.apodo}` : 'Escriba código ej. 222 o Jhon...'}
                    className="w-full bg-slate-800 border border-sky-500/50 rounded-xl p-3 text-sm"
                  />
                  {filtrados.length > 0 && (
                    <div className="bg-slate-800 border border-slate-700 rounded-xl mt-1 divide-y divide-slate-700 max-h-40 overflow-y-auto">
                      {filtrados.map(c => (
                        <button
                          type="button"
                          key={c.cod}
                          onClick={() => {
                            setClienteSel(c);
                            setDocIdentidad(c.docIdentidad || '');
                            setBusqueda('');
                          }}
                          className="w-full text-left px-3 py-2 hover:bg-slate-700 flex justify-between text-xs"
                        >
                          <span className="font-bold">{c.apodo} ({c.cliente})</span>
                          <span className="font-mono text-sky-400">COD: {c.cod}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div>
                  <label className="block text-xs text-slate-400 mb-1">O escribir Señor(es) / Destino directo</label>
                  <input
                    type="text"
                    value={clienteLibre}
                    onChange={(e) => setClienteLibre(e.target.value)}
                    placeholder="Ej. OFICINA CAMAL o cliente nuevo..."
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Detalle / Glosa en Nota</label>
                  <input
                    type="text"
                    value={detalleGeneral}
                    onChange={(e) => setDetalleGeneral(e.target.value)}
                    placeholder="Ej. Pollo Vivo / Post-Mortem"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Precio x Kg S/ (Dejar vacío si es solo peso)</label>
                  <input
                    type="number"
                    step="0.01"
                    value={precioKg}
                    onChange={(e) => setPrecioKg(e.target.value)}
                    placeholder="0.00 (Opcional)"
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 font-mono text-sm"
                  />
                </div>
              </div>

              <div className="bg-slate-950 border border-slate-800 rounded-2xl p-3 space-y-2">
                <div className="grid grid-cols-12 gap-1.5 text-[11px] font-bold text-slate-400 text-center px-1">
                  <div className="col-span-1">N°</div>
                  <div className="col-span-3">PESO (KG)</div>
                  <div className="col-span-2">JABA</div>
                  <div className="col-span-2">BOLSA</div>
                  <div className="col-span-2">DSCTO</div>
                  <div className="col-span-2">AVES</div>
                </div>

                {filas.map((f, i) => (
                  <div key={i} className="grid grid-cols-12 gap-1.5 items-center">
                    <div className="col-span-1 text-center font-mono text-xs font-bold text-slate-400">{i + 1}</div>
                    <input
                      type="number"
                      step="0.1"
                      value={f.peso}
                      onChange={(e) => { const c = [...filas]; c[i].peso = e.target.value; setFilas(c); }}
                      placeholder="141"
                      className="col-span-3 bg-slate-800 border border-slate-700 rounded-xl p-2 text-center font-mono font-bold"
                    />
                    <input
                      type="number"
                      value={f.jabas}
                      onChange={(e) => { const c = [...filas]; c[i].jabas = e.target.value; setFilas(c); }}
                      placeholder="5"
                      className="col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-2 text-center font-mono"
                    />
                    <input
                      type="number"
                      value={f.avesJaba}
                      onChange={(e) => { const c = [...filas]; c[i].avesJaba = e.target.value; setFilas(c); }}
                      placeholder="8"
                      className="col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-2 text-center font-mono"
                    />
                    <input
                      type="number"
                      step="0.1"
                      value={f.dscto}
                      onChange={(e) => { const c = [...filas]; c[i].dscto = e.target.value; setFilas(c); }}
                      placeholder="0"
                      className="col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-2 text-center font-mono text-xs"
                    />
                    <div className="col-span-2 text-center font-mono text-xs font-black text-sky-400">
                      {Number(f.jabas || 0) * Number(f.avesJaba || 0)}
                    </div>
                  </div>
                ))}

                {filas.length < 15 && (
                  <button
                    type="button"
                    onClick={() => {
                      const u = filas[filas.length - 1];
                      setFilas([...filas, { peso: '', jabas: u.jabas, avesJaba: u.avesJaba, dscto: 0 }]);
                    }}
                    className="w-full py-2.5 border border-dashed border-amber-500/60 rounded-xl text-xs font-bold text-amber-400 hover:bg-amber-500/10"
                  >
                    + Agregar Pesada / Repetir Jaba y Bolsa ( &quot; ) — ({filas.length}/15 filas)
                  </button>
                )}
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-2 bg-slate-950 p-3 rounded-2xl text-center border border-slate-800">
                <div><p className="text-xs text-slate-400">Total Jabas</p><p className="font-black text-lg">{totalJabas}</p></div>
                <div><p className="text-xs text-slate-400">Total Pollos</p><p className="font-black text-lg text-amber-400">-{totalAves}</p></div>
                <div><p className="text-xs text-slate-400">Peso Total</p><p className="font-black text-lg text-emerald-400">{totalPeso.toFixed(1)} kg</p></div>
                <div><p className="text-xs text-slate-400">Total S/</p><p className="font-black text-lg text-sky-400">{totalSoles > 0 ? `S/ ${totalSoles.toFixed(2)}` : '—'}</p></div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <button
                  type="button"
                  onClick={() => emitirGuia(true)}
                  className="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl font-black text-sm shadow-lg"
                >
                  📄 GUARDAR Y DESCARGAR PDF (CLIENTE)
                </button>
                <button
                  type="button"
                  onClick={() => emitirGuia(false)}
                  className="w-full py-4 bg-sky-600 hover:bg-sky-500 text-white rounded-2xl font-black text-sm"
                >
                  ✓ SOLO GUARDAR GUÍA EN SISTEMA
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
            <h3 className="text-sm font-black text-white uppercase">Guías Pluma / Notas de Pedido Emitidas Hoy ({guias.length})</h3>
            {guias.length === 0 ? (
              <p className="text-xs text-slate-500">Aún no se han emitido guías en esta fecha operativa.</p>
            ) : (
              <div className="divide-y divide-slate-800">
                {guias.map((g) => (
                  <div key={g.id} className="py-3 flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-mono font-black text-rose-400 text-sm">N° {String(g.numero).padStart(6, '0')}</span>
                        <span className="text-xs bg-slate-800 px-2 py-0.5 rounded font-bold text-amber-300">{g.empresa}</span>
                        <span className="text-sm font-bold text-white">{g.cliente}</span>
                      </div>
                      <p className="text-xs text-slate-400 mt-0.5">
                        {g.jabas} jabas • {g.aves} aves • {Number(g.peso).toFixed(1)} kg {g.vendedor ? `• Vendedor: ${g.vendedor}` : ''}
                      </p>
                    </div>
                    <button
                      type="button"
                      onClick={() => descargarPDFNotaPedido(g)}
                      className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-xl text-xs font-extrabold"
                    >
                      ⬇ Descargar PDF
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 3: CONTEO Y MERMA ANTE-MORTEM
    // =========================================================================
    function ModuloConteoAnteMortem({ placas, nombreChofer, mermasAnte, saldoTeorico, confirmacionPre, usuario, onAgregarMerma, onConfirmarFisico, onError }) {
      const [avesMuertas, setAvesMuertas] = useState(1);
      const [pesoMerma, setPesoMerma] = useState(2.8);
      const [placa, setPlaca] = useState(placas[0]?.placa || '');
      const [fotoCapturada, setFotoCapturada] = useState(false);

      const [lotes, setLotes] = useState([{ jabas: Math.floor(saldoTeorico / 8), avesJaba: 8 }]);
      const [pin, setPin] = useState('');
      const [obs, setObs] = useState('');

      const acumuladoAnte = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const requiereFoto = (acumuladoAnte + Number(avesMuertas)) > 2;

      const handleMerma = (e) => {
        e.preventDefault();
        if (requiereFoto && !fotoCapturada) {
          return onError('CANDADO ANTI-FRAUDE: Supera el límite acumulado de 2 aves. Capture foto en vivo obligatoria.');
        }
        onAgregarMerma({
          id: 'ma-' + Date.now(),
          placa,
          aves: Number(avesMuertas),
          peso: Number(pesoMerma),
          motivo: 'Muerte en transporte / espera',
          conFoto: fotoCapturada,
        });
        setFotoCapturada(false);
      };

      const totalFisico = lotes.reduce((acc, l) => acc + Number(l.jabas || 0) * Number(l.avesJaba || 0), 0);
      const diff = totalFisico - saldoTeorico;

      const igualarSaldoApp = () => {
        const completas = Math.floor(saldoTeorico / 8);
        const resto = saldoTeorico % 8;
        const nuevos = [{ jabas: completas, avesJaba: 8 }];
        if (resto > 0) nuevos.push({ jabas: 1, avesJaba: resto });
        setLotes(nuevos);
      };

      const handleConfirmar = (e) => {
        e.preventDefault();
        if (pin !== usuario.pin) {
          return onError('PIN incorrecto. Ingresa tu PIN personal de 4 dígitos para firmar el acta.');
        }
        if (diff !== 0 && obs.trim().length < 4) {
          return onError('Existe diferencia vs el sistema. Ingrese observación obligatoria.');
        }
        onConfirmarFisico({
          teorico: saldoTeorico,
          fisico: totalFisico,
          diferencia: diff,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        });
        setPin('');
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 space-y-4">
            <div className="flex justify-between items-start gap-2">
              <div>
                <span className="text-xs font-extrabold text-sky-400 uppercase">Módulo 3A • Verificación Física en Campo</span>
                <h3 className="text-base font-black text-white">Acta de Confirmación de Saldo Físico</h3>
              </div>
              {!confirmacionPre && (
                <button
                  type="button"
                  onClick={igualarSaldoApp}
                  className="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1.5 rounded-xl font-bold text-sky-300"
                >
                  Igualar a Saldo App ({saldoTeorico})
                </button>
              )}
            </div>

            <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-2xl">
              <div><p className="text-xs text-slate-400">Saldo Teórico App</p><p className="font-black text-xl text-sky-400">{saldoTeorico}</p></div>
              <div><p className="text-xs text-slate-400">Físico Contado</p><p className="font-black text-xl text-white">{totalFisico}</p></div>
              <div><p className="text-xs text-slate-400">Diferencia</p><p className={`font-black text-xl ${diff === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{diff}</p></div>
            </div>

            {confirmacionPre ? (
              <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                <p className="font-black text-emerald-300">✓ SALDO FÍSICO CONFIRMADO Y SELLADO</p>
                <p>Responsable: {confirmacionPre.responsable} ({confirmacionPre.hora})</p>
                <p>Conteo Físico: {confirmacionPre.fisico} aves (Dif: {confirmacionPre.diferencia})</p>
              </div>
            ) : (
              <form onSubmit={handleConfirmar} className="space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-400 uppercase">Desglose Contado</span>
                  <button
                    type="button"
                    onClick={() => setLotes([...lotes, { jabas: 1, avesJaba: 6 }])}
                    className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg"
                  >
                    + Pucho / Lote
                  </button>
                </div>

                <div className="space-y-2">
                  {lotes.map((l, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <input
                        type="number"
                        value={l.jabas}
                        onChange={(e) => { const c = [...lotes]; c[idx].jabas = e.target.value; setLotes(c); }}
                        className="w-24 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-center font-bold"
                      />
                      <span className="text-xs text-slate-400">jbs ×</span>
                      <input
                        type="number"
                        value={l.avesJaba}
                        onChange={(e) => { const c = [...lotes]; c[idx].avesJaba = e.target.value; setLotes(c); }}
                        className="w-20 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-center font-bold"
                      />
                      <span className="text-xs font-bold text-sky-400 ml-auto">
                        = {Number(l.jabas || 0) * Number(l.avesJaba || 0)} aves
                      </span>
                    </div>
                  ))}
                </div>

                {diff !== 0 && (
                  <input
                    type="text"
                    value={obs}
                    onChange={(e) => setObs(e.target.value)}
                    placeholder="Justificación obligatoria por diferencia..."
                    className="w-full bg-slate-800 border border-rose-500 rounded-xl p-2.5 text-xs"
                  />
                )}
                <input
                  type="password"
                  maxLength={4}
                  value={pin}
                  onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                  placeholder="Ingresa tu PIN personal para firmar"
                  className="w-full bg-slate-800 border border-amber-500/60 rounded-xl p-3 text-center font-mono text-lg"
                />
                <button type="submit" className="w-full py-3.5 bg-sky-600 hover:bg-sky-500 rounded-xl font-black text-sm">
                  FIRMAR CON PIN Y SELLAR SALDO FÍSICO
                </button>
              </form>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
