    // =========================================================================
    // GENERADOR PDF A5 "NOTA DE PEDIDO" (FORMATO TALONARIO CENTRO DE ACOPIO)
    // =========================================================================
    function descargarPDFNotaPedido(guia) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a5' });

      const azul = [28, 63, 148];
      const azulClaro = [235, 242, 255];
      const rojo = [210, 35, 42];
      const negro = [15, 23, 42];

      const empInfo = EMPRESAS.find(e => e.nombreCorto === guia.empresa) || EMPRESAS[0];

      doc.setDrawColor(...azul);
      doc.setLineWidth(0.45);
      doc.rect(6, 6, 136, 198);

      // Logo pollito + Centro de Acopio
      doc.setFillColor(...azulClaro);
      doc.circle(16.5, 16.5, 7.5, 'F');
      doc.setDrawColor(...azul);
      doc.circle(16.5, 16.5, 7.5, 'S');
      doc.setFillColor(...azul);
      doc.circle(16.5, 15, 3.2, 'F');
      doc.circle(16.5, 19.5, 4.2, 'F');
      doc.setFillColor(255, 255, 255);
      doc.circle(15.3, 14.5, 0.7, 'F');
      doc.circle(17.7, 14.5, 0.7, 'F');
      doc.setFillColor(245, 158, 11);
      doc.triangle(15.8, 15.6, 17.2, 15.6, 16.5, 16.8, 'F');

      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12.5);
      doc.text('"CENTRO DE ACOPIO"', 54, 13.5, { align: 'center' });

      doc.setFontSize(6.3);
      doc.text('VENTA DE POLLOS A PRECIOS ESPECIALES', 54, 17.8, { align: 'center' });
      doc.text('AL POR MAYOR Y MENOR', 54, 21.0, { align: 'center' });

      // Nota de Pedido N°
      doc.setDrawColor(...azul);
      doc.setLineWidth(0.4);
      doc.rect(86, 8.5, 53, 16.5);
      doc.setFillColor(...azulClaro);
      doc.rect(86, 8.5, 53, 6.5, 'F');
      doc.line(86, 15, 139, 15);

      doc.setTextColor(...azul);
      doc.setFontSize(10.5);
      doc.text('NOTA DE PEDIDO', 112.5, 13.0, { align: 'center' });

      doc.setTextColor(...rojo);
      doc.setFontSize(13);
      doc.setFont('courier', 'bold');
      doc.text(`N°  ${String(guia.numero).padStart(6, '0')}`, 112.5, 21.5, { align: 'center' });

      // Bloque Cliente, Vendedor, Fecha y Doc Identidad
      const yDatos = 27.5;
      doc.setDrawColor(...azul);
      doc.setLineWidth(0.35);
      doc.rect(8, yDatos, 88, 16);
      doc.setFillColor(...azulClaro);
      doc.rect(8, yDatos, 88, 4, 'F');
      doc.rect(8, yDatos + 8, 88, 4, 'F');
      doc.line(8, yDatos + 4, 96, yDatos + 4);
      doc.line(8, yDatos + 8, 96, yDatos + 8);
      doc.line(8, yDatos + 12, 96, yDatos + 12);

      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.text('SEÑOR(ES)', 52, yDatos + 3.0, { align: 'center' });
      doc.text('VENDEDOR', 52, yDatos + 11.0, { align: 'center' });

      doc.setTextColor(...negro);
      doc.setFontSize(8.5);
      const textoCliente = guia.cod && guia.cod !== '000' ? `[${guia.cod}] ${guia.cliente}` : guia.cliente;
      doc.text(textoCliente.toUpperCase(), 10, yDatos + 7.0);
      doc.text((guia.vendedor || 'ACOPIO').toUpperCase(), 10, yDatos + 15.0);

      doc.rect(98, yDatos, 41, 16);
      doc.setFillColor(...azulClaro);
      doc.rect(98, yDatos, 41, 4, 'F');
      doc.rect(98, yDatos + 8, 41, 4, 'F');
      doc.line(98, yDatos + 4, 139, yDatos + 4);
      doc.line(98, yDatos + 8, 139, yDatos + 8);
      doc.line(98, yDatos + 12, 139, yDatos + 12);
      doc.line(111.6, yDatos + 4, 111.6, yDatos + 8);
      doc.line(125.3, yDatos + 4, 125.3, yDatos + 8);

      doc.setTextColor(...azul);
      doc.setFontSize(6.5);
      doc.text('FECHA', 118.5, yDatos + 3.0, { align: 'center' });
      doc.text('DOC. IDENTIDAD', 118.5, yDatos + 11.0, { align: 'center' });

      const partesFecha = (guia.fecha || '2026-11-19').split('-');
      doc.setTextColor(...negro);
      doc.setFontSize(8.5);
      doc.text(partesFecha[2] || '19', 104.8, yDatos + 7.0, { align: 'center' });
      doc.text(partesFecha[1] || '11', 118.5, yDatos + 7.0, { align: 'center' });
      doc.text((partesFecha[0] || '2026').slice(-2), 132.1, yDatos + 7.0, { align: 'center' });
      doc.text(guia.docIdentidad || '-', 118.5, yDatos + 15.0, { align: 'center' });

      // Tabla 15 filas
      const yTabla = 46;
      const hHeader = 6.2;
      const hFila = 5.6;
      const numFilas = 15;
      const cols = [
        { label: 'N°', w: 8 },
        { label: 'CANT', w: 13 },
        { label: 'DETALLE', w: 36 },
        { label: 'PESO', w: 16 },
        { label: 'JABA', w: 13 },
        { label: 'BOLSA', w: 13 },
        { label: 'DSCTO', w: 13 },
        { label: 'TOTAL', w: 19 },
      ];

      doc.setFillColor(...azulClaro);
      doc.rect(8, yTabla, 131, hHeader, 'FD');
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);

      let xCursor = 8;
      cols.forEach((c, idx) => {
        if (idx > 0) doc.line(xCursor, yTabla, xCursor, yTabla + hHeader + numFilas * hFila);
        doc.text(c.label, xCursor + c.w / 2, yTabla + 4.3, { align: 'center' });
        xCursor += c.w;
      });

      const filasDatos = guia.filas || [];
      const precioKg = Number(guia.precioKg || 0);

      for (let i = 0; i < numFilas; i++) {
        const yRow = yTabla + hHeader + i * hFila;
        doc.setDrawColor(...azul);
        doc.setLineWidth(0.25);
        doc.line(8, yRow, 139, yRow);

        doc.setFillColor(245, 248, 255);
        doc.rect(8, yRow, 8, hFila, 'F');
        doc.setTextColor(...azul);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7.2);
        doc.text(String(i + 1), 12, yRow + 4.0, { align: 'center' });

        const item = filasDatos[i];
        if (item) {
          const cantAves = Number(item.jabas || 0) * Number(item.avesJaba || 0);
          const pesoRow = Number(item.peso || 0);
          const dsctoRow = Number(item.dscto || 0);
          const subTotalSoles = precioKg > 0 ? (pesoRow * precioKg - dsctoRow) : 0;
          const detalleTxt = item.detalle || (i === 0 && guia.detalle ? guia.detalle : 'Pollo Vivo');

          doc.setTextColor(...negro);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.3);

          if (cantAves > 0) doc.text(String(cantAves), 27.5, yRow + 4.0, { align: 'center' });
          doc.text(detalleTxt.slice(0, 22), 30.2, yRow + 4.0);
          if (pesoRow > 0) doc.text(pesoRow.toFixed(1), 75.5, yRow + 4.0, { align: 'right' });
          if (Number(item.jabas) > 0) doc.text(String(item.jabas), 83.5, yRow + 4.0, { align: 'center' });
          if (Number(item.avesJaba) > 0) doc.text(String(item.avesJaba), 96.5, yRow + 4.0, { align: 'center' });
          if (dsctoRow > 0) doc.text(dsctoRow.toFixed(2), 115.5, yRow + 4.0, { align: 'right' });
          if (subTotalSoles > 0) doc.text(subTotalSoles.toFixed(2), 137.5, yRow + 4.0, { align: 'right' });
        }
      }

      const yFinTabla = yTabla + hHeader + numFilas * hFila;
      doc.setLineWidth(0.4);
      doc.rect(8, yTabla, 131, hHeader + numFilas * hFila);

      const ySub = yFinTabla + 1.5;
      doc.setFillColor(...azulClaro);
      doc.rect(8, ySub, 131, 6.5, 'FD');
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.2);
      doc.text(`TOTAL AVES: ${guia.aves}`, 11, ySub + 4.4);
      doc.text(`TOTAL JABAS: ${guia.jabas}`, 52, ySub + 4.4);
      if (Number(guia.totalSoles) > 0) {
        doc.setTextColor(...negro);
        doc.text(`TOTAL S/ ${Number(guia.totalSoles).toFixed(2)}`, 137, ySub + 4.4, { align: 'right' });
      }

      const yPie = ySub + 8.5;
      doc.setDrawColor(...azul);
      doc.setLineWidth(0.35);
      doc.rect(8, yPie, 66, 21);
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('RECIBIR CONFORME', 41, yPie + 4, { align: 'center' });

      doc.setLineDashPattern([1, 1], 0);
      doc.line(14, yPie + 11.5, 68, yPie + 11.5);
      doc.setLineDashPattern([], 0);
      doc.setFontSize(6);
      doc.text('FIRMA', 41, yPie + 14.2, { align: 'center' });
      doc.text('Nombre y Apellidos: ________________________', 11, yPie + 18.8);

      doc.rect(8, yPie + 22.5, 66, 12);
      doc.setFontSize(6.5);
      doc.text('Nota: este documento no es comprobante', 10.5, yPie + 27.3);
      doc.text('de pago canjear por boleta de Venta o Factura', 10.5, yPie + 31.3);

      doc.setFillColor(...azulClaro);
      doc.rect(77, yPie, 28, 9, 'FD');
      doc.rect(105, yPie, 34, 9, 'S');
      doc.setTextColor(...azul);
      doc.setFontSize(7.5);
      doc.text('PESO TOTAL', 91, yPie + 5.7, { align: 'center' });

      doc.setTextColor(...negro);
      doc.setFontSize(10);
      doc.text(`${Number(guia.peso).toFixed(1)} kg`, 122, yPie + 6.0, { align: 'center' });

      doc.setTextColor(...azul);
      doc.setFontSize(6.1);
      doc.text(empInfo.razonSocial, 77, yPie + 13.2);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(5.8);
      empInfo.bancos.forEach((lineaBanco, idx) => {
        doc.text(lineaBanco, 77, yPie + 17.0 + idx * 3.5);
      });

      doc.setFontSize(5.2);
      doc.setTextColor(120, 130, 150);
      doc.text('Generado con Avimoa • Control Avícola', 138, 202.5, { align: 'right' });

      doc.save(`Nota_Pedido_${guia.empresa.replace(/\s+/g, '_')}_${String(guia.numero).padStart(6, '0')}.pdf`);
    }
