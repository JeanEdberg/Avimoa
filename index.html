                    </button>
                  </div>
                </div>

                {loginError && (
                  <div className={`p-3.5 rounded-2xl border text-xs font-bold text-center ${
                    cuentaBloqueadaMsg
                      ? 'bg-rose-950/90 border-rose-500 text-rose-200 animate-pulse'
                      : 'bg-amber-950/70 border-amber-500/60 text-amber-200'
                  }`}>
                    {loginError}
                  </div>
                )}

                <button
                  type="submit"
                  className={`w-full py-4 font-black rounded-2xl text-base shadow-lg transition ${
                    tipoAccesoLogin === 'DESARROLLADOR'
                      ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                      : 'bg-amber-500 hover:bg-amber-400 text-slate-950'
                  }`}
                >
                  {tipoAccesoLogin === 'DESARROLLADOR' ? 'INGRESAR COMO DESARROLLADOR' : 'INGRESAR A AVIMOA'}
                </button>
              </form>

              <div className="border-t border-slate-800/80 pt-3 text-center">
                <p className="text-[11px] text-slate-500">
                  Seguridad activa: al <strong className="text-slate-300">3er intento fallido</strong> el usuario se bloquea automáticamente.
                </p>
              </div>
            </div>
          </div>
        );
      }

      const tabsDisponibles = [
        { id: 'INGRESOS', label: '1. Traslado Galpón' },
        { id: 'GUIAS', label: '2. Guía Pluma (PDF)' },
        { id: 'CONTEO_ANTE', label: '3. Conteo & Ante-Mortem' },
        { id: 'FAENADO_POST', label: '4. Faenado & Post-Mortem' },
        { id: 'KARDEX', label: '5. Kardex & Reportes' },
        { id: 'MAESTROS', label: '6. Usuarios, Maestros & Nube' },
      ].filter((t) => PERMISOS_ROL[usuarioActivo.rol].includes(t.id));

      const usuariosBloqueados = usuarios.filter(u => u.bloqueado && u.activo !== false);
      const solicitudesPendientes = autorizaciones.filter(a => a.estado === 'PENDIENTE');
      const authConteoAprobada = autorizaciones.find(a => a.modulo === 'CONTEO' && a.estado === 'APROBADA');
      const authConteoPendiente = autorizaciones.find(a => a.modulo === 'CONTEO' && a.estado === 'PENDIENTE');
      const authFaenadoAprobada = autorizaciones.find(a => a.modulo === 'FAENADO' && a.estado === 'APROBADA');
      const authFaenadoPendiente = autorizaciones.find(a => a.modulo === 'FAENADO' && a.estado === 'PENDIENTE');

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-4">
                <LogoAvimoa compact />
                <div className="hidden sm:block h-8 w-px bg-slate-800"></div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded uppercase ${
                      usuarioActivo.rol === 'DESARROLLADOR' ? 'bg-emerald-500 text-slate-950' : 'bg-amber-500 text-slate-950'
                    }`}>
                      {usuarioActivo.rol === 'SUPERVISION' ? 'ADMINISTRADOR' : usuarioActivo.rol}
                    </span>
                    <span className="text-xs font-bold text-white">{usuarioActivo.nombre}</span>
                    {sbConectado && (
                      <span className="bg-emerald-950 border border-emerald-600 text-emerald-300 text-[10px] font-bold px-2 py-0.5 rounded-full">
                        LIVE
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[11px] text-slate-400">Fecha Operativa:</span>
                    <input
                      type="date"
                      value={fechaOperativa}
                      onChange={(e) => {
                        setFechaOperativa(e.target.value);
                        if (supabaseRef.current) cargarDatosDelDiaDesdeNube(supabaseRef.current, e.target.value);
                      }}
                      className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono text-amber-300"
                    />
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {usuarioActivo.rol === 'DESARROLLADOR' && usuariosBloqueados.length > 0 && (
                  <button
                    onClick={() => setTabActiva('MAESTROS')}
                    className="px-3 py-1.5 rounded-xl text-xs font-black bg-rose-600 text-white animate-pulse"
                  >
                    🔒 {usuariosBloqueados.length} Bloqueado(s)
                  </button>
                )}

                <button
                  onClick={toggleRed}
                  className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
                    online
                      ? 'bg-emerald-950/80 border-emerald-600 text-emerald-300'
                      : 'bg-amber-950/90 border-amber-500 text-amber-300 animate-pulse'
                  }`}
                >
                  {online ? '● EN LÍNEA' : `○ SIN SEÑAL (${colaOffline.length})`}
                </button>

                <button
                  onClick={() => setMostrarNotas(!mostrarNotas)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-900/70 border border-sky-600 text-sky-200"
                >
                  Notas ({notasCliente.length})
                </button>

                <button
                  onClick={() => {
                    setUsuarioActivo(null);
                    setDniInput('');
                    setPinInput('');
                  }}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200"
                >
                  Salir
                </button>
              </div>
            </div>

            <nav className="max-w-5xl mx-auto flex gap-1.5 overflow-x-auto pt-3 pb-1">
              {tabsDisponibles.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTabActiva(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                    tabActiva === t.id
                      ? 'bg-amber-500 text-slate-950 shadow'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </nav>
          </header>

          {/* BANNER DE AUTORIZACIÓN EN VIVO PARA EL ADMINISTRADOR / SUPERVISIÓN */}
          {esAdminOSupervisor && solicitudesPendientes.length > 0 && (
            <div className="max-w-5xl mx-auto px-4 pt-4">
              <div className="bg-amber-950/90 border-2 border-amber-400 rounded-3xl p-4 shadow-2xl space-y-3">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-amber-400 animate-ping"></span>
                  <h3 className="text-sm font-black text-amber-300 uppercase">
                    🔔 Solicitud de Autorización para Editar ({solicitudesPendientes.length})
                  </h3>
                </div>
                {solicitudesPendientes.map(sol => (
                  <div key={sol.id} className="bg-slate-950/90 border border-amber-500/40 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <p className="text-xs font-black text-white">
                        Módulo: <span className="text-amber-400">{sol.modulo === 'CONTEO' ? '3. CONTEO FÍSICO' : '4. FAENADO / CIERRE'}</span> • Solicitado por: <span className="text-sky-300">{sol.solicitado_por}</span>
                      </p>
                      <p className="text-xs text-slate-300 mt-0.5">Motivo: <strong>&ldquo;{sol.motivo}&rdquo;</strong></p>
                    </div>
                    <div className="flex items-center gap-2">
                      <input
                        type="password"
                        maxLength={4}
                        value={pinAutorizadorInput}
                        onChange={(e) => setPinAutorizadorInput(e.target.value.replace(/\D/g, ''))}
                        placeholder="Tu PIN Admin"
                        className="w-32 bg-slate-900 border border-amber-400 rounded-xl px-3 py-2 text-center font-mono text-sm font-black text-amber-300"
                      />
                      <button
                        type="button"
                        onClick={() => aprobarSolicitudConPin(sol)}
                        className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2 rounded-xl text-xs"
                      >
                        ✅ AUTORIZAR
                      </button>
                      <button
                        type="button"
                        onClick={() => rechazarSolicitud(sol)}
                        className="bg-rose-950 hover:bg-rose-900 border border-rose-600 text-rose-200 font-bold px-3 py-2 rounded-xl text-xs"
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed bottom-4 right-4 left-4 md:left-auto md:w-96 z-50">
              <div
                className={`p-4 rounded-2xl shadow-2xl border text-sm font-bold ${
                  toast.tipo === 'err'
                    ? 'bg-rose-950 border-rose-500 text-rose-100'
                    : toast.tipo === 'warn'
                    ? 'bg-amber-950 border-amber-500 text-amber-100'
                    : 'bg-emerald-950 border-emerald-500 text-emerald-100'
                }`}
              >
                {toast.msg}
              </div>
            </div>
          )}

          {mostrarNotas && (
            <div className="max-w-5xl mx-auto px-4 pt-4">
              <div className="bg-sky-950/60 border border-sky-700 p-4 rounded-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sky-300 text-sm">Bitácora de Observaciones Operativas</h3>
                  <button onClick={() => setMostrarNotas(false)} className="text-xs text-slate-400">Cerrar ✕</button>
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={nuevaNota}
                    onChange={(e) => setNuevaNota(e.target.value)}
                    placeholder="Anota aquí cualquier incidencia o ajuste del turno..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                  />
                  <button
                    onClick={() => {
                      if (!nuevaNota.trim()) return;
                      setNotasCliente([...notasCliente, { hora: new Date().toLocaleTimeString(), texto: nuevaNota }]);
                      setNuevaNota('');
                    }}
                    className="bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold"
                  >
                    Guardar
                  </button>
                </div>
                {notasCliente.map((n, idx) => (
                  <p key={idx} className="text-xs bg-slate-900/90 p-2 rounded-lg border border-slate-800">
                    <span className="text-sky-400 font-mono">[{n.hora}]</span> {n.texto}
                  </p>
                ))}
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-4 space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Ingresos Galpón</p>
                <p className="text-2xl font-black text-emerald-400">+{totalIngresosAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Guías Pluma Activas</p>
                <p className="text-2xl font-black text-sky-400">-{totalVentasVivoAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Merma Ante-Mortem</p>
                <p className="text-2xl font-black text-rose-400">-{totalMermaAnteAves}</p>
              </div>
              <div className="bg-slate-900 border border-amber-500/40 p-3.5 rounded-2xl">
                <p className="text-xs text-amber-300 font-bold">Saldo Vivo Disponible</p>
                <p className="text-2xl font-black text-white">{saldoTeoricoPreFaenado} aves</p>
              </div>
            </div>

            {tabActiva === 'INGRESOS' && (
              <ModuloIngresoGalpon
                galpones={galpones.filter(g => g.activo !== false)}
                placas={placas.filter(p => p.activo !== false)}
                choferes={choferes.filter(c => c.activo !== false)}
                ingresos={ingresos}
                nombreEmpresa={nombreEmpresa}
                congelado={!!confirmacionPre}
                onRegistrar={(nuevo, esEdicion) => {
                  if (esEdicion) {
                    setIngresos(ingresos.map(item => item.id === nuevo.id ? nuevo : item));
                  } else {
                    setIngresos([...ingresos, nuevo]);
                  }
                  sincronizarOperacionNube(
                    'movimientos_ingreso',
                    {
                      id: nuevo.id,
                      fecha_operativa: fechaOperativa,
                      sector: nuevo.sector,
                      numero_galpon: nuevo.numeroGalpon,
                      empresa: nuevo.empresa,
                      placa: nuevo.placa,
                      chofer: nuevo.chofer,
                      jabas: nuevo.jabas,
                      aves: nuevo.aves,
                      modo: nuevo.modo,
                    },
                    `Ingreso ${nuevo.placa}: ${nuevo.aves} aves`
                  );
                  notificar(esEdicion ? `Ingreso actualizado (${nuevo.aves} aves).` : `Ingreso registrado: +${nuevo.aves} aves (${nuevo.sector} - ${nuevo.numeroGalpon})`);
                }}
                onEliminarIngreso={async (idIng) => {
                  setIngresos(ingresos.filter(i => i.id !== idIng));
                  if (supabaseRef.current && online) {
                    await supabaseRef.current.from('movimientos_ingreso').delete().eq('id', idIng);
                  }
                  notificar('Ingreso eliminado del turno.', 'warn');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'GUIAS' && (
              <ModuloGuiaPluma
                fechaOperativa={fechaOperativa}
                clientes={clientes.filter(c => c.activo !== false)}
                vendedores={vendedores.filter(v => v.activo !== false)}
                guias={guias}
                correlativos={correlativos}
                onGuardarInicioCorrelativo={(emp, num) => {
                  actualizarCorrelativoEmpresa(emp, num, true);
                  notificar(`Correlativo inicial de ${emp} guardado en N° ${String(num).padStart(6, '0')}.`);
                }}
                congelado={!!confirmacionPre}
                onRegistrar={(guia, descargarAhora, esEdicion) => {
                  if (esEdicion) {
                    setGuias(guias.map(g => g.id === guia.id ? guia : g));
                  } else {
                    setGuias([...guias, guia]);
                    const siguiente = Number(guia.numero) + 1;
                    actualizarCorrelativoEmpresa(guia.empresa, siguiente, true);
                  }

                  sincronizarOperacionNube(
                    'guias_pluma',
                    {
                      id: guia.id,
                      fecha_operativa: fechaOperativa,
                      empresa: guia.empresa,
                      numero: guia.numero,
                      cod_cliente: guia.cod,
                      cliente: guia.cliente,
                      doc_identidad: guia.docIdentidad,
                      vendedor: guia.vendedor,
                      detalle: guia.detalle,
                      precio_kg: guia.precioKg,
                      jabas: guia.jabas,
                      aves: guia.aves,
                      peso: guia.peso,
                      total_soles: guia.totalSoles,
                      filas_json: guia.filas,
                      anulada: !!guia.anulada,
                      motivo_anulacion: guia.motivoAnulacion || null,
                    },
                    `Guía #${guia.numero}: ${guia.aves} aves`
                  );

                  if (descargarAhora) {
                    descargarPDFNotaPedido(guia);
                    notificar(`Nota de Pedido N° ${guia.numero} ${esEdicion ? 'actualizada' : 'emitida'} y PDF descargado.`);
                  } else {
                    notificar(`Nota de Pedido N° ${guia.numero} ${esEdicion ? 'actualizada' : 'guardada'} (-${guia.aves} aves).`);
                  }
                }}
                onAnularGuia={async (guiaObj, motivo) => {
                  const anuladaObj = { ...guiaObj, anulada: true, motivoAnulacion: motivo };
                  setGuias(guias.map(g => g.id === guiaObj.id ? anuladaObj : g));
                  if (supabaseRef.current && online) {
                    await supabaseRef.current.from('guias_pluma').update({
                      anulada: true,
                      motivo_anulacion: motivo,
                    }).eq('id', guiaObj.id);
                  }
                  notificar(`🚫 Guía N° ${guiaObj.numero} ANULADA. Sus ${guiaObj.aves} aves regresaron al saldo disponible.`, 'warn');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'CONTEO_ANTE' && (
              <ModuloConteoAnteMortem
                placas={placas.filter(p => p.activo !== false)}
                nombreChofer={nombreChofer}
                mermasAnte={mermasAnte}
                saldoTeorico={saldoTeoricoPreFaenado}
                confirmacionPre={confirmacionPre}
                usuario={usuarioActivo}
                authAprobada={authConteoAprobada}
                authPendiente={authConteoPendiente}
                onSolicitarAuth={(motivo) => solicitarAutorizacionEdicion('CONTEO', motivo)}
                onAgregarMerma={(m) => {
                  setMermasAnte([...mermasAnte, m]);
                  sincronizarOperacionNube(
                    'mermas_ante_mortem',
                    {
                      id: m.id,
                      fecha_operativa: fechaOperativa,
                      placa: m.placa,
                      aves: m.aves,
                      peso: m.peso,
                      motivo: m.motivo,
                      con_foto: m.conFoto,
                    },
                    `Merma Ante-Mortem: ${m.aves} aves`
                  );
                  notificar(`Merma Ante-Mortem registrada (-${m.aves} aves)`, 'warn');
                }}
                onEliminarMerma={async (idMerma) => {
                  setMermasAnte(mermasAnte.filter(m => m.id !== idMerma));
                  if (supabaseRef.current && online) {
                    await supabaseRef.current.from('mermas_ante_mortem').delete().eq('id', idMerma);
                  }
                  notificar('Merma Ante-Mortem eliminada.', 'warn');
                }}
                onConfirmarFisico={async (acta, fueEdicion) => {
                  setConfirmacionPre(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE CONTEO FÍSICO: Teórico ${acta.teorico} vs Físico ${acta.fisico} (Diff: ${acta.diferencia})`]);
                  }
                  await sincronizarOperacionNube(
                    'cierres_turno',
                    {
                      id: `pre-${fechaOperativa}`,
                      fecha_operativa: fechaOperativa,
                      tipo: 'CONTEO_PRE',
                      teorico: acta.teorico,
                      fisico: acta.fisico,
                      diferencia: acta.diferencia,
                      responsable: acta.responsable,
                      hora: acta.hora,
                    },
                    'Acta Saldo Físico'
                  );
                  if (fueEdicion) {
                    await consumirAutorizacionEdicion('CONTEO');
                    notificar('Corrección de Conteo Físico guardada. Módulo bloqueado nuevamente.');
                  } else {
                    notificar('Acta de Saldo Físico sellada con PIN. Turno congelado.');
                  }
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'FAENADO_POST' && (
              <ModuloFaenadoPostMortem
                basePreFaenado={basePreFaenado}
                faenadoManana={faenadoManana}
                pesoFaenado={pesoFaenado}
                mermaPost={mermaPost}
                detalleFaenadoObs={detalleFaenadoObs}
                saldoTeoricoPost={saldoTeoricoPostFaenado}
                confirmacionPost={confirmacionPost}
                usuario={usuarioActivo}
                authAprobada={authFaenadoAprobada}
                authPendiente={authFaenadoPendiente}
                onSolicitarAuth={(motivo) => solicitarAutorizacionEdicion('FAENADO', motivo)}
                onRegistrarFaenado={async (f, pKg, mp, obsTxt, fueEdicion) => {
                  setFaenadoManana(f);
                  setPesoFaenado(pKg);
                  setMermaPost(mp);
                  setDetalleFaenadoObs(obsTxt);
                  await sincronizarOperacionNube(
                    'cierres_turno',
                    {
                      id: confirmacionPost ? `post-${fechaOperativa}` : `faena-${fechaOperativa}`,
                      fecha_operativa: fechaOperativa,
                      tipo: confirmacionPost ? 'CIERRE_POST' : 'FAENADO_REG',
                      teorico: basePreFaenado - f - mp,
                      fisico: confirmacionPost ? confirmacionPost.fisico : 0,
                      diferencia: confirmacionPost ? confirmacionPost.fisico - (basePreFaenado - f - mp) : 0,
                      faenado_aves: f,
                      faenado_kg: pKg,
                      merma_post: mp,
                      detalle_obs: obsTxt,
                      responsable: usuarioActivo.nombre,
                      hora: new Date().toLocaleTimeString(),
                    },
                    'Registro Faenado'
                  );
                  if (fueEdicion) {
                    await consumirAutorizacionEdicion('FAENADO');
                    notificar('Corrección de Faenado guardada. Módulo bloqueado nuevamente.');
                  } else {
                    notificar(`Faenado registrado (${f} aves / ${pKg} kg) y Merma Post-Mortem (${mp} aves).`);
                  }
                }}
                onConfirmarPost={async (acta, fueEdicion) => {
                  setConfirmacionPost(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE POST-FAENADO: Remanente Teórico ${acta.teorico} vs Físico ${acta.fisico}`]);
                  }
                  await sincronizarOperacionNube(
                    'cierres_turno',
                    {
                      id: `post-${fechaOperativa}`,
                      fecha_operativa: fechaOperativa,
                      tipo: 'CIERRE_POST',
                      teorico: acta.teorico,
                      fisico: acta.fisico,
                      diferencia: acta.diferencia,
                      faenado_aves: faenadoManana || 0,
                      faenado_kg: pesoFaenado || 0,
                      merma_post: mermaPost || 0,
                      detalle_obs: detalleFaenadoObs,
                      responsable: acta.responsable,
                      hora: acta.hora,
                    },
                    'Cierre Post-Faenado'
                  );
                  if (fueEdicion) {
                    await consumirAutorizacionEdicion('FAENADO');
                    notificar('Corrección de Cierre Post-Faenado guardada. Módulo bloqueado nuevamente.');
                  } else {
                    notificar('Cierre Post-Faenado confirmado con PIN.');
                  }
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'KARDEX' && (
              <ModuloKardexDashboard
                fechaOperativa={fechaOperativa}
                ingresos={ingresos}
                guias={guias}
                mermasAnte={mermasAnte}
                confirmacionPre={confirmacionPre}
                faenadoManana={faenadoManana}
                pesoFaenado={pesoFaenado}
                mermaPost={mermaPost}
                confirmacionPost={confirmacionPost}
                saldoTeoricoPreFaenado={saldoTeoricoPreFaenado}
                alertas={alertas}
                notificar={notificar}
              />
            )}

            {tabActiva === 'MAESTROS' && (
              <ModuloMaestros
                usuarioActivo={usuarioActivo}
                usuarios={usuarios}
                onGuardarUsuario={async (nuevoUser) => {
                  const idx = usuarios.findIndex(u => u.dni === nuevoUser.dni);
                  const copia = [...usuarios];
                  if (idx >= 0) copia[idx] = nuevoUser;
                  else copia.push(nuevoUser);
                  await guardarUsuariosLocalYNube(copia, nuevoUser);
                }}
                galpones={galpones}
                setGalpones={setGalpones}
                placas={placas}
                setPlacas={setPlacas}
                choferes={choferes}
                setChoferes={setChoferes}
                clientes={clientes}
                setClientes={setClientes}
                vendedores={vendedores}
                setVendedores={setVendedores}
                nombreEmpresa={nombreEmpresa}
                nombreChofer={nombreChofer}
                sbUrl={sbUrl}
                setSbUrl={setSbUrl}
                sbKey={sbKey}
                setSbKey={setSbKey}
                webhookUrl={webhookUrl}
                setWebhookUrl={(val) => {
                  setWebhookUrl(val);
                  localStorage.setItem('avimoa_webhook_url', val);
                }}
                sbConectado={sbConectado}
                onConectarSupabase={() => conectarSupabase(sbUrl, sbKey, false)}
                supabaseRef={supabaseRef}
                notificar={notificar}
              />
            )}
          </main>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 1: INGRESO DE GALPÓN (CON EDITAR Y ELIMINAR)
    // =========================================================================
    function ModuloIngresoGalpon({ galpones, placas, choferes, ingresos, nombreEmpresa, congelado, onRegistrar, onEliminarIngreso, onError }) {
      const sectoresUnicos = [...new Set(galpones.map(g => g.sector))];
      const [editandoId, setEditandoId] = useState(null);
      const [sectorSel, setSectorSel] = useState('');
      const [galponId, setGalponId] = useState('');
      const [placaId, setPlacaId] = useState('');
      const [choferId, setChoferId] = useState('');
      const [jabas, setJabas] = useState(60);
      const [avesPorJaba, setAvesPorJaba] = useState(9);

      useEffect(() => {
        if (!editandoId && sectoresUnicos.length > 0 && (!sectorSel || !sectoresUnicos.includes(sectorSel))) {
          const primerSector = sectoresUnicos[0];
          setSectorSel(primerSector);
          const gLista = galpones.filter(g => g.sector === primerSector);
          setGalponId(gLista[0]?.id || '');
        }
      }, [galpones]);

      useEffect(() => {
        if (!editandoId && placas.length > 0 && (!placaId || !placas.some(p => p.id === placaId))) {
          setPlacaId(placas[0].id);
          if (placas[0].choferId) setChoferId(placas[0].choferId);
        }
      }, [placas]);

      useEffect(() => {
        if (!editandoId && choferes.length > 0 && (!choferId || !choferes.some(c => c.id === choferId))) {
          setChoferId(choferes[0].id);
        }
      }, [choferes]);

      const galponesDelSector = galpones.filter(g => g.sector === sectorSel);

      const handleCambioSector = (nuevoSector) => {
        setSectorSel(nuevoSector);
        const lista = galpones.filter(g => g.sector === nuevoSector);
        setGalponId(lista[0]?.id || '');
      };

      const handleCambioPlaca = (nuevaPlacaId) => {
        setPlacaId(nuevaPlacaId);
        const veh = placas.find(p => p.id === nuevaPlacaId);
        if (veh?.choferId && choferes.some(c => c.id === veh.choferId)) {
          setChoferId(veh.choferId);
        }
      };

      const cargarIngresoParaEditar = (ing) => {
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        setEditandoId(ing.id);
        setSectorSel(ing.sector);
        const gMatch = galpones.find(g => g.sector === ing.sector && g.numeroGalpon === ing.numeroGalpon);
        if (gMatch) setGalponId(gMatch.id);
        const pMatch = placas.find(p => p.placa === ing.placa);
        if (pMatch) setPlacaId(pMatch.id);
        const cMatch = choferes.find(c => c.nombre === ing.chofer);
        if (cMatch) setChoferId(cMatch.id);
        setJabas(ing.jabas);
        setAvesPorJaba(ing.jabas > 0 ? Math.round(ing.aves / ing.jabas) : 9);
      };

      const galponObj = galpones.find(g => g.id === galponId) || galponesDelSector[0];
      const placaObj = placas.find(p => p.id === placaId);
      const choferObj = choferes.find(c => c.id === choferId);

      const faltanCatalogos = galpones.length === 0 || placas.length === 0 || choferes.length === 0;

      const handleGuardar = (e) => {
        e.preventDefault();
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        if (faltanCatalogos) return onError('Primero registra tus Galpones, Placas y Choferes activos en el Módulo 6.');
        const esEd = !!editandoId;
        onRegistrar({
          id: editandoId || ('ing-' + Date.now()),
          sector: galponObj?.sector || sectorSel,
          numeroGalpon: galponObj?.numeroGalpon || 'Galpón 1',
          empresa: nombreEmpresa(galponObj?.empresaId || placaObj?.empresaId),
          placa: placaObj?.placa || 'S/P',
          chofer: choferObj?.nombre || 'Chofer',
          jabas: Number(jabas),
          aves: Number(jabas) * Number(avesPorJaba),
          modo: 'DIGITAL',
        }, esEd);
        setEditandoId(null);
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
            <div className="flex justify-between items-start gap-2">
              <div>
                <span className="text-xs font-extrabold text-amber-400 uppercase">Módulo 1 • Traslado de Granja</span>
                <h2 className="text-lg font-black text-white">
                  {editandoId ? '✏️ Editando Ingreso de Pollo Vivo' : 'Ingreso de Pollo Vivo (Galpón → Acopio)'}
                </h2>
              </div>
              {editandoId && (
                <button
                  type="button"
                  onClick={() => setEditandoId(null)}
                  className="bg-slate-800 border border-slate-600 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-300"
                >
                  Cancelar Edición ✕
                </button>
              )}
            </div>

            {faltanCatalogos && (
              <div className="bg-amber-950/60 border border-amber-500/60 p-3.5 rounded-2xl text-xs text-amber-200 font-bold">
                ⚠️ Faltan catálogos activos (Galpones: {galpones.length}, Placas: {placas.length}, Choferes: {choferes.length}). Ve a <strong>6. Usuarios, Maestros & Nube</strong> para registrar tus datos reales.
              </div>
            )}

            <form onSubmit={handleGuardar} className="space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">1. Dirección / Sector de Granja</label>
                  <select
                    value={sectorSel}
                    onChange={(e) => handleCambioSector(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                  >
                    {sectoresUnicos.length === 0 && <option value="">— Sin sectores registrados —</option>}
                    {sectoresUnicos.map((sec) => (
                      <option key={sec} value={sec}>{sec}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">2. Número de Galpón (Deduce Empresa)</label>
                  <select
                    value={galponId}
                    onChange={(e) => setGalponId(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold text-amber-300"
                  >
                    {galponesDelSector.length === 0 && <option value="">— Sin galpones activos —</option>}
                    {galponesDelSector.map((g) => (
                      <option key={g.id} value={g.id}>
                        {g.numeroGalpon} — [{nombreEmpresa(g.empresaId)}]
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">3. Placa del Vehículo</label>
                  <select
                    value={placaId}
                    onChange={(e) => handleCambioPlaca(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                  >
                    {placas.length === 0 && <option value="">— Sin placas activas —</option>}
                    {placas.map((v) => (
                      <option key={v.id} value={v.id}>
                        {v.placa} ({v.modelo}) — [{nombreEmpresa(v.empresaId)}]
                      </option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">4. Chofer del Viaje</label>
                  <select
                    value={choferId}
                    onChange={(e) => setChoferId(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                  >
                    {choferes.length === 0 && <option value="">— Sin choferes activos —</option>}
                    {choferes.map((ch) => (
                      <option key={ch.id} value={ch.id}>
                        {ch.nombre} {ch.dni ? `(DNI: ${ch.dni})` : ''}
                      </option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Cant. Jabas</label>
                  <input
                    type="number"
                    min={1}
                    value={jabas}
                    onChange={(e) => setJabas(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                  />
                </div>
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Pollos x Jaba</label>
                  <input
                    type="number"
                    min={1}
                    value={avesPorJaba}
                    onChange={(e) => setAvesPorJaba(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                  />
                </div>
                <div className="flex flex-col justify-center items-center">
                  <span className="text-xs text-slate-400">Total Ingreso</span>
                  <span className="text-2xl font-black text-emerald-400">+{Number(jabas) * Number(avesPorJaba)}</span>
                </div>
              </div>

              <button type="submit" className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-black text-base">
                {editandoId ? '💾 GUARDAR CAMBIOS DE INGRESO' : 'REGISTRAR INGRESO DE CARRO'}
              </button>
            </form>
          </div>

          {ingresos.length > 0 && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-3">
              <h3 className="text-sm font-black text-white uppercase">Ingresos Registrados Hoy ({ingresos.length})</h3>
              <div className="divide-y divide-slate-800">
                {ingresos.map((ing) => (
                  <div key={ing.id} className="py-3 flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <p className="text-sm font-bold text-white">
                        {ing.sector} — <span className="text-amber-400">{ing.numeroGalpon}</span> ({ing.empresa})
                      </p>
                      <p className="text-xs text-slate-400">
                        Placa: <strong className="text-slate-200">{ing.placa}</strong> • Chofer: {ing.chofer} • <strong className="text-emerald-400">+{ing.aves} aves</strong> ({ing.jabas} jabas)
                      </p>
                    </div>
                    {!congelado && (
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => cargarIngresoParaEditar(ing)}
                          className="bg-sky-950 hover:bg-sky-900 border border-sky-700 text-sky-300 px-3 py-1.5 rounded-xl text-xs font-extrabold"
                        >
                          ✏️ Editar
                        </button>
                        <button
                          type="button"
                          onClick={() => onEliminarIngreso(ing.id)}
                          className="bg-rose-950 hover:bg-rose-900 border border-rose-700 text-rose-300 px-3 py-1.5 rounded-xl text-xs font-extrabold"
                        >
                          🗑️ Eliminar
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 2: GUÍA PLUMA / NOTA DE PEDIDO (CLIENTES + VENDEDORES + CANT)
    // =========================================================================
    function ModuloGuiaPluma({ fechaOperativa, clientes, vendedores, guias, correlativos, onGuardarInicioCorrelativo, congelado, onRegistrar, onAnularGuia, onError }) {
      const [empresa, setEmpresa] = useState('PLUMÍFERO');
      const [guiaEditando, setGuiaEditando] = useState(null);
      const [anulandoGuiaId, setAnulandoGuiaId] = useState(null);
      const [motivoAnulacion, setMotivoAnulacion] = useState('');

      const corrInfo = correlativos[empresa] || { numero: 1, inicializado: false };
      const numeroFormateado = guiaEditando ? guiaEditando.numero : String(corrInfo.numero).padStart(6, '0');

      const [editandoCorrelativo, setEditandoCorrelativo] = useState(!corrInfo.inicializado);
      const [inputInicioCorr, setInputInicioCorr] = useState(String(corrInfo.numero));

      useEffect(() => {
        if (!guiaEditando) {
          const info = correlativos[empresa] || { numero: 1, inicializado: false };
          setInputInicioCorr(String(info.numero));
          setEditandoCorrelativo(!info.inicializado);
        }
      }, [empresa, correlativos, guiaEditando]);

      // Buscador desplegable de Clientes
      const [busqueda, setBusqueda] = useState('');
      const [mostrarListaClientes, setMostrarListaClientes] = useState(false);
      const [clienteSel, setClienteSel] = useState(null);
      const [clienteLibre, setClienteLibre] = useState('');
      const [docIdentidad, setDocIdentidad] = useState('');

      // Buscador desplegable de Vendedores / Despachadores
      const [busquedaVendedor, setBusquedaVendedor] = useState('');
      const [mostrarListaVendedores, setMostrarListaVendedores] = useState(false);
      const [vendedorSel, setVendedorSel] = useState(null);
      const [vendedorLibre, setVendedorLibre] = useState('');

      const [detalleGeneral, setDetalleGeneral] = useState('Pollo Vivo');
      const [precioKg, setPrecioKg] = useState('');

      const [filas, setFilas] = useState([{ peso: '', jabas: 5, avesJaba: 8, dscto: 0 }]);

      const clientesFiltrados = busqueda.trim()
        ? clientes.filter(c =>
            c.cod.toLowerCase().includes(busqueda.toLowerCase()) ||
            c.apodo.toLowerCase().includes(busqueda.toLowerCase()) ||
            c.cliente.toLowerCase().includes(busqueda.toLowerCase())
          )
        : clientes;

      const vendedoresFiltrados = busquedaVendedor.trim()
        ? vendedores.filter(v =>
            v.apodo.toLowerCase().includes(busquedaVendedor.toLowerCase()) ||
            v.nombres.toLowerCase().includes(busquedaVendedor.toLowerCase()) ||
            (v.dni && v.dni.includes(busquedaVendedor))
          )
        : vendedores;

      const totalJabas = filas.reduce((a, b) => a + Number(b.jabas || 0), 0);
      const totalAves = filas.reduce((a, b) => a + Number(b.jabas || 0) * Number(b.avesJaba || 0), 0);
      const totalPeso = filas.reduce((a, b) => a + Number(b.peso || 0), 0);
      const totalDscto = filas.reduce((a, b) => a + Number(b.dscto || 0), 0);
      const pKg = Number(precioKg || 0);
      const totalSoles = pKg > 0 ? Math.max(0, totalPeso * pKg - totalDscto) : 0;

      const iniciarEdicionGuia = (g) => {
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        setGuiaEditando(g);
        setEmpresa(g.empresa);
        if (g.cod && g.cod !== '000') {
          const matchCli = clientes.find(c => c.cod === g.cod);
          setClienteSel(matchCli || { cod: g.cod, apodo: g.cliente, cliente: g.cliente });
          setClienteLibre('');
        } else {
          setClienteSel(null);
          setClienteLibre(g.cliente);
        }
        setDocIdentidad(g.docIdentidad || '');
        const matchVend = vendedores.find(v => v.apodo.toUpperCase() === (g.vendedor || '').toUpperCase() || v.nombres.toUpperCase() === (g.vendedor || '').toUpperCase());
        if (matchVend) {
          setVendedorSel(matchVend);
          setVendedorLibre('');
        } else {
          setVendedorSel(null);
          setVendedorLibre(g.vendedor || '');
        }
        setDetalleGeneral(g.detalle || 'Pollo Vivo');
        setPrecioKg(g.precioKg > 0 ? String(g.precioKg) : '');
        setFilas(
          g.filas && g.filas.length > 0
            ? g.filas.map(f => ({ peso: f.peso, jabas: f.jabas, avesJaba: f.avesJaba, dscto: f.dscto || 0 }))
            : [{ peso: g.peso, jabas: g.jabas, avesJaba: g.jabas > 0 ? Math.round(g.aves / g.jabas) : 8, dscto: 0 }]
        );
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const cancelarEdicionGuia = () => {
        setGuiaEditando(null);
        setClienteLibre('');
        setClienteSel(null);
        setDocIdentidad('');
        setVendedorSel(null);
        setVendedorLibre('');
        setPrecioKg('');
        setFilas([{ peso: '', jabas: 5, avesJaba: 8, dscto: 0 }]);
      };

      const emitirGuia = (descargarPdfAhora) => {
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        if (!guiaEditando && !corrInfo.inicializado) {
          setEditandoCorrelativo(true);
          return onError('Primero fija y guarda el N° de inicio de correlativo del talonario.');
        }
        const nombreDestinatario = clienteLibre.trim() ? clienteLibre.trim() : clienteSel?.apodo;
        if (!nombreDestinatario) return onError('Seleccione un cliente o escriba el destinatario.');
        if (totalAves <= 0 && totalPeso <= 0) return onError('Ingrese al menos una fila de pesada o aves.');

        const nombreVendedorFinal = vendedorLibre.trim()
          ? vendedorLibre.trim()
          : (vendedorSel?.apodo || vendedorSel?.nombres || 'ACOPIO');

        const esEdicion = !!guiaEditando;
        const nuevaGuia = {
          id: guiaEditando ? guiaEditando.id : ('g-' + Date.now()),
          fecha: fechaOperativa,
          empresa,
          numero: numeroFormateado,
          cod: clienteLibre.trim() ? '000' : (clienteSel?.cod || '000'),
          cliente: nombreDestinatario,
          docIdentidad: docIdentidad.trim(),
          vendedor: nombreVendedorFinal,
          detalle: detalleGeneral.trim() || 'Pollo Vivo',
          precioKg: pKg,
          jabas: totalJabas,
          aves: totalAves,
          peso: totalPeso,
          totalSoles,
          anulada: false,
          motivoAnulacion: '',
          filas: filas.map(f => ({
            peso: Number(f.peso || 0),
            jabas: Number(f.jabas || 0),
            avesJaba: Number(f.avesJaba || 0),
            dscto: Number(f.dscto || 0),
            detalle: detalleGeneral.trim() || 'Pollo Vivo'
          }))
        };

        onRegistrar(nuevaGuia, descargarPdfAhora, esEdicion);
        setGuiaEditando(null);
        setClienteLibre('');
        setFilas([{ peso: '', jabas: 5, avesJaba: 8, dscto: 0 }]);
      };

      return (
        <div className="space-y-6">
          <div className={`bg-slate-900 border ${guiaEditando ? 'border-amber-400' : 'border-slate-800'} rounded-3xl p-5 space-y-5`}>
            <div className="flex flex-wrap justify-between items-start gap-3">
              <div>
                <span className="text-xs font-extrabold text-sky-400 uppercase">Módulo 2 • Nota de Pedido / Guía Pluma</span>
                <h2 className="text-lg font-black text-white">
                  {guiaEditando ? `✏️ Editando Nota de Pedido N° ${guiaEditando.numero}` : 'Emisión de Guía Pluma y PDF para Cliente'}
                </h2>
                <p className="text-xs text-slate-400">Replica el talonario físico (hasta 15 pesadas) con cuentas bancarias por empresa.</p>
              </div>

              <div className="flex items-center gap-2 bg-slate-950 border border-slate-700 px-3 py-2 rounded-2xl">
                <div>
                  <p className="text-[10px] text-slate-400 uppercase font-bold">Nota de Pedido ({empresa})</p>

    // =========================================================================
    // MÓDULO 3: CONTEO Y MERMA ANTE-MORTEM (BLOQUEADO HASTA AUTORIZACIÓN ADMIN)
    // =========================================================================
    function ModuloConteoAnteMortem({
      placas, nombreChofer, mermasAnte, saldoTeorico, confirmacionPre, usuario,
      authAprobada, authPendiente, onSolicitarAuth, onAgregarMerma, onEliminarMerma, onConfirmarFisico, onError
    }) {
      const [avesMuertas, setAvesMuertas] = useState(1);
      const [pesoMerma, setPesoMerma] = useState(2.8);
      const [placa, setPlaca] = useState('');
      const [fotoCapturada, setFotoCapturada] = useState(false);

      const [solicitandoAuthUI, setSolicitandoAuthUI] = useState(false);
      const [motivoSolAuth, setMotivoSolAuth] = useState('');

      useEffect(() => {
        if (placas.length > 0 && (!placa || !placas.some(p => p.placa === placa))) {
          setPlaca(placas[0].placa);
        }
      }, [placas]);

      const [lotes, setLotes] = useState([{ jabas: Math.floor(saldoTeorico / 8), avesJaba: 8 }]);
      const [pin, setPin] = useState('');
      const [obs, setObs] = useState('');

      const estaSellado = !!confirmacionPre;
      const puedeEditarSellado = estaSellado && !!authAprobada;

      const acumuladoAnte = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const requiereFoto = (acumuladoAnte + Number(avesMuertas)) > 2;

      const handleMerma = (e) => {
        e.preventDefault();
        if (estaSellado && !puedeEditarSellado) {
          return onError('Conteo Físico sellado. Solicita autorización al Administrador para modificar.');
        }
        if (requiereFoto && !fotoCapturada) {
          return onError('CANDADO ANTI-FRAUDE: Supera el límite acumulado de 2 aves. Capture foto en vivo obligatoria.');
        }
        onAgregarMerma({
          id: 'ma-' + Date.now(),
          placa: placa || 'S/P',
          aves: Number(avesMuertas),
          peso: Number(pesoMerma),
          motivo: 'Muerte en transporte / espera',
          conFoto: fotoCapturada,
        });
        setFotoCapturada(false);
      };

      const totalFisico = lotes.reduce((acc, l) => acc + Number(l.jabas || 0) * Number(l.avesJaba || 0), 0);
      const diff = totalFisico - saldoTeorico;

      const igualarSaldoApp = () => {
        const completas = Math.floor(saldoTeorico / 8);
        const resto = saldoTeorico % 8;
        const nuevos = [{ jabas: completas, avesJaba: 8 }];
        if (resto > 0) nuevos.push({ jabas: 1, avesJaba: resto });
        setLotes(nuevos);
      };

      const handleConfirmar = (e) => {
        e.preventDefault();
        if (pin !== usuario.pin) {
          return onError('PIN incorrecto. Ingresa tu PIN personal de 4 dígitos para firmar el acta.');
        }
        if (diff !== 0 && obs.trim().length < 4) {
          return onError('Existe diferencia vs el sistema. Ingrese observación obligatoria.');
        }
        onConfirmarFisico({
          teorico: saldoTeorico,
          fisico: totalFisico,
          diferencia: diff,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        }, puedeEditarSellado);
        setPin('');
        setSolicitandoAuthUI(false);
        setMotivoSolAuth('');
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 space-y-4">
            <div className="flex justify-between items-start gap-2">
              <div>
                <span className="text-xs font-extrabold text-sky-400 uppercase">Módulo 3A • Verificación Física en Campo</span>
                <h3 className="text-base font-black text-white">Acta de Confirmación de Saldo Físico</h3>
              </div>
              {(!estaSellado || puedeEditarSellado) && (
                <button
                  type="button"
                  onClick={igualarSaldoApp}
                  className="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1.5 rounded-xl font-bold text-sky-300"
                >
                  Igualar a Saldo App ({saldoTeorico})
                </button>
              )}
            </div>

            <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-2xl">
              <div><p className="text-xs text-slate-400">Saldo Teórico App</p><p className="font-black text-xl text-sky-400">{saldoTeorico}</p></div>
              <div><p className="text-xs text-slate-400">Físico Contado</p><p className="font-black text-xl text-white">{estaSellado && !puedeEditarSellado ? confirmacionPre.fisico : totalFisico}</p></div>
              <div><p className="text-xs text-slate-400">Diferencia</p><p className={`font-black text-xl ${(estaSellado && !puedeEditarSellado ? confirmacionPre.diferencia : diff) === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{estaSellado && !puedeEditarSellado ? confirmacionPre.diferencia : diff}</p></div>
            </div>

            {estaSellado && !puedeEditarSellado ? (
              <div className="space-y-3">
                <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                  <p className="font-black text-emerald-300">🔒 SALDO FÍSICO SELLADO (PROTEGIDO CONTRA EDICIÓN)</p>
                  <p>Responsable: {confirmacionPre.responsable} ({confirmacionPre.hora})</p>
                  <p>Conteo Físico: {confirmacionPre.fisico} aves (Dif: {confirmacionPre.diferencia})</p>
                </div>

                {authPendiente ? (
                  <div className="bg-amber-950/70 border border-amber-500 p-3.5 rounded-2xl text-xs text-amber-200 font-bold animate-pulse">
                    ⏳ Esperando que el Administrador ingrese su PIN desde su celular o computadora para autorizar la edición...
                  </div>
                ) : !solicitandoAuthUI ? (
                  <button
                    type="button"
                    onClick={() => setSolicitandoAuthUI(true)}
                    className="w-full py-3 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500 text-amber-300 rounded-xl font-black text-xs"
                  >
                    🔓 SOLICITAR AUTORIZACIÓN AL ADMINISTRADOR PARA EDITAR
                  </button>
                ) : (
                  <div className="bg-slate-950 border border-amber-500 p-3.5 rounded-2xl space-y-2.5">
                    <p className="text-xs font-black text-amber-300">Solicitar Autorización de Edición al Administrador</p>
                    <input
                      type="text"
                      value={motivoSolAuth}
                      onChange={(e) => setMotivoSolAuth(e.target.value)}
                      placeholder="Ej. Faltó sumar 2 jabas del lote..."
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs"
                    />
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => onSolicitarAuth(motivoSolAuth)}

                        ENVIAR SOLICITUD
                      </button>
                      <button
