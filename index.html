    // =========================================================================
    // MÓDULO 4: FAENADO Y MERMA POST-MORTEM
    // =========================================================================
    function ModuloFaenadoPostMortem({ basePreFaenado, faenadoManana, mermaPost, saldoTeoricoPost, confirmacionPost, usuario, onRegistrarFaenado, onConfirmarPost, onError }) {
      const [cantFaenado, setCantFaenado] = useState(faenadoManana ?? basePreFaenado);
      const [pesoTotalKg, setPesoTotalKg] = useState(2850);
      const [cantPostMortem, setCantPostMortem] = useState(mermaPost);
      const [detalleObs, setDetalleObs] = useState('Lote beneficio turno mañana');
      const [saldoRemanenteFisico, setSaldoRemanenteFisico] = useState(0);
      const [pin, setPin] = useState('');

      const handleGuardarFaenado = (e) => {
        e.preventDefault();
        onRegistrarFaenado(Number(cantFaenado), Number(pesoTotalKg), Number(cantPostMortem));
      };

      const handleCierrePost = (e) => {
        e.preventDefault();
        if (pin !== usuario.pin) {
          return onError('PIN incorrecto. Ingresa tu PIN personal para confirmar el cierre.');
        }
        onConfirmarPost({
          teorico: saldoTeoricoPost,
          fisico: Number(saldoRemanenteFisico),
          diferencia: Number(saldoRemanenteFisico) - saldoTeoricoPost,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        });
        setPin('');
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
            <span className="text-xs font-extrabold text-purple-400 uppercase">Módulo 4A • Turno Mañana</span>
            <h3 className="text-base font-black text-white">Faenado y Merma Post-Mortem</h3>
            <p className="text-xs text-slate-400">Disponible Pre-Faena: <strong className="text-sky-400">{basePreFaenado} aves</strong></p>
            <form onSubmit={handleGuardarFaenado} className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-slate-400">Cantidad Aves Faenado</label>
                  <input type="number" value={cantFaenado} onChange={(e) => setCantFaenado(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Peso Total (kg)</label>
                  <input type="number" step="0.1" value={pesoTotalKg} onChange={(e) => setPesoTotalKg(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
              </div>
              <div>
                <label className="text-xs text-slate-400">Merma Post-Mortem (Decomiso / Descarte Línea)</label>
                <input type="number" value={cantPostMortem} onChange={(e) => setCantPostMortem(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg text-rose-400" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Detalle / Observación</label>
                <input type="text" value={detalleObs} onChange={(e) => setDetalleObs(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-purple-600 hover:bg-purple-500 rounded-xl font-black text-sm">
                REGISTRAR FAENADO MAÑANA
              </button>
            </form>
          </div>

          <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl p-5 space-y-4">
            <span className="text-xs font-extrabold text-emerald-400 uppercase">Módulo 4B • Cierre Final del Día</span>
            <h3 className="text-base font-black text-white">Confirmación Saldo Post-Faenado</h3>
            <p className="text-xs text-slate-400">Aves vivas remanentes en acopio (arrastre para siguiente noche).</p>
            {confirmacionPost ? (
              <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                <p className="font-black text-emerald-300">✓ CIERRE POST-FAENADO SELLADO</p>
                <p>Responsable: {confirmacionPost.responsable} ({confirmacionPost.hora})</p>
                <p>Saldo Remanente Confirmado: {confirmacionPost.fisico} aves</p>
              </div>
            ) : (
              <form onSubmit={handleCierrePost} className="space-y-3">
                <div className="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-xl text-center">
                  <div>
                    <p className="text-xs text-slate-400">Remanente Teórico</p>
                    <p className="font-black text-xl text-sky-400">{saldoTeoricoPost}</p>
                  </div>
                  <div>
                    <p className="text-xs text-slate-400">Descuadre</p>
                    <p className={`font-black text-xl ${Number(saldoRemanenteFisico) - saldoTeoricoPost === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {Number(saldoRemanenteFisico) - saldoTeoricoPost}
                    </p>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Aves Vivas Remanentes Contadas</label>
                  <input type="number" value={saldoRemanenteFisico} onChange={(e) => setSaldoRemanenteFisico(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
                <input
                  type="password"
                  maxLength={4}
                  value={pin}
                  onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                  placeholder="Ingresa tu PIN personal para cerrar"
                  className="w-full bg-slate-800 border border-emerald-500/60 rounded-xl p-3 text-center font-mono text-lg"
                />
                <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-black text-sm">
                  CONFIRMAR SALDO POST-FAENADO
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 5: KARDEX VERTICAL Y REPORTES
    // =========================================================================
    function ModuloKardexDashboard({ fechaOperativa, ingresos, guias, mermasAnte, confirmacionPre, faenadoManana, pesoFaenado, mermaPost, confirmacionPost, saldoTeoricoPreFaenado, alertas, notificar }) {
      let saldoCorriente = 0;

      const exportarCSV = () => {
        let saldo = 0;
        const filas = [['FECHA', 'BLOQUE', 'CONCEPTO', 'EMPRESA', 'JABAS', 'ENTRADA', 'SALIDA', 'SALDO']];
        ingresos.forEach(i => {
          saldo += i.aves;
          filas.push([fechaOperativa, 'NOCHE', `${i.sector} - ${i.numeroGalpon} (${i.placa} - ${i.chofer})`, i.empresa, i.jabas, i.aves, 0, saldo]);
        });
        guias.forEach(g => {
          saldo -= g.aves;
          filas.push([fechaOperativa, 'NOCHE', `Guía #${g.numero} - [${g.cod}] ${g.cliente}`, g.empresa, g.jabas, 0, g.aves, saldo]);
        });
        mermasAnte.forEach(m => {
          saldo -= m.aves;
          filas.push([fechaOperativa, 'ANTE-MORTEM', `Merma Ante-Mortem (${m.placa})`, 'CONSOLIDADO', 0, 0, m.aves, saldo]);
        });
        if (faenadoManana !== null) {
          saldo -= (faenadoManana + mermaPost);
          filas.push([fechaOperativa, 'MAÑANA', `Faenado (${pesoFaenado} kg) + Post-Mortem (${mermaPost})`, 'CONSOLIDADO', 0, 0, faenadoManana + mermaPost, saldo]);
        }
        const csvContent = 'data:text/csv;charset=utf-8,' + filas.map(e => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Kardex_Avimoa_${fechaOperativa}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notificar('Archivo CSV del Kardex descargado.');
      };

      return (
        <div className="space-y-5">
          {alertas.length > 0 && (
            <div className="bg-rose-950/80 border border-rose-500 p-4 rounded-2xl space-y-1">
              <p className="text-xs font-black text-rose-300 uppercase">Alertas de Auditoría Activas</p>
              {alertas.map((a, i) => <p key={i} className="text-xs text-white">• {a}</p>)}
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 overflow-x-auto">
            <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
              <div>
                <h2 className="text-lg font-black text-white">Kardex Vertical Consolidado ({fechaOperativa})</h2>
                <p className="text-xs text-slate-400">Arrastre automático de saldos desde apertura nocturna hasta cierre post-faenado.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={exportarCSV}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-xl"
                >
                  ⬇ Exportar Kardex CSV
                </button>
                <span className="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold text-amber-400">
                  {confirmacionPre ? `Sellado: ${confirmacionPre.responsable}` : 'Pendiente Conteo'}
                </span>
              </div>
            </div>

            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="border-b border-slate-700 text-slate-400">
                  <th className="py-2 px-2">BLOQUE</th>
                  <th className="py-2 px-2">CONCEPTO / GALPÓN / CLIENTE</th>
                  <th className="py-2 px-2">EMPRESA</th>
                  <th className="py-2 px-2 text-right">JABAS</th>
                  <th className="py-2 px-2 text-right">ENTRADA</th>
                  <th className="py-2 px-2 text-right">SALIDA</th>
                  <th className="py-2 px-2 text-right">SALDO</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {ingresos.map((ing) => {
                  saldoCorriente += ing.aves;
                  return (
                    <tr key={ing.id} className="bg-emerald-950/20">
                      <td className="py-2.5 px-2 font-bold text-emerald-400">NOCHE</td>
                      <td className="py-2.5 px-2">{ing.sector} — <strong>{ing.numeroGalpon}</strong> ({ing.placa} - {ing.chofer})</td>
                      <td className="py-2.5 px-2 font-mono">{ing.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{ing.jabas}</td>
                      <td className="py-2.5 px-2 text-right font-bold text-emerald-400">+{ing.aves}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {guias.map((g) => {
                  saldoCorriente -= g.aves;
                  return (
                    <tr key={g.id} className="bg-sky-950/20">
                      <td className="py-2.5 px-2 font-bold text-sky-400">NOCHE</td>
                      <td className="py-2.5 px-2">Guía #{g.numero} — [{g.cod}] {g.cliente}</td>
                      <td className="py-2.5 px-2 font-mono">{g.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{g.jabas}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-sky-400">-{g.aves}</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {mermasAnte.map((m) => {
                  saldoCorriente -= m.aves;
                  return (
                    <tr key={m.id} className="bg-rose-950/20">
                      <td className="py-2.5 px-2 font-bold text-rose-400">ANTE-M</td>
                      <td className="py-2.5 px-2">Merma Ante-Mortem ({m.placa}) {m.conFoto ? '📷' : ''}</td>
                      <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-rose-400">-{m.aves}</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                <tr className="bg-amber-950/30 font-bold">
                  <td className="py-2.5 px-2 text-amber-400">SALDO</td>
                  <td className="py-2.5 px-2">SALDO DISPONIBLE PARA FAENADO</td>
                  <td className="py-2.5 px-2">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right font-black text-amber-400">{saldoTeoricoPreFaenado}</td>
                </tr>
                {faenadoManana !== null && (
                  <tr className="bg-slate-800/60">
                    <td className="py-2.5 px-2 font-bold text-purple-400">MAÑANA</td>
                    <td className="py-2.5 px-2">FAENADO 7P - PL ({pesoFaenado} kg | Post-Mortem: {mermaPost} aves)</td>
                    <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                    <td className="py-2.5 px-2 text-right">-</td>
                    <td className="py-2.5 px-2 text-right">0</td>
                    <td className="py-2.5 px-2 text-right font-bold text-purple-300">-{faenadoManana + mermaPost}</td>
                    <td className="py-2.5 px-2 text-right font-black">{confirmacionPost ? confirmacionPost.fisico : saldoTeoricoPreFaenado - faenadoManana - mermaPost}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MÓDULO 6: USUARIOS (DNI + PIN ALEATORIO + DESBLOQUEO), MAESTROS Y NUBE
    // =========================================================================
    function ModuloMaestros({
      usuarioActivo, usuarios, onGuardarUsuario,
      galpones, setGalpones, placas, setPlacas, choferes, setChoferes, clientes, setClientes,
      nombreEmpresa, nombreChofer, sbUrl, setSbUrl, sbKey, setSbKey, webhookUrl, setWebhookUrl,
      sbConectado, onConectarSupabase, supabaseRef, notificar
    }) {
      const esDev = usuarioActivo.rol === 'DESARROLLADOR';
      const [subTab, setSubTab] = useState(esDev ? 'USUARIOS' : 'GALPONES');

      // Estados Nuevo Responsable / Desarrollador
      const [dniNuevoUser, setDniNuevoUser] = useState('');
      const [nombreNuevoUser, setNombreNuevoUser] = useState('');
      const [rolNuevoUser, setRolNuevoUser] = useState('TRASLADO');
      const [pinGeneradoPreview, setPinGeneradoPreview] = useState(() => generarPinAleatorio4());
      const [ultimoCredencialCreado, setUltimoCredencialCreado] = useState(null);

      // Estados Galpones
      const [empresaGalpon, setEmpresaGalpon] = useState('emp-1');
      const [sectorGalpon, setSectorGalpon] = useState('');
      const [numeroGalpon, setNumeroGalpon] = useState('Galpón 1');
      const [referenciaGalpon, setReferenciaGalpon] = useState('');
      const [cantidadLote, setCantidadLote] = useState(1);

      // Estados Placas
      const [nuevaPlaca, setNuevaPlaca] = useState('');
      const [modeloPlaca, setModeloPlaca] = useState('');
      const [empresaPlaca, setEmpresaPlaca] = useState('emp-1');
      const [choferHabitualPlaca, setChoferHabitualPlaca] = useState(choferes[0]?.id || '');

      // Estados Choferes
      const [nombreNuevoChofer, setNombreNuevoChofer] = useState('');
      const [dniNuevoChofer, setDniNuevoChofer] = useState('');
      const [telNuevoChofer, setTelNuevoChofer] = useState('');

      // Estados Clientes
      const [csvTexto, setCsvTexto] = useState('045\tMARIA ELENA QUISPE\tMaria Quispe\t41258963');

      const crearResponsableConPin = async (e) => {
        e.preventDefault();
        if (dniNuevoUser.trim().length !== 8) {
          return notificar('El DNI debe tener exactamente 8 dígitos.', 'err');
        }
        if (!nombreNuevoUser.trim()) {
          return notificar('Ingrese el nombre del responsable.', 'err');
        }
        const pinFinal = pinGeneradoPreview || generarPinAleatorio4();
        const nuevoObj = {
          dni: dniNuevoUser.trim(),
          nombre: nombreNuevoUser.trim(),
          rol: rolNuevoUser,
          pin: pinFinal,
          intentosFallidos: 0,
          bloqueado: false,
        };
        await onGuardarUsuario(nuevoObj);
        setUltimoCredencialCreado(nuevoObj);
        setDniNuevoUser('');
        setNombreNuevoUser('');
        setPinGeneradoPreview(generarPinAleatorio4());
        notificar(`Usuario ${nuevoObj.nombre} creado con PIN aleatorio ${pinFinal}.`);
      };

      const desbloquearYRegenerarPin = async (u) => {
        const nuevoPin = generarPinAleatorio4();
        const actualizado = {
          ...u,
          pin: nuevoPin,
          intentosFallidos: 0,
          bloqueado: false,
        };
        await onGuardarUsuario(actualizado);
        setUltimoCredencialCreado(actualizado);
        notificar(`Nuevo PIN aleatorio generado para ${u.nombre}: ${nuevoPin}`);
      };

      const copiarCredencialesWhatsApp = (u) => {
        const rolDesc = ROLES_MODULO.find(r => r.value === u.rol)?.label || u.rol;
        const mensaje = `🐔 *AVIMOA — Acceso al Sistema*\n👤 *Responsable:* ${u.nombre}\n📋 *Módulo:* ${rolDesc}\n🪪 *DNI:* ${u.dni}\n🔑 *PIN de Acceso:* ${u.pin}\n🔗 *Enlace:* ${window.location.href}`;
        navigator.clipboard?.writeText(mensaje);
        notificar('Credenciales copiadas al portapapeles listas para pegar en WhatsApp.');
      };

      const agregarGalpon = async (e) => {
        e.preventDefault();
        if (!sectorGalpon.trim()) return;
        const cant = Number(cantidadLote);
        const nuevos = [];
        if (cant > 1) {
          for (let i = 1; i <= cant; i++) {
            nuevos.push({
              id: 'g-' + Date.now() + '-' + i,
              sector: sectorGalpon.trim(),
              numeroGalpon: `Galpón ${i}`,
              referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
              empresaId: empresaGalpon,
            });
          }
          notificar(`Se crearon ${cant} galpones (Galpón 1 al ${cant}) en ${sectorGalpon}.`);
        } else {
          nuevos.push({
            id: 'g-' + Date.now(),
            sector: sectorGalpon.trim(),
            numeroGalpon,
            referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
            empresaId: empresaGalpon,
          });
          notificar(`Dirección ${sectorGalpon} (${numeroGalpon}) registrada.`);
        }
        setGalpones([...galpones, ...nuevos]);
        if (supabaseRef.current) {
          await supabaseRef.current.from('galpones').upsert(
            nuevos.map(n => ({ id: n.id, sector: n.sector, numero_galpon: n.numeroGalpon, referencia: n.referencia, empresa_id: n.empresaId }))
          );
        }
        setSectorGalpon('');
        setReferenciaGalpon('');
        setCantidadLote(1);
      };

      const agregarPlaca = async (e) => {
        e.preventDefault();
        if (!nuevaPlaca.trim()) return;
        const obj = {
          id: 'v-' + Date.now(),
          placa: nuevaPlaca.trim().toUpperCase(),
          modelo: modeloPlaca.trim() || 'Camión Furgón',
          empresaId: empresaPlaca,
          choferId: choferHabitualPlaca,
        };
        setPlacas([...placas, obj]);
        if (supabaseRef.current) {
          await supabaseRef.current.from('placas').upsert({
            id: obj.id, placa: obj.placa, modelo: obj.modelo, empresa_id: obj.empresaId, chofer_id: obj.choferId
          });
        }
        setNuevaPlaca('');
        setModeloPlaca('');
        notificar('Placa / Vehículo registrado en el catálogo.');
      };

      const agregarChofer = async (e) => {
        e.preventDefault();
        if (!nombreNuevoChofer.trim()) return;
        const obj = {
          id: 'ch-' + Date.now(),
          nombre: nombreNuevoChofer.trim(),
          dni: dniNuevoChofer.trim(),
          telefono: telNuevoChofer.trim(),
          activo: true,
        };
        setChoferes([...choferes, obj]);
        if (supabaseRef.current) {
          await supabaseRef.current.from('choferes').upsert(obj);
        }
        setNombreNuevoChofer('');
        setDniNuevoChofer('');
        setTelNuevoChofer('');
        notificar('Chofer registrado correctamente.');
      };

      const importarClientes = async () => {
        const lineas = csvTexto.split('\n').map(l => l.trim()).filter(Boolean);
        const nuevos = [...clientes];
        const aSubir = [];
        lineas.forEach(linea => {
          const partes = linea.split(/\t|,|;/).map(p => p.trim());
          if (partes.length >= 3) {
            const idx = nuevos.findIndex(c => c.cod === partes[0]);
            const obj = { cod: partes[0], cliente: partes[1].toUpperCase(), apodo: partes[2], docIdentidad: partes[3] || '' };
            if (idx >= 0) nuevos[idx] = obj;
            else nuevos.push(obj);
            aSubir.push({ cod: obj.cod, cliente: obj.cliente, apodo: obj.apodo, doc_identidad: obj.docIdentidad });
          }
        });
        setClientes(nuevos);
        if (supabaseRef.current && aSubir.length > 0) {
          await supabaseRef.current.from('clientes').upsert(aSubir);
        }
        notificar(`Importación masiva completada (${lineas.length} clientes procesados).`);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
          <div>
            <span className="text-xs font-extrabold text-sky-400 uppercase">Administración Avimoa • Usuarios y Catálogos</span>
            <h2 className="text-lg font-black text-white">Responsables por DNI, Galpones, Placas, Choferes y Nube</h2>
          </div>

          <div className="flex flex-wrap gap-2 bg-slate-950 p-2 rounded-2xl border border-slate-800">
            {esDev && (
              <button
                type="button"
                onClick={() => setSubTab('USUARIOS')}
                className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${
                  subTab === 'USUARIOS' ? 'bg-amber-500 text-slate-950' : 'text-amber-300 hover:text-white'
                }`}
              >
                👥 Usuarios & PIN ({usuarios.length})
              </button>
            )}
            <button type="button" onClick={() => setSubTab('GALPONES')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'GALPONES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>
              Direcciones / Galpones ({galpones.length})
            </button>
            <button type="button" onClick={() => setSubTab('PLACAS')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'PLACAS' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>
              Placas ({placas.length})
            </button>
            <button type="button" onClick={() => setSubTab('CHOFERES')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'CHOFERES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>
              Choferes ({choferes.length})
            </button>
            <button type="button" onClick={() => setSubTab('CLIENTES')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'CLIENTES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}>
              Clientes ({clientes.length})
            </button>
            {esDev && (
              <button type="button" onClick={() => setSubTab('NUBE')} className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'NUBE' ? 'bg-emerald-600 text-white' : 'text-emerald-400 hover:text-emerald-300'}`}>
                ☁️ Nube Tiempo Real ({sbConectado ? 'ON' : 'OFF'})
              </button>
            )}
          </div>

          {/* SUB-PESTAÑA EXCLUSIVA DESARROLLADOR: USUARIOS POR DNI, PIN ALEATORIO Y DESBLOQUEO */}
          {subTab === 'USUARIOS' && esDev && (
            <div className="space-y-5">
              {ultimoCredencialCreado && (
                <div className="bg-emerald-950/70 border border-emerald-500 p-4 rounded-2xl flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <p className="text-xs font-black text-emerald-300 uppercase">Credencial Lista para Compartir</p>
                    <p className="text-sm font-bold text-white mt-0.5">
                      {ultimoCredencialCreado.nombre} — DNI: <span className="font-mono text-amber-300">{ultimoCredencialCreado.dni}</span> | PIN: <span className="font-mono text-emerald-300 text-base font-black">{ultimoCredencialCreado.pin}</span>
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => copiarCredencialesWhatsApp(ultimoCredencialCreado)}
                    className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-2.5 rounded-xl text-xs"
                  >
                    📋 Copiar Mensaje WhatsApp
                  </button>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                <form onSubmit={crearResponsableConPin} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                  <h3 className="text-sm font-black text-white">Asignar Responsable por Módulo (DNI + PIN Aleatorio)</h3>
                  <div>
                    <label className="text-xs text-slate-400">Número de DNI (8 dígitos)</label>
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength={8}
                      value={dniNuevoUser}
                      onChange={(e) => setDniNuevoUser(e.target.value.replace(/\D/g, ''))}
                      placeholder="Ej. 71234568"
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Nombre del Responsable</label>
                    <input
                      type="text"
                      value={nombreNuevoUser}
                      onChange={(e) => setNombreNuevoUser(e.target.value)}
                      placeholder="Ej. Carlos Quispe"
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1"
                    />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Módulo Asignado</label>
                    <select
                      value={rolNuevoUser}
                      onChange={(e) => setRolNuevoUser(e.target.value)}
                      className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold text-amber-300 mt-1"
                    >
                      {ROLES_MODULO.map(r => (
                        <option key={r.value} value={r.value}>{r.label}</option>
                      ))}
                    </select>
                  </div>

                  <div className="bg-slate-900 border border-slate-700 p-3 rounded-xl flex items-center justify-between">
                    <div>
                      <p className="text-[11px] text-slate-400">PIN Aleatorio Generado</p>
                      <p className="text-xl font-mono font-black text-emerald-400 tracking-widest">{pinGeneradoPreview}</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setPinGeneradoPreview(generarPinAleatorio4())}
                      className="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded-xl text-xs font-bold text-amber-300"
                    >
                      🎲 Otro PIN
                    </button>
                  </div>

                  <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-xl text-xs">
                    + GUARDAR RESPONSABLE Y GENERAR ACCESO
                  </button>
                </form>

                <div className="space-y-2.5 max-h-[430px] overflow-y-auto">
                  <h3 className="text-xs font-black text-slate-400 uppercase">Usuarios Registrados y Estado de Bloqueo</h3>
                  {usuarios.map(u => (
                    <div
                      key={u.dni}
                      className={`p-3.5 rounded-2xl border space-y-2 ${
                        u.bloqueado
                          ? 'bg-rose-950/40 border-rose-500'
                          : 'bg-slate-950 border-slate-800'
                      }`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-sm font-black text-white">{u.nombre}</span>
                            {u.bloqueado && (
                              <span className="bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full animate-pulse">
                                🔒 BLOQUEADO (3/3)
                              </span>
                            )}
                          </div>
                          <p className="text-xs text-slate-400 mt-0.5">
                            DNI: <strong className="font-mono text-slate-200">{u.dni}</strong> • Módulo: <strong className="text-amber-300">{u.rol}</strong>
                          </p>
                          <p className="text-xs text-slate-400">
                            PIN Actual: <strong className="font-mono text-emerald-400">{u.pin}</strong> • Intentos fallidos: {u.intentosFallidos || 0}/3
                          </p>
                        </div>
                      </div>

                      <div className="flex flex-wrap gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() => desbloquearYRegenerarPin(u)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-extrabold ${
                            u.bloqueado
                              ? 'bg-rose-600 hover:bg-rose-500 text-white'
                              : 'bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700'
                          }`}
                        >
                          {u.bloqueado ? '🔓 Desbloquear y Generar Nuevo PIN' : '🎲 Regenerar Nuevo PIN'}
                        </button>
                        <button
                          type="button"
                          onClick={() => copiarCredencialesWhatsApp(u)}
                          className="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-950 hover:bg-emerald-900 border border-emerald-700 text-emerald-300"
                        >
                          📋 Copiar WhatsApp
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {subTab === 'GALPONES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarGalpon} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Nueva Dirección / Galpón</h3>
                <div>
                  <label className="text-xs text-slate-400">Empresa Titular (Obligatorio)</label>
                  <select value={empresaGalpon} onChange={(e) => setEmpresaGalpon(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {EMPRESAS.map(emp => <option key={emp.id} value={emp.id}>{emp.nombreCorto} ({emp.ruc})</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Dirección / Sector</label>
                  <input value={sectorGalpon} onChange={(e) => setSectorGalpon(e.target.value)} placeholder="Ej. Km 32 Granja Santa Rosa" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">Número de Galpón</label>
                    <select value={numeroGalpon} onChange={(e) => setNumeroGalpon(e.target.value)} disabled={Number(cantidadLote) > 1} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                      <option value="Galpón Único">Galpón Único</option>
                      <option value="Galpón 1">Galpón 1</option>
                      <option value="Galpón 2">Galpón 2</option>
                      <option value="Galpón 3">Galpón 3</option>
                      <option value="Galpón 4">Galpón 4</option>
                      <option value="Galpón 5">Galpón 5</option>
                      <option value="Galpón 6">Galpón 6</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">¿Crear varios del 1 al N?</label>
                    <select value={cantidadLote} onChange={(e) => setCantidadLote(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1 text-amber-300">
                      <option value={1}>Solo 1 galpón</option>
                      <option value={2}>Generar Galpón 1 al 2</option>
                      <option value={3}>Generar Galpón 1 al 3</option>
                      <option value={4}>Generar Galpón 1 al 4</option>
                      <option value={5}>Generar Galpón 1 al 5</option>
                      <option value={6}>Generar Galpón 1 al 6</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Referencia / Galponero</label>
                  <input value={referenciaGalpon} onChange={(e) => setReferenciaGalpon(e.target.value)} placeholder="Referencia carretera / galponero..." className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  GUARDAR DIRECCIÓN Y GALPÓN
                </button>
              </form>

              <div className="space-y-2 max-h-96 overflow-y-auto">
                {galpones.map(g => (
                  <div key={g.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between gap-2">
                    <div>
                      <p className="text-sm font-black text-white">{g.sector} — <span className="text-amber-400">{g.numeroGalpon}</span></p>
                      <p className="text-xs text-slate-400">{g.referencia}</p>
                    </div>
                    <span className={`text-xs font-mono font-bold px-2.5 py-1 rounded-lg ${g.empresaId === 'emp-1' ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' : 'bg-amber-950 text-amber-300 border border-amber-700'}`}>
                      {nombreEmpresa(g.empresaId)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'PLACAS' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarPlaca} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Registrar Nueva Placa / Vehículo</h3>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">N° Placa</label>
                    <input value={nuevaPlaca} onChange={(e) => setNuevaPlaca(e.target.value)} placeholder="Ej. B4K-712" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono uppercase mt-1" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Marca / Modelo</label>
                    <input value={modeloPlaca} onChange={(e) => setModeloPlaca(e.target.value)} placeholder="Ej. Hyundai HD78" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Empresa Asignada</label>
                  <select value={empresaPlaca} onChange={(e) => setEmpresaPlaca(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {EMPRESAS.map(emp => <option key={emp.id} value={emp.id}>{emp.nombreCorto}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Chofer Habitual</label>
                  <select value={choferHabitualPlaca} onChange={(e) => setChoferHabitualPlaca(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {choferes.map(ch => <option key={ch.id} value={ch.id}>{ch.nombre}</option>)}
                  </select>
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  + GUARDAR PLACA
                </button>
              </form>

              <div className="space-y-2">
                {placas.map(p => (
                  <div key={p.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                    <div>
                      <p className="text-sm font-mono font-black text-amber-400">{p.placa} <span className="font-sans text-white font-bold">({p.modelo})</span></p>
                      <p className="text-xs text-slate-400">Chofer habitual: {nombreChofer(p.choferId)}</p>
                    </div>
                    <span className="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300">
                      {nombreEmpresa(p.empresaId)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'CHOFERES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarChofer} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Registrar Nuevo Chofer</h3>
                <div>
                  <label className="text-xs text-slate-400">Nombre Completo / Apodo</label>
                  <input value={nombreNuevoChofer} onChange={(e) => setNombreNuevoChofer(e.target.value)} placeholder="Ej. Carlos Mendoza" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">DNI / Licencia</label>
                    <input value={dniNuevoChofer} onChange={(e) => setDniNuevoChofer(e.target.value)} placeholder="8 dígitos" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Celular</label>
                    <input value={telNuevoChofer} onChange={(e) => setTelNuevoChofer(e.target.value)} placeholder="9XX XXX XXX" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1" />
                  </div>
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  + GUARDAR CHOFER
                </button>
              </form>

              <div className="space-y-2">
                {choferes.map(ch => (
                  <div key={ch.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                    <div>
                      <p className="text-sm font-black text-white">{ch.nombre}</p>
                      <p className="text-xs text-slate-400">DNI: {ch.dni || '—'} • Tel: {ch.telefono || '—'}</p>
                    </div>
                    <span className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-700 px-2.5 py-1 rounded-lg font-bold">
                      ACTIVO
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'CLIENTES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Carga Masiva de Clientes (cod | cliente | apodo | dni)</h3>
                <textarea
                  rows={4}
                  value={csvTexto}
                  onChange={(e) => setCsvTexto(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs font-mono"
                />
                <button onClick={importarClientes} className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  IMPORTAR / ACTUALIZAR CLIENTES
                </button>
              </div>

              <div className="max-h-60 overflow-y-auto divide-y divide-slate-800 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs">
                {clientes.map(c => (
                  <div key={c.cod} className="py-2 flex justify-between">
                    <span><strong className="text-sky-400">[{c.cod}]</strong> {c.apodo}</span>
                    <span className="text-slate-400 truncate max-w-[180px]">{c.cliente}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'NUBE' && esDev && (
            <div className="bg-slate-950 border border-emerald-500/40 p-5 rounded-2xl space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-base font-black text-emerald-400">Conexión en Tiempo Real (Supabase + Google Drive Sheets)</h3>
                  <p className="text-xs text-slate-400">Sincroniza usuarios, bloqueos, correlativos y movimientos entre todos los celulares al instante.</p>
                </div>
                <span className={`px-3 py-1 rounded-full text-xs font-black ${sbConectado ? 'bg-emerald-950 text-emerald-300 border border-emerald-500' : 'bg-slate-800 text-slate-400'}`}>
                  {sbConectado ? '● CONECTADO' : '○ LOCAL / SIN NUBE'}
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-slate-400">Supabase Project URL</label>
                  <input
                    type="text"
                    value={sbUrl}
                    onChange={(e) => setSbUrl(e.target.value)}
                    placeholder="https://xxxxx.supabase.co"
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Supabase Anon Public Key</label>
                  <input
                    type="password"
                    value={sbKey}
                    onChange={(e) => setSbKey(e.target.value)}
                    placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                  />
                </div>
              </div>

              <div>
                <label className="text-xs text-slate-400">Google Apps Script Web App URL (Opcional — Espejo Tablilla Mensual en Drive)</label>
                <input
                  type="text"
                  value={webhookUrl}
                  onChange={(e) => setWebhookUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono mt-1"
                />
              </div>

              <button
                type="button"
                onClick={onConectarSupabase}
                className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-black rounded-xl text-sm"
              >
                CONECTAR Y SINCRONIZAR EN TIEMPO REAL
              </button>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
