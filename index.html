<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Control Avícola Consolidado — Plumífero & Los 7 Pollitos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const EMPRESAS = [
      { id: 'emp-1', nombreCorto: 'PLUMÍFERO', ruc: '20601234561', razonSocial: 'INVERSIONES Y NEGOCIACIONES PLUMÍFERO E.I.R.L.' },
      { id: 'emp-2', nombreCorto: 'LOS 7 POLLITOS', ruc: '20609876543', razonSocial: 'LOS 7 POLLITOS INVERSIONES E.I.R.L.' },
    ];

    const USUARIOS_DEMO = [
      { id: 'u-1', nombre: 'Jean Guevara (Dev)', rol: 'DESARROLLADOR', pin: '1234', desc: 'Acceso Total + Maestros + Consola' },
      { id: 'u-2', nombre: 'Gerencia / Supervisión', rol: 'SUPERVISION', pin: '1111', desc: 'Acceso Total + Kardex + Maestros' },
      { id: 'u-3', nombre: 'Operador Galpón', rol: 'TRASLADO', pin: '4444', desc: 'Solo Ingreso / Salida de Galpón' },
      { id: 'u-4', nombre: 'Despachador Acopio', rol: 'DESPACHO', pin: '5555', desc: 'Solo Emisión de Guías Pluma' },
      { id: 'u-5', nombre: 'Encargado Conteo', rol: 'CONTEO', pin: '2222', desc: 'Conteo Físico + Merma Ante-Mortem' },
      { id: 'u-6', nombre: 'Jefe de Faenado', rol: 'FAENADO', pin: '3333', desc: 'Faenado Mañana + Post-Mortem + Cierre' },
    ];

    const PERMISOS_ROL = {
      TRASLADO: ['INGRESOS'],
      DESPACHO: ['GUIAS'],
      CONTEO: ['CONTEO_ANTE'],
      FAENADO: ['FAENADO_POST'],
      SUPERVISION: ['INGRESOS', 'GUIAS', 'CONTEO_ANTE', 'FAENADO_POST', 'KARDEX', 'MAESTROS'],
      DESARROLLADOR: ['INGRESOS', 'GUIAS', 'CONTEO_ANTE', 'FAENADO_POST', 'KARDEX', 'MAESTROS'],
    };

    const GALPONES_INIT = [
      { id: 'g-1', sector: 'San Francisco', numeroGalpon: 'Galpón Único', referencia: 'Sector San Francisco Km 18', empresaId: 'emp-1' },
      { id: 'g-2', sector: 'Km 21', numeroGalpon: 'Galpón 1', referencia: 'Carretera Interoceánica Km 21 (Galponero Dino)', empresaId: 'emp-1' },
      { id: 'g-3', sector: 'Km 21', numeroGalpon: 'Galpón 2', referencia: 'Carretera Interoceánica Km 21', empresaId: 'emp-1' },
      { id: 'g-4', sector: 'Km 15', numeroGalpon: 'Galpón 1', referencia: 'Carretera Interoceánica Km 15 - Sector Norte', empresaId: 'emp-2' },
      { id: 'g-5', sector: 'Km 26', numeroGalpon: 'Galpón 1', referencia: 'Sector Km 26 Gyoel', empresaId: 'emp-2' },
    ];

    const CHOFERES_INIT = [
      { id: 'ch-1', nombre: 'Demetrio', dni: '41258963', telefono: '982 114 201', activo: true },
      { id: 'ch-2', nombre: 'Sr. Peter', dni: '04852147', telefono: '982 441 890', activo: true },
      { id: 'ch-3', nombre: 'Jesús', dni: '45896321', telefono: '974 552 310', activo: true },
      { id: 'ch-4', nombre: 'Noé', dni: '47123698', telefono: '951 887 412', activo: true },
    ];

    const PLACAS_INIT = [
      { id: 'v-1', placa: 'PLU-801', modelo: 'Hyundai HD', empresaId: 'emp-1', choferId: 'ch-1' },
      { id: 'v-2', placa: 'X4F-945', modelo: 'Mitsubishi Canter', empresaId: 'emp-1', choferId: 'ch-2' },
      { id: 'v-3', placa: 'AWN-913', modelo: 'Mitsubishi Fuso', empresaId: 'emp-2', choferId: 'ch-3' },
      { id: 'v-4', placa: 'X2T-840', modelo: 'Mitsubishi Canter', empresaId: 'emp-2', choferId: 'ch-4' },
    ];

    const CLIENTES_INIT = [
      { cod: '018', cliente: 'LUCERO DAMARIS ZEGARRA APAZA', apodo: 'Lucero Apaza' },
      { cod: '222', cliente: 'JHON CASAS', apodo: 'Jhon Casas' },
      { cod: '236', cliente: 'YULI MILAGROS', apodo: 'Yuli Milagros' },
      { cod: '075', cliente: 'TIENDA BETO // CASERITA', apodo: 'Tienda Beto' },
      { cod: '099', cliente: 'SANTOS', apodo: 'Santos' },
    ];

    function App() {
      const [usuarioActivo, setUsuarioActivo] = useState(null);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');
      const [tabActiva, setTabActiva] = useState('KARDEX');

      const [fechaOperativa, setFechaOperativa] = useState('2026-11-18');
      const [online, setOnline] = useState(true);
      const [colaOffline, setColaOffline] = useState([]);
      const [toast, setToast] = useState(null);

      // Catálogos Maestros Editables
      const [galpones, setGalpones] = useState(GALPONES_INIT);
      const [placas, setPlacas] = useState(PLACAS_INIT);
      const [choferes, setChoferes] = useState(CHOFERES_INIT);
      const [clientes, setClientes] = useState(CLIENTES_INIT);

      // Movimientos del Turno
      const [saldoInicial] = useState(0);
      const [ingresos, setIngresos] = useState([
        { id: 'i-1', sector: 'San Francisco', numeroGalpon: 'Galpón Único', empresa: 'PLUMÍFERO', placa: 'PLU-801', chofer: 'Demetrio', jabas: 200, aves: 1600, modo: 'FOTO_OCR' }
      ]);
      const [guias, setGuias] = useState([
        { id: 'gu-1', empresa: 'LOS 7 POLLITOS', numero: '001425', cod: '018', cliente: 'Lucero Apaza', jabas: 34, aves: 268, peso: 921.0, modo: 'DIGITAL' }
      ]);
      const [mermasAnte, setMermasAnte] = useState([
        { id: 'ma-1', placa: 'PLU-801', aves: 2, peso: 5.5, motivo: 'Ahogados en trayecto', conFoto: false }
      ]);
      const [confirmacionPre, setConfirmacionPre] = useState(null);
      const [faenadoManana, setFaenadoManana] = useState(null);
      const [pesoFaenado, setPesoFaenado] = useState(0);
      const [mermaPost, setMermaPost] = useState(0);
      const [confirmacionPost, setConfirmacionPost] = useState(null);
      const [alertas, setAlertas] = useState([]);

      const [mostrarNotas, setMostrarNotas] = useState(false);
      const [notasCliente, setNotasCliente] = useState([]);
      const [nuevaNota, setNuevaNota] = useState('');

      const notificar = (msg, tipo = 'ok') => {
        setToast({ msg, tipo });
        setTimeout(() => setToast(null), 4000);
      };

      const nombreEmpresa = (empId) => EMPRESAS.find(e => e.id === empId)?.nombreCorto || 'CONSOLIDADO';
      const nombreChofer = (chId) => choferes.find(c => c.id === chId)?.nombre || 'Sin asignar';

      const totalIngresosAves = ingresos.reduce((a, b) => a + b.aves, 0);
      const totalVentasVivoAves = guias.reduce((a, b) => a + b.aves, 0);
      const totalMermaAnteAves = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const saldoTeoricoPreFaenado = saldoInicial + totalIngresosAves - totalVentasVivoAves - totalMermaAnteAves;
      const basePreFaenado = confirmacionPre ? confirmacionPre.fisico : saldoTeoricoPreFaenado;
      const saldoTeoricoPostFaenado = basePreFaenado - (faenadoManana || 0) - mermaPost;

      const iniciarConUsuario = (user) => {
        setUsuarioActivo(user);
        setPinInput('');
        setPinError('');
        const permitidos = PERMISOS_ROL[user.rol];
        setTabActiva(permitidos.includes('KARDEX') ? 'KARDEX' : permitidos[0]);
      };

      const handlePinSubmit = (e) => {
        e.preventDefault();
        const encontrado = USUARIOS_DEMO.find(u => u.pin === pinInput);
        if (!encontrado) {
          setPinError('PIN incorrecto. Use uno de los accesos rápidos inferiores.');
          return;
        }
        iniciarConUsuario(encontrado);
      };

      const toggleRed = () => {
        const nuevoEstado = !online;
        setOnline(nuevoEstado);
        if (nuevoEstado && colaOffline.length > 0) {
          notificar(`Sincronizados ${colaOffline.length} registros pendientes con la nube.`);
          setColaOffline([]);
        } else if (!nuevoEstado) {
          notificar('Modo SIN SEÑAL activado: Los registros se guardarán localmente.', 'warn');
        }
      };

      const registrarEnColaSiOffline = (concepto) => {
        if (!online) {
          setColaOffline(prev => [...prev, { id: Date.now(), concepto, fecha: fechaOperativa }]);
        }
      };

      if (!usuarioActivo) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
              <div className="text-center space-y-1">
                <span className="inline-block bg-amber-500/10 text-amber-400 border border-amber-500/30 text-xs font-extrabold px-3 py-1 rounded-full tracking-wider uppercase">
                  Demo Interactivo Gerencial
                </span>
                <h1 className="text-2xl font-black text-white pt-1">Control Avícola Consolidado</h1>
                <p className="text-xs text-slate-400">Plumífero E.I.R.L. & Los 7 Pollitos E.I.R.L.</p>
              </div>

              <form onSubmit={handlePinSubmit} className="space-y-4">
                <div>
                  <label className="block text-center text-xs font-bold text-slate-400 uppercase mb-2">
                    Ingrese su PIN de Acceso (4 dígitos)
                  </label>
                  <input
                    type="password"
                    inputMode="numeric"
                    maxLength={4}
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value.replace(/\D/g, ''))}
                    placeholder="••••"
                    className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl p-4 text-center text-3xl tracking-[0.7em] font-mono text-white outline-none"
                  />
                </div>
                {pinError && <p className="text-rose-400 text-xs text-center font-bold">{pinError}</p>}
                <button
                  type="submit"
                  className="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-base shadow-lg transition"
                >
                  INGRESAR CON PIN
                </button>
              </form>

              <div className="border-t border-slate-800 pt-4">
                <p className="text-xs font-bold text-slate-400 uppercase text-center mb-3">
                  Accesos Rápidos por Perfil (1 Clic para Demo)
                </p>
                <div className="grid grid-cols-1 gap-2">
                  {USUARIOS_DEMO.map((u) => (
                    <button
                      key={u.id}
                      type="button"
                      onClick={() => iniciarConUsuario(u)}
                      className="flex items-center justify-between bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3 rounded-xl text-left transition"
                    >
                      <div>
                        <p className="text-sm font-bold text-white">{u.rol}</p>
                        <p className="text-xs text-slate-400">{u.desc}</p>
                      </div>
                      <span className="bg-slate-950 text-amber-400 font-mono text-xs font-bold px-2.5 py-1.5 rounded-lg border border-slate-700">
                        PIN: {u.pin}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      const tabsDisponibles = [
        { id: 'INGRESOS', label: '1. Traslado Galpón' },
        { id: 'GUIAS', label: '2. Guía Pluma' },
        { id: 'CONTEO_ANTE', label: '3. Conteo & Ante-Mortem' },
        { id: 'FAENADO_POST', label: '4. Faenado & Post-Mortem' },
        { id: 'KARDEX', label: '5. Kardex & Reportes' },
        { id: 'MAESTROS', label: '6. Base de Datos' },
      ].filter((t) => PERMISOS_ROL[usuarioActivo.rol].includes(t.id));

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-20">
          <header className="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div>
                <div className="flex items-center gap-2">
                  <span className="bg-amber-500 text-slate-950 text-xs font-black px-2 py-0.5 rounded">
                    {usuarioActivo.rol}
                  </span>
                  <span className="text-sm font-bold text-white">{usuarioActivo.nombre}</span>
                </div>
                <div className="flex items-center gap-2 mt-1">
                  <span className="text-xs text-slate-400">Fecha Operativa:</span>
                  <input
                    type="date"
                    value={fechaOperativa}
                    onChange={(e) => setFechaOperativa(e.target.value)}
                    className="bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-xs font-mono text-amber-300"
                  />
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={toggleRed}
                  className={`px-3 py-1.5 rounded-xl text-xs font-extrabold border ${
                    online
                      ? 'bg-emerald-950/80 border-emerald-600 text-emerald-300'
                      : 'bg-amber-950/90 border-amber-500 text-amber-300 animate-pulse'
                  }`}
                >
                  {online ? '● EN LÍNEA' : `○ SIN SEÑAL (${colaOffline.length})`}
                </button>

                <button
                  onClick={() => setMostrarNotas(!mostrarNotas)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-900/70 border border-sky-600 text-sky-200"
                >
                  Notas ({notasCliente.length})
                </button>

                <button
                  onClick={() => setUsuarioActivo(null)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200"
                >
                  Cambiar PIN
                </button>
              </div>
            </div>

            <nav className="max-w-5xl mx-auto flex gap-1.5 overflow-x-auto pt-3 pb-1">
              {tabsDisponibles.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTabActiva(t.id)}
                  className={`px-3.5 py-2 rounded-xl text-xs font-extrabold whitespace-nowrap transition ${
                    tabActiva === t.id
                      ? 'bg-amber-500 text-slate-950 shadow'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </nav>
          </header>

          {toast && (
            <div className="fixed bottom-4 right-4 left-4 md:left-auto md:w-96 z-50">
              <div
                className={`p-4 rounded-2xl shadow-2xl border text-sm font-bold ${
                  toast.tipo === 'err'
                    ? 'bg-rose-950 border-rose-500 text-rose-100'
                    : toast.tipo === 'warn'
                    ? 'bg-amber-950 border-amber-500 text-amber-100'
                    : 'bg-emerald-950 border-emerald-500 text-emerald-100'
                }`}
              >
                {toast.msg}
              </div>
            </div>
          )}

          {mostrarNotas && (
            <div className="max-w-5xl mx-auto px-4 pt-4">
              <div className="bg-sky-950/60 border border-sky-700 p-4 rounded-2xl space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sky-300 text-sm">Bitácora de Sugerencias del Cliente (Reunión)</h3>
                  <button onClick={() => setMostrarNotas(false)} className="text-xs text-slate-400">Cerrar ✕</button>
                </div>
                <div className="flex gap-2">
                  <input
                    type="text"
                    value={nuevaNota}
                    onChange={(e) => setNuevaNota(e.target.value)}
                    placeholder="Anota aquí cualquier cambio que pida el gerente..."
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm"
                  />
                  <button
                    onClick={() => {
                      if (!nuevaNota.trim()) return;
                      setNotasCliente([...notasCliente, { hora: new Date().toLocaleTimeString(), texto: nuevaNota }]);
                      setNuevaNota('');
                    }}
                    className="bg-sky-600 px-4 py-2 rounded-xl text-xs font-bold"
                  >
                    Guardar
                  </button>
                </div>
                {notasCliente.map((n, idx) => (
                  <p key={idx} className="text-xs bg-slate-900/90 p-2 rounded-lg border border-slate-800">
                    <span className="text-sky-400 font-mono">[{n.hora}]</span> {n.texto}
                  </p>
                ))}
              </div>
            </div>
          )}

          <main className="max-w-5xl mx-auto p-4 space-y-6">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Ingresos Galpón</p>
                <p className="text-2xl font-black text-emerald-400">+{totalIngresosAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Guías Pluma (Vivo)</p>
                <p className="text-2xl font-black text-sky-400">-{totalVentasVivoAves}</p>
              </div>
              <div className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl">
                <p className="text-xs text-slate-400">Merma Ante-Mortem</p>
                <p className="text-2xl font-black text-rose-400">-{totalMermaAnteAves}</p>
              </div>
              <div className="bg-slate-900 border border-amber-500/40 p-3.5 rounded-2xl">
                <p className="text-xs text-amber-300 font-bold">Saldo Vivo Disponible</p>
                <p className="text-2xl font-black text-white">{saldoTeoricoPreFaenado} aves</p>
              </div>
            </div>

            {tabActiva === 'INGRESOS' && (
              <ModuloIngresoGalpon
                galpones={galpones}
                placas={placas}
                choferes={choferes}
                nombreEmpresa={nombreEmpresa}
                nombreChofer={nombreChofer}
                congelado={!!confirmacionPre}
                onRegistrar={(nuevo) => {
                  setIngresos([...ingresos, nuevo]);
                  registrarEnColaSiOffline(`Ingreso ${nuevo.placa}: ${nuevo.aves} aves`);
                  notificar(`Ingreso registrado: +${nuevo.aves} aves (${nuevo.sector} - ${nuevo.numeroGalpon})`);
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'GUIAS' && (
              <ModuloGuiaPluma
                clientes={clientes}
                congelado={!!confirmacionPre}
                onRegistrar={(guia) => {
                  setGuias([...guias, guia]);
                  registrarEnColaSiOffline(`Guía #${guia.numero}: ${guia.aves} aves`);
                  notificar(`Guía Pluma #${guia.numero} registrada (-${guia.aves} aves)`);
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'CONTEO_ANTE' && (
              <ModuloConteoAnteMortem
                placas={placas}
                nombreChofer={nombreChofer}
                mermasAnte={mermasAnte}
                saldoTeorico={saldoTeoricoPreFaenado}
                confirmacionPre={confirmacionPre}
                usuario={usuarioActivo}
                onAgregarMerma={(m) => {
                  setMermasAnte([...mermasAnte, m]);
                  registrarEnColaSiOffline(`Merma Ante-Mortem: ${m.aves} aves`);
                  notificar(`Merma Ante-Mortem registrada (-${m.aves} aves)`, 'warn');
                }}
                onConfirmarFisico={(acta) => {
                  setConfirmacionPre(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE CONTEO FÍSICO: Teórico ${acta.teorico} vs Físico ${acta.fisico} (Diff: ${acta.diferencia})`]);
                  }
                  notificar('Acta de Saldo Físico sellada con PIN. Turno congelado.');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'FAENADO_POST' && (
              <ModuloFaenadoPostMortem
                basePreFaenado={basePreFaenado}
                faenadoManana={faenadoManana}
                mermaPost={mermaPost}
                saldoTeoricoPost={saldoTeoricoPostFaenado}
                confirmacionPost={confirmacionPost}
                usuario={usuarioActivo}
                onRegistrarFaenado={(f, pKg, mp) => {
                  setFaenadoManana(f);
                  setPesoFaenado(pKg);
                  setMermaPost(mp);
                  notificar(`Faenado registrado (${f} aves / ${pKg} kg) y Merma Post-Mortem (${mp} aves).`);
                }}
                onConfirmarPost={(acta) => {
                  setConfirmacionPost(acta);
                  if (acta.diferencia !== 0) {
                    setAlertas([...alertas, `NO-CUADRE POST-FAENADO: Remanente Teórico ${acta.teorico} vs Físico ${acta.fisico}`]);
                  }
                  notificar('Cierre Post-Faenado confirmado con PIN.');
                }}
                onError={(msg) => notificar(msg, 'err')}
              />
            )}

            {tabActiva === 'KARDEX' && (
              <ModuloKardexDashboard
                fechaOperativa={fechaOperativa}
                ingresos={ingresos}
                guias={guias}
                mermasAnte={mermasAnte}
                confirmacionPre={confirmacionPre}
                faenadoManana={faenadoManana}
                pesoFaenado={pesoFaenado}
                mermaPost={mermaPost}
                confirmacionPost={confirmacionPost}
                saldoTeoricoPreFaenado={saldoTeoricoPreFaenado}
                alertas={alertas}
                notificar={notificar}
              />
            )}

            {tabActiva === 'MAESTROS' && (
              <ModuloMaestros
                galpones={galpones}
                setGalpones={setGalpones}
                placas={placas}
                setPlacas={setPlacas}
                choferes={choferes}
                setChoferes={setChoferes}
                clientes={clientes}
                setClientes={setClientes}
                nombreEmpresa={nombreEmpresa}
                nombreChofer={nombreChofer}
                notificar={notificar}
              />
            )}
          </main>
        </div>
      );
    }

    function ModuloIngresoGalpon({ galpones, placas, choferes, nombreEmpresa, nombreChofer, congelado, onRegistrar, onError }) {
      const sectoresUnicos = [...new Set(galpones.map(g => g.sector))];
      const [sectorSel, setSectorSel] = useState(sectoresUnicos[0] || '');
      const galponesDelSector = galpones.filter(g => g.sector === sectorSel);
      const [galponId, setGalponId] = useState(galponesDelSector[0]?.id || '');

      const [placaId, setPlacaId] = useState(placas[0]?.id || '');
      const [choferId, setChoferId] = useState(placas[0]?.choferId || choferes[0]?.id || '');
      const [jabas, setJabas] = useState(60);
      const [avesPorJaba, setAvesPorJaba] = useState(9);

      const handleCambioSector = (nuevoSector) => {
        setSectorSel(nuevoSector);
        const lista = galpones.filter(g => g.sector === nuevoSector);
        setGalponId(lista[0]?.id || '');
      };

      const handleCambioPlaca = (nuevaPlacaId) => {
        setPlacaId(nuevaPlacaId);
        const veh = placas.find(p => p.id === nuevaPlacaId);
        if (veh?.choferId) setChoferId(veh.choferId);
      };

      const galponObj = galpones.find(g => g.id === galponId) || galponesDelSector[0];
      const placaObj = placas.find(p => p.id === placaId);
      const choferObj = choferes.find(c => c.id === choferId);

      const handleGuardar = (e) => {
        e.preventDefault();
        if (congelado) return onError('Turno congelado por Conteo Físico. Solicite permiso a Supervisión.');
        onRegistrar({
          id: 'ing-' + Date.now(),
          sector: galponObj?.sector || sectorSel,
          numeroGalpon: galponObj?.numeroGalpon || 'Galpón 1',
          empresa: nombreEmpresa(galponObj?.empresaId || placaObj?.empresaId),
          placa: placaObj?.placa || 'S/P',
          chofer: choferObj?.nombre || 'Chofer',
          jabas: Number(jabas),
          aves: Number(jabas) * Number(avesPorJaba),
          modo: 'DIGITAL',
        });
      };

      const simularOCR = () => {
        if (congelado) return onError('Turno congelado por Conteo Físico.');
        onRegistrar({
          id: 'ing-' + Date.now(),
          sector: 'Km 21',
          numeroGalpon: 'Galpón 2',
          empresa: 'PLUMÍFERO',
          placa: 'X4F-945',
          chofer: 'Sr. Peter',
          jabas: 108,
          aves: 1116,
          modo: 'FOTO_OCR',
        });
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
          <div className="flex flex-wrap justify-between items-center gap-2">
            <div>
              <span className="text-xs font-extrabold text-amber-400 uppercase">Módulo 1 • Traslado de Granja</span>
              <h2 className="text-lg font-black text-white">Ingreso de Pollo Vivo (Galpón → Acopio)</h2>
              <p className="text-xs text-slate-400">Selecciona Dirección, N° de Galpón, Placa y Chofer asignado.</p>
            </div>
            <button
              type="button"
              onClick={simularOCR}
              className="bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500 text-amber-300 px-3 py-2 rounded-xl text-xs font-extrabold"
            >
              📷 Simular Foto Ticket Km 21 - G2 (OCR)
            </button>
          </div>

          <form onSubmit={handleGuardar} className="space-y-4">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">1. Dirección / Sector de Granja</label>
                <select
                  value={sectorSel}
                  onChange={(e) => handleCambioSector(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {sectoresUnicos.map((sec) => (
                    <option key={sec} value={sec}>{sec}</option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">2. Número de Galpón (Deduce Empresa)</label>
                <select
                  value={galponId}
                  onChange={(e) => setGalponId(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold text-amber-300"
                >
                  {galponesDelSector.map((g) => (
                    <option key={g.id} value={g.id}>
                      {g.numeroGalpon} — [{nombreEmpresa(g.empresaId)}]
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div>
                <label className="block text-xs text-slate-400 mb-1">3. Placa del Vehículo</label>
                <select
                  value={placaId}
                  onChange={(e) => handleCambioPlaca(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {placas.map((v) => (
                    <option key={v.id} value={v.id}>
                      {v.placa} ({v.modelo}) — [{nombreEmpresa(v.empresaId)}]
                    </option>
                  ))}
                </select>
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">4. Chofer del Viaje</label>
                <select
                  value={choferId}
                  onChange={(e) => setChoferId(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold"
                >
                  {choferes.map((ch) => (
                    <option key={ch.id} value={ch.id}>
                      {ch.nombre} {ch.dni ? `(DNI: ${ch.dni})` : ''}
                    </option>
                  ))}
                </select>
              </div>
            </div>

            <div className="grid grid-cols-3 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800">
              <div>
                <label className="block text-xs text-slate-400 mb-1">Cant. Jabas</label>
                <input
                  type="number"
                  min={1}
                  value={jabas}
                  onChange={(e) => setJabas(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                />
              </div>
              <div>
                <label className="block text-xs text-slate-400 mb-1">Pollos x Jaba</label>
                <input
                  type="number"
                  min={1}
                  value={avesPorJaba}
                  onChange={(e) => setAvesPorJaba(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                />
              </div>
              <div className="flex flex-col justify-center items-center">
                <span className="text-xs text-slate-400">Total Ingreso</span>
                <span className="text-2xl font-black text-emerald-400">+{Number(jabas) * Number(avesPorJaba)}</span>
              </div>
            </div>

            <button type="submit" className="w-full py-4 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-black text-base">
              REGISTRAR INGRESO DE CARRO
            </button>
          </form>
        </div>
      );
    }

                <select value={empresa} onChange={(e) => setEmpresa(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 font-bold">
                  <option value="PLUMÍFERO">PLUMÍFERO</option>
                  <option value="LOS 7 POLLITOS">LOS 7 POLLITOS</option>

              <div>
                <label className="block text-xs text-slate-400 mb-1">N° Guía Pluma</label>

            <button type="submit" className="w-full py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-2xl font-black text-base">

            </button>

      );

    function ModuloConteoAnteMortem({ placas, nombreChofer, mermasAnte, saldoTeorico, confirmacionPre, usuario, onAgregarMerma, onConfirmarFisico, onError }) {
      const [avesMuertas, setAvesMuertas] = useState(1);
      const [pesoMerma, setPesoMerma] = useState(2.8);
      const [placa, setPlaca] = useState(placas[0]?.placa || '');
      const [fotoCapturada, setFotoCapturada] = useState(false);

      const [lotes, setLotes] = useState([{ jabas: Math.floor(saldoTeorico / 8), avesJaba: 8 }]);
      const [pin, setPin] = useState('');
      const [obs, setObs] = useState('');

      const acumuladoAnte = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const requiereFoto = (acumuladoAnte + Number(avesMuertas)) > 2;

      const handleMerma = (e) => {
        e.preventDefault();
        if (requiereFoto && !fotoCapturada) {
          return onError('CANDADO ANTI-FRAUDE: Supera el límite acumulado de 2 aves. Capture foto en vivo obligatoria.');
        }
        onAgregarMerma({
          id: 'ma-' + Date.now(),
          placa,
          aves: Number(avesMuertas),
          peso: Number(pesoMerma),
          motivo: 'Muerte en transporte / espera',
          conFoto: fotoCapturada,
        });
        setFotoCapturada(false);
      };

      const totalFisico = lotes.reduce((acc, l) => acc + Number(l.jabas || 0) * Number(l.avesJaba || 0), 0);
      const diff = totalFisico - saldoTeorico;

      const igualarSaldoApp = () => {
        const completas = Math.floor(saldoTeorico / 8);
        const resto = saldoTeorico % 8;
        const nuevos = [{ jabas: completas, avesJaba: 8 }];
        if (resto > 0) nuevos.push({ jabas: 1, avesJaba: resto });
        setLotes(nuevos);
      };

      const handleConfirmar = (e) => {
        e.preventDefault();
        if (pin !== usuario.pin && pin !== '1234') {
          return onError(`PIN incorrecto. Para este perfil use PIN: ${usuario.pin}`);
        }
        if (diff !== 0 && obs.trim().length < 4) {
          return onError('Existe diferencia vs el sistema. Ingrese observación obligatoria.');
        }
        onConfirmarFisico({
          teorico: saldoTeorico,
          fisico: totalFisico,
          diferencia: diff,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        });
        setPin('');
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-slate-900 border border-amber-500/40 rounded-3xl p-5 space-y-4">
            <div className="flex justify-between items-start gap-2">
              <div>
                <span className="text-xs font-extrabold text-sky-400 uppercase">Módulo 3A • Verificación Física en Campo</span>
                <h3 className="text-base font-black text-white">Acta de Confirmación de Saldo Físico</h3>
              </div>
              {!confirmacionPre && (
                <button
                  type="button"
                  onClick={igualarSaldoApp}
                  className="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1.5 rounded-xl font-bold text-sky-300"
                >
                  Igualar a Saldo App ({saldoTeorico})
                </button>
              )}
            </div>

            <div className="grid grid-cols-3 gap-2 text-center bg-slate-950 p-3 rounded-2xl">
              <div><p className="text-xs text-slate-400">Saldo Teórico App</p><p className="font-black text-xl text-sky-400">{saldoTeorico}</p></div>
              <div><p className="text-xs text-slate-400">Físico Contado</p><p className="font-black text-xl text-white">{totalFisico}</p></div>
              <div><p className="text-xs text-slate-400">Diferencia</p><p className={`font-black text-xl ${diff === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{diff}</p></div>
            </div>

            {confirmacionPre ? (
              <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                <p className="font-black text-emerald-300">✓ SALDO FÍSICO CONFIRMADO Y SELLADO</p>
                <p>Responsable: {confirmacionPre.responsable} ({confirmacionPre.hora})</p>
                <p>Conteo Físico: {confirmacionPre.fisico} aves (Dif: {confirmacionPre.diferencia})</p>
              </div>
            ) : (
              <form onSubmit={handleConfirmar} className="space-y-3">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-slate-400 uppercase">Desglose Contado</span>
                  <button
                    type="button"
                    onClick={() => setLotes([...lotes, { jabas: 1, avesJaba: 6 }])}
                    className="bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg"
                  >
                    + Pucho / Lote
                  </button>
                </div>

                <div className="space-y-2">
                  {lotes.map((l, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <input
                        type="number"
                        value={l.jabas}
                        onChange={(e) => { const c = [...lotes]; c[idx].jabas = e.target.value; setLotes(c); }}
                        className="w-24 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-center font-bold"
                      />
                      <span className="text-xs text-slate-400">jbs ×</span>
                      <input
                        type="number"
                        value={l.avesJaba}
                        onChange={(e) => { const c = [...lotes]; c[idx].avesJaba = e.target.value; setLotes(c); }}
                        className="w-20 bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-center font-bold"
                      />
                      <span className="text-xs font-bold text-sky-400 ml-auto">
                        = {Number(l.jabas || 0) * Number(l.avesJaba || 0)} aves
                      </span>
                    </div>
                  ))}
                </div>

                {diff !== 0 && (
                  <input
                    type="text"
                    value={obs}
                    onChange={(e) => setObs(e.target.value)}
                    placeholder="Justificación obligatoria por diferencia..."
                    className="w-full bg-slate-800 border border-rose-500 rounded-xl p-2.5 text-xs"
                  />
                )}
                <input
                  type="password"
                  maxLength={4}
                  value={pin}
                  onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                  placeholder={`PIN Personal (prueba: ${usuario.pin} o 1111)`}
                  className="w-full bg-slate-800 border border-amber-500/60 rounded-xl p-3 text-center font-mono text-lg"
                />
                <button type="submit" className="w-full py-3.5 bg-sky-600 hover:bg-sky-500 rounded-xl font-black text-sm">
                  FIRMAR CON PIN Y SELLAR SALDO FÍSICO
                </button>
              </form>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
            <span className="text-xs font-extrabold text-rose-400 uppercase">Módulo 3B • Mortalidad Pre-Beneficio</span>
            <h3 className="text-base font-black text-white">Registro Merma Ante-Mortem</h3>
            <p className="text-xs text-slate-400">Acumulado actual: <strong className="text-white">{acumuladoAnte} aves</strong> (Límite sin foto: 2 aves).</p>
            <form onSubmit={handleMerma} className="space-y-3">
              <div>
                <label className="text-xs text-slate-400">Vehículo / Placa</label>
                <select value={placa} onChange={(e) => setPlaca(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm font-bold">
                  {placas.map(v => <option key={v.id} value={v.placa}>{v.placa} — {nombreChofer(v.choferId)}</option>)}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-slate-400">Aves Muertas</label>
                  <input
                    type="number"
                    min={1}
                    value={avesMuertas}
                    onChange={(e) => setAvesMuertas(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Peso (kg)</label>
                  <input
                    type="number"
                    step="0.1"
                    value={pesoMerma}
                    onChange={(e) => setPesoMerma(e.target.value)}
                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg"
                  />
                </div>
              </div>
              {requiereFoto && (
                <button
                  type="button"
                  onClick={() => setFotoCapturada(true)}
                  className={`w-full py-3 rounded-xl text-xs font-extrabold border ${
                    fotoCapturada ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-rose-950 border-rose-500 text-rose-200 animate-pulse'

                </button>
              )}
              <button type="submit" className="w-full py-3.5 bg-rose-600 hover:bg-rose-500 rounded-xl font-black text-sm">
                REGISTRAR MERMA ANTE-MORTEM
              </button>
            </form>
          </div>
        </div>
      );
    }

    function ModuloFaenadoPostMortem({ basePreFaenado, faenadoManana, mermaPost, saldoTeoricoPost, confirmacionPost, usuario, onRegistrarFaenado, onConfirmarPost, onError }) {
      const [cantFaenado, setCantFaenado] = useState(faenadoManana ?? basePreFaenado);
      const [pesoTotalKg, setPesoTotalKg] = useState(2850);
      const [cantPostMortem, setCantPostMortem] = useState(mermaPost);
      const [detalleObs, setDetalleObs] = useState('Lote beneficio turno mañana');
      const [saldoRemanenteFisico, setSaldoRemanenteFisico] = useState(0);
      const [pin, setPin] = useState('');

      const handleGuardarFaenado = (e) => {
        e.preventDefault();
        onRegistrarFaenado(Number(cantFaenado), Number(pesoTotalKg), Number(cantPostMortem));
      };

      const handleCierrePost = (e) => {
        e.preventDefault();
        if (pin !== usuario.pin && pin !== '1234') {
          return onError(`PIN incorrecto. Use PIN: ${usuario.pin}`);
        }
        onConfirmarPost({
          teorico: saldoTeoricoPost,
          fisico: Number(saldoRemanenteFisico),
          diferencia: Number(saldoRemanenteFisico) - saldoTeoricoPost,
          responsable: usuario.nombre,
          hora: new Date().toLocaleTimeString(),
        });
        setPin('');
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
            <span className="text-xs font-extrabold text-purple-400 uppercase">Módulo 4A • Turno Mañana</span>
            <h3 className="text-base font-black text-white">Faenado y Merma Post-Mortem</h3>
            <p className="text-xs text-slate-400">Disponible Pre-Faena: <strong className="text-sky-400">{basePreFaenado} aves</strong></p>
            <form onSubmit={handleGuardarFaenado} className="space-y-3">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="text-xs text-slate-400">Cantidad Aves Faenado</label>
                  <input type="number" value={cantFaenado} onChange={(e) => setCantFaenado(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
                <div>
                  <label className="text-xs text-slate-400">Peso Total (kg)</label>
                  <input type="number" step="0.1" value={pesoTotalKg} onChange={(e) => setPesoTotalKg(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
              </div>
              <div>
                <label className="text-xs text-slate-400">Merma Post-Mortem (Decomiso / Descarte Línea)</label>
                <input type="number" value={cantPostMortem} onChange={(e) => setCantPostMortem(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg text-rose-400" />
              </div>
              <div>
                <label className="text-xs text-slate-400">Detalle / Observación</label>
                <input type="text" value={detalleObs} onChange={(e) => setDetalleObs(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-purple-600 hover:bg-purple-500 rounded-xl font-black text-sm">
                REGISTRAR FAENADO MAÑANA
              </button>
            </form>
          </div>

          <div className="bg-slate-900 border border-emerald-500/40 rounded-3xl p-5 space-y-4">
            <span className="text-xs font-extrabold text-emerald-400 uppercase">Módulo 4B • Cierre Final del Día</span>
            <h3 className="text-base font-black text-white">Confirmación Saldo Post-Faenado</h3>
            <p className="text-xs text-slate-400">Aves vivas remanentes en acopio (arrastre para siguiente noche).</p>
            {confirmacionPost ? (
              <div className="bg-emerald-950/60 border border-emerald-600 p-4 rounded-2xl text-xs space-y-1">
                <p className="font-black text-emerald-300">✓ CIERRE POST-FAENADO SELLADO</p>
                <p>Responsable: {confirmacionPost.responsable} ({confirmacionPost.hora})</p>
                <p>Saldo Remanente Confirmado: {confirmacionPost.fisico} aves</p>
              </div>
            ) : (
              <form onSubmit={handleCierrePost} className="space-y-3">
                <div className="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-xl text-center">
                  <div>
                    <p className="text-xs text-slate-400">Remanente Teórico</p>
                    <p className="font-black text-xl text-sky-400">{saldoTeoricoPost}</p>
                  </div>
                  <div>
                    <p className="text-xs text-slate-400">Descuadre</p>
                    <p className={`font-black text-xl ${Number(saldoRemanenteFisico) - saldoTeoricoPost === 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      {Number(saldoRemanenteFisico) - saldoTeoricoPost}
                    </p>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Aves Vivas Remanentes Contadas</label>
                  <input type="number" value={saldoRemanenteFisico} onChange={(e) => setSaldoRemanenteFisico(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-center font-black text-lg" />
                </div>
                <input
                  type="password"
                  maxLength={4}
                  value={pin}
                  onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))}
                  placeholder={`PIN Jefe Faenado (prueba: ${usuario.pin} o 1111)`}
                  className="w-full bg-slate-800 border border-emerald-500/60 rounded-xl p-3 text-center font-mono text-lg"
                />
                <button type="submit" className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-black text-sm">
                  CONFIRMAR SALDO POST-FAENADO
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function ModuloKardexDashboard({ fechaOperativa, ingresos, guias, mermasAnte, confirmacionPre, faenadoManana, pesoFaenado, mermaPost, confirmacionPost, saldoTeoricoPreFaenado, alertas, notificar }) {
      let saldoCorriente = 0;

      const exportarCSV = () => {
        let saldo = 0;
        const filas = [['FECHA', 'BLOQUE', 'CONCEPTO', 'EMPRESA', 'JABAS', 'ENTRADA', 'SALIDA', 'SALDO']];
        ingresos.forEach(i => {
          saldo += i.aves;
          filas.push([fechaOperativa, 'NOCHE', `${i.sector} - ${i.numeroGalpon} (${i.placa} - ${i.chofer})`, i.empresa, i.jabas, i.aves, 0, saldo]);
        });
        guias.forEach(g => {
          saldo -= g.aves;
          filas.push([fechaOperativa, 'NOCHE', `Guía #${g.numero} - [${g.cod}] ${g.cliente}`, g.empresa, g.jabas, 0, g.aves, saldo]);
        });
        mermasAnte.forEach(m => {
          saldo -= m.aves;
          filas.push([fechaOperativa, 'ANTE-MORTEM', `Merma Ante-Mortem (${m.placa})`, 'CONSOLIDADO', 0, 0, m.aves, saldo]);
        });
        if (faenadoManana !== null) {
          saldo -= (faenadoManana + mermaPost);
          filas.push([fechaOperativa, 'MAÑANA', `Faenado (${pesoFaenado} kg) + Post-Mortem (${mermaPost})`, 'CONSOLIDADO', 0, 0, faenadoManana + mermaPost, saldo]);
        }
        const csvContent = 'data:text/csv;charset=utf-8,' + filas.map(e => e.join(',')).join('\n');
        const link = document.createElement('a');
        link.setAttribute('href', encodeURI(csvContent));
        link.setAttribute('download', `Kardex_Avicola_${fechaOperativa}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notificar('Archivo CSV del Kardex descargado.');
      };

      return (
        <div className="space-y-5">
          {alertas.length > 0 && (
            <div className="bg-rose-950/80 border border-rose-500 p-4 rounded-2xl space-y-1">
              <p className="text-xs font-black text-rose-300 uppercase">Alertas de Auditoría Activas</p>
              {alertas.map((a, i) => <p key={i} className="text-xs text-white">• {a}</p>)}
            </div>
          )}

          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 overflow-x-auto">
            <div className="flex flex-wrap justify-between items-center gap-2 mb-4">
              <div>
                <h2 className="text-lg font-black text-white">Kardex Vertical Consolidado ({fechaOperativa})</h2>
                <p className="text-xs text-slate-400">Arrastre automático de saldos desde apertura nocturna hasta cierre post-faenado.</p>
              </div>
              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={exportarCSV}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold px-3 py-1.5 rounded-xl"
                >
                  ⬇ Exportar Kardex CSV
                </button>
                <span className="text-xs bg-slate-800 px-3 py-1.5 rounded-xl font-bold text-amber-400">
                  {confirmacionPre ? `Sellado: ${confirmacionPre.responsable}` : 'Pendiente Conteo'}
                </span>
              </div>
            </div>

            <table className="w-full text-left border-collapse text-xs">
              <thead>
                <tr className="border-b border-slate-700 text-slate-400">
                  <th className="py-2 px-2">BLOQUE</th>
                  <th className="py-2 px-2">CONCEPTO / GALPÓN / CLIENTE</th>
                  <th className="py-2 px-2">EMPRESA</th>
                  <th className="py-2 px-2 text-right">JABAS</th>
                  <th className="py-2 px-2 text-right">ENTRADA</th>
                  <th className="py-2 px-2 text-right">SALIDA</th>
                  <th className="py-2 px-2 text-right">SALDO</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {ingresos.map((ing) => {
                  saldoCorriente += ing.aves;
                  return (
                    <tr key={ing.id} className="bg-emerald-950/20">
                      <td className="py-2.5 px-2 font-bold text-emerald-400">NOCHE</td>
                      <td className="py-2.5 px-2">{ing.sector} — <strong>{ing.numeroGalpon}</strong> ({ing.placa} - {ing.chofer})</td>
                      <td className="py-2.5 px-2 font-mono">{ing.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{ing.jabas}</td>
                      <td className="py-2.5 px-2 text-right font-bold text-emerald-400">+{ing.aves}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {guias.map((g) => {
                  saldoCorriente -= g.aves;
                  return (
                    <tr key={g.id} className="bg-sky-950/20">
                      <td className="py-2.5 px-2 font-bold text-sky-400">NOCHE</td>
                      <td className="py-2.5 px-2">Guía #{g.numero} — [{g.cod}] {g.cliente}</td>
                      <td className="py-2.5 px-2 font-mono">{g.empresa}</td>
                      <td className="py-2.5 px-2 text-right">{g.jabas}</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-sky-400">-{g.aves}</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                {mermasAnte.map((m) => {
                  saldoCorriente -= m.aves;
                  return (
                    <tr key={m.id} className="bg-rose-950/20">
                      <td className="py-2.5 px-2 font-bold text-rose-400">ANTE-M</td>
                      <td className="py-2.5 px-2">Merma Ante-Mortem ({m.placa}) {m.conFoto ? '📷' : ''}</td>
                      <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right">0</td>
                      <td className="py-2.5 px-2 text-right font-bold text-rose-400">-{m.aves}</td>
                      <td className="py-2.5 px-2 text-right font-black">{saldoCorriente}</td>
                    </tr>
                  );
                })}
                <tr className="bg-amber-950/30 font-bold">
                  <td className="py-2.5 px-2 text-amber-400">SALDO</td>
                  <td className="py-2.5 px-2">SALDO DISPONIBLE PARA FAENADO</td>
                  <td className="py-2.5 px-2">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right">-</td>
                  <td className="py-2.5 px-2 text-right font-black text-amber-400">{saldoTeoricoPreFaenado}</td>
                </tr>
                {faenadoManana !== null && (
                  <tr className="bg-slate-800/60">
                    <td className="py-2.5 px-2 font-bold text-purple-400">MAÑANA</td>
                    <td className="py-2.5 px-2">FAENADO 7P - PL ({pesoFaenado} kg | Post-Mortem: {mermaPost} aves)</td>
                    <td className="py-2.5 px-2 font-mono">CONSOLIDADO</td>
                    <td className="py-2.5 px-2 text-right">-</td>
                    <td className="py-2.5 px-2 text-right">0</td>
                    <td className="py-2.5 px-2 text-right font-bold text-purple-300">-{faenadoManana + mermaPost}</td>
                    <td className="py-2.5 px-2 text-right font-black">{confirmacionPost ? confirmacionPost.fisico : saldoTeoricoPreFaenado - faenadoManana - mermaPost}</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ModuloMaestros({ galpones, setGalpones, placas, setPlacas, choferes, setChoferes, clientes, setClientes, nombreEmpresa, nombreChofer, notificar }) {
      const [subTab, setSubTab] = useState('GALPONES');

      // Estados Galpones
      const [empresaGalpon, setEmpresaGalpon] = useState('emp-1');
      const [sectorGalpon, setSectorGalpon] = useState('');
      const [numeroGalpon, setNumeroGalpon] = useState('Galpón 1');
      const [referenciaGalpon, setReferenciaGalpon] = useState('');
      const [cantidadLote, setCantidadLote] = useState(1);

      // Estados Placas
      const [nuevaPlaca, setNuevaPlaca] = useState('');
      const [modeloPlaca, setModeloPlaca] = useState('');
      const [empresaPlaca, setEmpresaPlaca] = useState('emp-1');
      const [choferHabitualPlaca, setChoferHabitualPlaca] = useState(choferes[0]?.id || '');

      // Estados Choferes
      const [nombreNuevoChofer, setNombreNuevoChofer] = useState('');
      const [dniNuevoChofer, setDniNuevoChofer] = useState('');
      const [telNuevoChofer, setTelNuevoChofer] = useState('');

      // Estados Clientes
      const [csvTexto, setCsvTexto] = useState('045\tMARIA ELENA QUISPE\tMaria Quispe');

      const agregarGalpon = (e) => {
        e.preventDefault();
        if (!sectorGalpon.trim()) return;
        const cant = Number(cantidadLote);
        if (cant > 1) {
          const nuevos = [];
          for (let i = 1; i <= cant; i++) {
            nuevos.push({
              id: 'g-' + Date.now() + '-' + i,
              sector: sectorGalpon.trim(),
              numeroGalpon: `Galpón ${i}`,
              referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
              empresaId: empresaGalpon,
            });
          }
          setGalpones([...galpones, ...nuevos]);
          notificar(`Se crearon ${cant} galpones (Galpón 1 al ${cant}) en ${sectorGalpon}.`);
        } else {
          setGalpones([
            ...galpones,
            {
              id: 'g-' + Date.now(),
              sector: sectorGalpon.trim(),
              numeroGalpon,
              referencia: referenciaGalpon.trim() || sectorGalpon.trim(),
              empresaId: empresaGalpon,
            },
          ]);
          notificar(`Dirección ${sectorGalpon} (${numeroGalpon}) registrada.`);
        }
        setSectorGalpon('');
        setReferenciaGalpon('');
        setCantidadLote(1);
      };

      const agregarPlaca = (e) => {
        e.preventDefault();
        if (!nuevaPlaca.trim()) return;
        setPlacas([
          ...placas,
          {
            id: 'v-' + Date.now(),
            placa: nuevaPlaca.trim().toUpperCase(),
            modelo: modeloPlaca.trim() || 'Camión Furgón',
            empresaId: empresaPlaca,
            choferId: choferHabitualPlaca,
          },
        ]);
        setNuevaPlaca('');
        setModeloPlaca('');
        notificar('Placa / Vehículo registrado en el catálogo.');
      };

      const agregarChofer = (e) => {
        e.preventDefault();
        if (!nombreNuevoChofer.trim()) return;
        setChoferes([
          ...choferes,
          {
            id: 'ch-' + Date.now(),
            nombre: nombreNuevoChofer.trim(),
            dni: dniNuevoChofer.trim(),
            telefono: telNuevoChofer.trim(),
            activo: true,
          },
        ]);
        setNombreNuevoChofer('');
        setDniNuevoChofer('');
        setTelNuevoChofer('');
        notificar('Chofer registrado correctamente.');
      };

      const importarClientes = () => {
        const lineas = csvTexto.split('\n').map(l => l.trim()).filter(Boolean);
        const nuevos = [...clientes];
        lineas.forEach(linea => {
          const partes = linea.split(/\t|,|;/).map(p => p.trim());
          if (partes.length >= 3) {
            const idx = nuevos.findIndex(c => c.cod === partes[0]);
            const obj = { cod: partes[0], cliente: partes[1].toUpperCase(), apodo: partes[2] };
            if (idx >= 0) nuevos[idx] = obj;
            else nuevos.push(obj);
          }
        });
        setClientes(nuevos);
        notificar(`Importación masiva completada (${lineas.length} clientes procesados).`);
      };

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-5">
          <div>
            <span className="text-xs font-extrabold text-sky-400 uppercase">Base de Datos Interna • Catálogos Maestros</span>
            <h2 className="text-lg font-black text-white">Direcciones, Galpones, Placas, Choferes y Clientes</h2>
          </div>

          <div className="flex flex-wrap gap-2 bg-slate-950 p-2 rounded-2xl border border-slate-800">
            <button
              type="button"
              onClick={() => setSubTab('GALPONES')}
              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'GALPONES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
            >
              Direcciones / Galpones ({galpones.length})
            </button>
            <button
              type="button"
              onClick={() => setSubTab('PLACAS')}
              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'PLACAS' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
            >
              Placas ({placas.length})
            </button>
            <button
              type="button"
              onClick={() => setSubTab('CHOFERES')}
              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'CHOFERES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
            >
              Choferes ({choferes.length})
            </button>
            <button
              type="button"
              onClick={() => setSubTab('CLIENTES')}
              className={`px-3.5 py-2 rounded-xl text-xs font-extrabold transition ${subTab === 'CLIENTES' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-white'}`}
            >
              Clientes ({clientes.length})
            </button>
          </div>

          {subTab === 'GALPONES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarGalpon} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Nueva Dirección / Galpón</h3>
                <div>
                  <label className="text-xs text-slate-400">Empresa Titular (Obligatorio)</label>
                  <select value={empresaGalpon} onChange={(e) => setEmpresaGalpon(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {EMPRESAS.map(emp => <option key={emp.id} value={emp.id}>{emp.nombreCorto} ({emp.ruc})</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Dirección / Sector (ej. Km 32 Granja Santa Rosa)</label>
                  <input value={sectorGalpon} onChange={(e) => setSectorGalpon(e.target.value)} placeholder="Ej. Km 32 Granja Santa Rosa" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">Número de Galpón</label>
                    <select value={numeroGalpon} onChange={(e) => setNumeroGalpon(e.target.value)} disabled={Number(cantidadLote) > 1} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                      <option value="Galpón Único">Galpón Único</option>
                      <option value="Galpón 1">Galpón 1</option>
                      <option value="Galpón 2">Galpón 2</option>
                      <option value="Galpón 3">Galpón 3</option>
                      <option value="Galpón 4">Galpón 4</option>
                      <option value="Galpón 5">Galpón 5</option>
                      <option value="Galpón 6">Galpón 6</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">¿Crear varios del 1 al N?</label>
                    <select value={cantidadLote} onChange={(e) => setCantidadLote(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1 text-amber-300">
                      <option value={1}>Solo 1 galpón</option>
                      <option value={2}>Generar Galpón 1 al 2</option>
                      <option value={3}>Generar Galpón 1 al 3</option>
                      <option value={4}>Generar Galpón 1 al 4</option>
                      <option value={5}>Generar Galpón 1 al 5</option>
                      <option value={6}>Generar Galpón 1 al 6</option>
                    </select>
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Referencia / Galponero</label>
                  <input value={referenciaGalpon} onChange={(e) => setReferenciaGalpon(e.target.value)} placeholder="Referencia carretera / galponero..." className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  GUARDAR DIRECCIÓN Y GALPÓN
                </button>
              </form>

              <div className="space-y-2 max-h-96 overflow-y-auto">
                {galpones.map(g => (
                  <div key={g.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between gap-2">
                    <div>
                      <p className="text-sm font-black text-white">{g.sector} — <span className="text-amber-400">{g.numeroGalpon}</span></p>
                      <p className="text-xs text-slate-400">{g.referencia}</p>
                    </div>
                    <span className={`text-xs font-mono font-bold px-2.5 py-1 rounded-lg ${g.empresaId === 'emp-1' ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' : 'bg-amber-950 text-amber-300 border border-amber-700'}`}>
                      {nombreEmpresa(g.empresaId)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'PLACAS' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarPlaca} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Registrar Nueva Placa / Vehículo</h3>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">N° Placa</label>
                    <input value={nuevaPlaca} onChange={(e) => setNuevaPlaca(e.target.value)} placeholder="Ej. B4K-712" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono uppercase mt-1" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Marca / Modelo</label>
                    <input value={modeloPlaca} onChange={(e) => setModeloPlaca(e.target.value)} placeholder="Ej. Hyundai HD78" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                  </div>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Empresa Asignada</label>
                  <select value={empresaPlaca} onChange={(e) => setEmpresaPlaca(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {EMPRESAS.map(emp => <option key={emp.id} value={emp.id}>{emp.nombreCorto}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-xs text-slate-400">Chofer Habitual</label>
                  <select value={choferHabitualPlaca} onChange={(e) => setChoferHabitualPlaca(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-bold mt-1">
                    {choferes.map(ch => <option key={ch.id} value={ch.id}>{ch.nombre}</option>)}
                  </select>
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  + GUARDAR PLACA
                </button>
              </form>

              <div className="space-y-2">
                {placas.map(p => (
                  <div key={p.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                    <div>
                      <p className="text-sm font-mono font-black text-amber-400">{p.placa} <span className="font-sans text-white font-bold">({p.modelo})</span></p>
                      <p className="text-xs text-slate-400">Chofer habitual: {nombreChofer(p.choferId)}</p>
                    </div>
                    <span className="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-sky-300">
                      {nombreEmpresa(p.empresaId)}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'CHOFERES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <form onSubmit={agregarChofer} className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Registrar Nuevo Chofer</h3>
                <div>
                  <label className="text-xs text-slate-400">Nombre Completo / Apodo</label>
                  <input value={nombreNuevoChofer} onChange={(e) => setNombreNuevoChofer(e.target.value)} placeholder="Ej. Carlos Mendoza" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm mt-1" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-xs text-slate-400">DNI / Licencia</label>
                    <input value={dniNuevoChofer} onChange={(e) => setDniNuevoChofer(e.target.value)} placeholder="8 dígitos" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1" />
                  </div>
                  <div>
                    <label className="text-xs text-slate-400">Celular</label>
                    <input value={telNuevoChofer} onChange={(e) => setTelNuevoChofer(e.target.value)} placeholder="9XX XXX XXX" className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm font-mono mt-1" />
                  </div>
                </div>
                <button type="submit" className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  + GUARDAR CHOFER
                </button>
              </form>

              <div className="space-y-2">
                {choferes.map(ch => (
                  <div key={ch.id} className="bg-slate-950 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                    <div>
                      <p className="text-sm font-black text-white">{ch.nombre}</p>
                      <p className="text-xs text-slate-400">DNI: {ch.dni || '—'} • Tel: {ch.telefono || '—'}</p>
                    </div>
                    <span className="text-xs bg-emerald-950 text-emerald-300 border border-emerald-700 px-2.5 py-1 rounded-lg font-bold">
                      ACTIVO
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'CLIENTES' && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div className="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-3">
                <h3 className="text-sm font-black text-white">Carga Masiva de Clientes (cod | cliente | apodo)</h3>
                <textarea
                  rows={4}
                  value={csvTexto}
                  onChange={(e) => setCsvTexto(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs font-mono"
                />
                <button onClick={importarClientes} className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-black rounded-xl text-xs">
                  IMPORTAR / ACTUALIZAR CLIENTES
                </button>
              </div>

              <div className="max-h-60 overflow-y-auto divide-y divide-slate-800 bg-slate-950 border border-slate-800 rounded-2xl p-3 text-xs">
                {clientes.map(c => (
                  <div key={c.cod} className="py-2 flex justify-between">
                    <span><strong className="text-sky-400">[{c.cod}]</strong> {c.apodo}</span>
                    <span className="text-slate-400 truncate max-w-[180px]">{c.cliente}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
