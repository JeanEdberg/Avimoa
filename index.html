    // =========================================================================
    // GENERADOR PDF A5 "NOTA DE PEDIDO"

    function descargarPDFNotaPedido(guia) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a5' });

      const azul = [28, 63, 148];
      const azulClaro = [235, 242, 255];
      const rojo = [210, 35, 42];
      const negro = [15, 23, 42];

      const empInfo = EMPRESAS.find(e => e.nombreCorto === guia.empresa) || EMPRESAS[0];

      doc.setDrawColor(...azul);
      doc.setLineWidth(0.45);
      doc.rect(6, 6, 136, 198);

      doc.setFillColor(...azulClaro);
      doc.circle(16.5, 16.5, 7.5, 'F');
      doc.setDrawColor(...azul);
      doc.circle(16.5, 16.5, 7.5, 'S');
      doc.setFillColor(...azul);
      doc.circle(16.5, 15, 3.2, 'F');
      doc.circle(16.5, 19.5, 4.2, 'F');
      doc.setFillColor(255, 255, 255);
      doc.circle(15.3, 14.5, 0.7, 'F');
      doc.circle(17.7, 14.5, 0.7, 'F');
      doc.setFillColor(245, 158, 11);
      doc.triangle(15.8, 15.6, 17.2, 15.6, 16.5, 16.8, 'F');

      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12.5);
      doc.text('"CENTRO DE ACOPIO"', 54, 13.5, { align: 'center' });

      doc.setFontSize(6.3);
      doc.text('VENTA DE POLLOS A PRECIOS ESPECIALES', 54, 17.8, { align: 'center' });
      doc.text('AL POR MAYOR Y MENOR', 54, 21.0, { align: 'center' });

      doc.setDrawColor(...azul);
      doc.setLineWidth(0.4);
      doc.rect(86, 8.5, 53, 16.5);
      doc.setFillColor(...azulClaro);
      doc.rect(86, 8.5, 53, 6.5, 'F');
      doc.line(86, 15, 139, 15);

      doc.setTextColor(...azul);
      doc.setFontSize(10.5);
      doc.text('NOTA DE PEDIDO', 112.5, 13.0, { align: 'center' });

      doc.setTextColor(...rojo);
      doc.setFontSize(13);
      doc.setFont('courier', 'bold');
      doc.text(`N°  ${String(guia.numero).padStart(6, '0')}`, 112.5, 21.5, { align: 'center' });

      const yDatos = 27.5;
      doc.setDrawColor(...azul);
      doc.setLineWidth(0.35);
      doc.rect(8, yDatos, 88, 16);
      doc.setFillColor(...azulClaro);
      doc.rect(8, yDatos, 88, 4, 'F');
      doc.rect(8, yDatos + 8, 88, 4, 'F');
      doc.line(8, yDatos + 4, 96, yDatos + 4);
      doc.line(8, yDatos + 8, 96, yDatos + 8);
      doc.line(8, yDatos + 12, 96, yDatos + 12);

      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);
      doc.text('SEÑOR(ES)', 52, yDatos + 3.0, { align: 'center' });
      doc.text('VENDEDOR', 52, yDatos + 11.0, { align: 'center' });

      doc.setTextColor(...negro);
      doc.setFontSize(8.5);
      const textoCliente = guia.cod && guia.cod !== '000' ? `[${guia.cod}] ${guia.cliente}` : guia.cliente;
      doc.text(textoCliente.toUpperCase(), 10, yDatos + 7.0);
      doc.text((guia.vendedor || 'ACOPIO').toUpperCase(), 10, yDatos + 15.0);

      doc.rect(98, yDatos, 41, 16);
      doc.setFillColor(...azulClaro);
      doc.rect(98, yDatos, 41, 4, 'F');
      doc.rect(98, yDatos + 8, 41, 4, 'F');
      doc.line(98, yDatos + 4, 139, yDatos + 4);
      doc.line(98, yDatos + 8, 139, yDatos + 8);
      doc.line(98, yDatos + 12, 139, yDatos + 12);
      doc.line(111.6, yDatos + 4, 111.6, yDatos + 8);
      doc.line(125.3, yDatos + 4, 125.3, yDatos + 8);

      doc.setTextColor(...azul);
      doc.setFontSize(6.5);
      doc.text('FECHA', 118.5, yDatos + 3.0, { align: 'center' });
      doc.text('DOC. IDENTIDAD', 118.5, yDatos + 11.0, { align: 'center' });

      const partesFecha = (guia.fecha || '2026-11-19').split('-');
      doc.setTextColor(...negro);
      doc.setFontSize(8.5);
      doc.text(partesFecha[2] || '19', 104.8, yDatos + 7.0, { align: 'center' });
      doc.text(partesFecha[1] || '11', 118.5, yDatos + 7.0, { align: 'center' });
      doc.text((partesFecha[0] || '2026').slice(-2), 132.1, yDatos + 7.0, { align: 'center' });
      doc.text(guia.docIdentidad || '-', 118.5, yDatos + 15.0, { align: 'center' });

      const yTabla = 46;
      const hHeader = 6.2;
      const hFila = 5.6;
      const numFilas = 15;
      const cols = [
        { label: 'N°', w: 8 },
        { label: 'AVES', w: 13 },
        { label: 'DETALLE', w: 36 },
        { label: 'PESO', w: 16 },
        { label: 'JABA', w: 13 },
        { label: 'CANT', w: 13 },
        { label: 'DSCTO', w: 13 },
        { label: 'TOTAL', w: 19 },
      ];

      doc.setFillColor(...azulClaro);
      doc.rect(8, yTabla, 131, hHeader, 'FD');
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(6.5);

      let xCursor = 8;
      cols.forEach((c, idx) => {
        if (idx > 0) doc.line(xCursor, yTabla, xCursor, yTabla + hHeader + numFilas * hFila);
        doc.text(c.label, xCursor + c.w / 2, yTabla + 4.3, { align: 'center' });
        xCursor += c.w;
      });

      const filasDatos = guia.filas || [];
      const precioKg = Number(guia.precioKg || 0);

      for (let i = 0; i < numFilas; i++) {
        const yRow = yTabla + hHeader + i * hFila;
        doc.setDrawColor(...azul);
        doc.setLineWidth(0.25);
        doc.line(8, yRow, 139, yRow);

        doc.setFillColor(245, 248, 255);
        doc.rect(8, yRow, 8, hFila, 'F');
        doc.setTextColor(...azul);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(7.2);
        doc.text(String(i + 1), 12, yRow + 4.0, { align: 'center' });

        const item = filasDatos[i];
        if (item) {
          const cantAves = Number(item.jabas || 0) * Number(item.avesJaba || 0);
          const pesoRow = Number(item.peso || 0);
          const dsctoRow = Number(item.dscto || 0);
          const subTotalSoles = precioKg > 0 ? (pesoRow * precioKg - dsctoRow) : 0;
          const detalleTxt = item.detalle || (i === 0 && guia.detalle ? guia.detalle : 'Pollo Vivo');

          doc.setTextColor(...negro);
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7.3);

          if (cantAves > 0) doc.text(String(cantAves), 27.5, yRow + 4.0, { align: 'center' });
          doc.text(detalleTxt.slice(0, 22), 30.2, yRow + 4.0);
          if (pesoRow > 0) doc.text(pesoRow.toFixed(1), 75.5, yRow + 4.0, { align: 'right' });
          if (Number(item.jabas) > 0) doc.text(String(item.jabas), 83.5, yRow + 4.0, { align: 'center' });
          if (Number(item.avesJaba) > 0) doc.text(String(item.avesJaba), 96.5, yRow + 4.0, { align: 'center' });
          if (dsctoRow > 0) doc.text(dsctoRow.toFixed(2), 115.5, yRow + 4.0, { align: 'right' });
          if (subTotalSoles > 0) doc.text(subTotalSoles.toFixed(2), 137.5, yRow + 4.0, { align: 'right' });
        }
      }

      const yFinTabla = yTabla + hHeader + numFilas * hFila;
      doc.setLineWidth(0.4);
      doc.rect(8, yTabla, 131, hHeader + numFilas * hFila);

      const ySub = yFinTabla + 1.5;
      doc.setFillColor(...azulClaro);
      doc.rect(8, ySub, 131, 6.5, 'FD');
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7.2);
      doc.text(`TOTAL AVES: ${guia.aves}`, 11, ySub + 4.4);
      doc.text(`TOTAL JABAS: ${guia.jabas}`, 52, ySub + 4.4);
      if (Number(guia.totalSoles) > 0) {
        doc.setTextColor(...negro);
        doc.text(`TOTAL S/ ${Number(guia.totalSoles).toFixed(2)}`, 137, ySub + 4.4, { align: 'right' });
      }

      const yPie = ySub + 8.5;
      doc.setDrawColor(...azul);
      doc.setLineWidth(0.35);
      doc.rect(8, yPie, 66, 21);
      doc.setTextColor(...azul);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(7);
      doc.text('RECIBIR CONFORME', 41, yPie + 4, { align: 'center' });

      doc.setLineDashPattern([1, 1], 0);
      doc.line(14, yPie + 11.5, 68, yPie + 11.5);
      doc.setLineDashPattern([], 0);
      doc.setFontSize(6);
      doc.text('FIRMA', 41, yPie + 14.2, { align: 'center' });
      doc.text('Nombre y Apellidos: ________________________', 11, yPie + 18.8);

      doc.rect(8, yPie + 22.5, 66, 12);
      doc.setFontSize(6.5);
      doc.text('Nota: este documento no es comprobante', 10.5, yPie + 27.3);
      doc.text('de pago canjear por boleta de Venta o Factura', 10.5, yPie + 31.3);

      doc.setFillColor(...azulClaro);
      doc.rect(77, yPie, 28, 9, 'FD');
      doc.rect(105, yPie, 34, 9, 'S');
      doc.setTextColor(...azul);
      doc.setFontSize(7.5);
      doc.text('PESO TOTAL', 91, yPie + 5.7, { align: 'center' });

      doc.setTextColor(...negro);
      doc.setFontSize(10);
      doc.text(`${Number(guia.peso).toFixed(1)} kg`, 122, yPie + 6.0, { align: 'center' });

      doc.setTextColor(...azul);
      doc.setFontSize(6.1);
      doc.text(empInfo.razonSocial, 77, yPie + 13.2);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(5.8);
      empInfo.bancos.forEach((lineaBanco, idx) => {
        doc.text(lineaBanco, 77, yPie + 17.0 + idx * 3.5);
      });

      if (guia.anulada) {
        doc.setTextColor(...rojo);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(26);
        doc.text('ANULADA', 74, 110, { align: 'center', angle: 35 });
      }

      doc.setFontSize(5.2);
      doc.setTextColor(120, 130, 150);
      doc.text('Generado con Avimoa • Control Avícola', 138, 202.5, { align: 'right' });

      doc.save(`Nota_Pedido_${guia.empresa.replace(/\s+/g, '_')}_${String(guia.numero).padStart(6, '0')}.pdf`);
    }

        setUsuarios(listaActualizada);
        localStorage.setItem('avimoa_usuarios', JSON.stringify(listaActualizada));
        if (supabaseRef.current && online && usuarioModificado) {
          await supabaseRef.current.from('usuarios_app').upsert({
            dni: usuarioModificado.dni,
            nombre: usuarioModificado.nombre,
            rol: usuarioModificado.rol,
            pin: usuarioModificado.pin,
            intentos_fallidos: usuarioModificado.intentosFallidos,
            bloqueado: usuarioModificado.bloqueado,
            activo: usuarioModificado.activo !== false,
            updated_at: new Date().toISOString(),
          });
        }
      };

      const actualizarCorrelativoEmpresa = async (empresa, nuevoNumero, marcadoInicializado = true) => {
        const actualizado = {
          ...correlativos,
          [empresa]: { numero: Number(nuevoNumero), inicializado: marcadoInicializado },
        };
        setCorrelativos(actualizado);
        localStorage.setItem('avimoa_correlativos', JSON.stringify(actualizado));

        if (supabaseRef.current && online) {
          await supabaseRef.current
            .from('correlativos_talonario')
            .upsert({ empresa, correlativo_actual: Number(nuevoNumero), inicializado: marcadoInicializado });
        }
      };

      const conectarSupabase = async (urlParam = sbUrl, keyParam = sbKey, silencioso = false) => {
        if (!urlParam || !keyParam || !window.supabase) return;
        try {
          const client = window.supabase.createClient(urlParam.trim(), keyParam.trim());
          const { data: usersData, error } = await client.from('usuarios_app').select('*');
          if (error) throw error;

          supabaseRef.current = client;
          setSbConectado(true);
          localStorage.setItem('avimoa_sb_url', urlParam.trim());
          localStorage.setItem('avimoa_sb_key', keyParam.trim());

          if (usersData && usersData.length > 0) {
            const mapeados = usersData.map(u => ({
              dni: u.dni,
              nombre: u.nombre,
              rol: u.rol,
              pin: u.pin,
              intentosFallidos: u.intentos_fallidos || 0,
              bloqueado: !!u.bloqueado,
              activo: u.activo !== false,
            }));
            setUsuarios(mapeados);
            localStorage.setItem('avimoa_usuarios', JSON.stringify(mapeados));
          }

          const { data: corrData } = await client.from('correlativos_talonario').select('*');
          if (corrData && corrData.length > 0) {
            const mapa = { ...correlativos };
            corrData.forEach(r => {
              mapa[r.empresa] = { numero: r.correlativo_actual, inicializado: r.inicializado };
            });
            setCorrelativos(mapa);
            localStorage.setItem('avimoa_correlativos', JSON.stringify(mapa));
          }

          await cargarDatosDelDiaDesdeNube(client, fechaOperativa);

          client
            .channel('avimoa-realtime-v3')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'usuarios_app' }, async () => {
              const { data } = await client.from('usuarios_app').select('*');
              if (data) {
                const m = data.map(u => ({
                  dni: u.dni, nombre: u.nombre, rol: u.rol, pin: u.pin,
                  intentosFallidos: u.intentos_fallidos || 0, bloqueado: !!u.bloqueado, activo: u.activo !== false
                }));
                setUsuarios(m);
                localStorage.setItem('avimoa_usuarios', JSON.stringify(m));
              }
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'galpones' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'placas' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'choferes' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'clientes' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'vendedores' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'movimientos_ingreso' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'guias_pluma' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'mermas_ante_mortem' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'cierres_turno' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'autorizaciones_edicion' }, () => cargarDatosDelDiaDesdeNube(client, fechaOperativa))
            .on('postgres_changes', { event: '*', schema: 'public', table: 'correlativos_talonario' }, async () => {
              const { data } = await client.from('correlativos_talonario').select('*');
              if (data) {
                const m = {};
                data.forEach(r => { m[r.empresa] = { numero: r.correlativo_actual, inicializado: r.inicializado }; });
                setCorrelativos(prev => ({ ...prev, ...m }));
              }
            })
            .subscribe();

          if (!silencioso) notificar('Avimoa conectado en TIEMPO REAL con Supabase.');
        } catch (err) {
          setSbConectado(false);
          if (!silencioso) notificar('Error conectando a Supabase. Verifica URL/Key o ejecuta el SQL.', 'err');
        }
      };

      const cargarDatosDelDiaDesdeNube = async (client, fecha) => {
        try {
          const [resIng, resGuias, resMermas, resGalp, resPlacas, resChof, resCli, resVend, resCierres, resAuth] = await Promise.all([
            client.from('movimientos_ingreso').select('*').eq('fecha_operativa', fecha),
            client.from('guias_pluma').select('*').eq('fecha_operativa', fecha),
            client.from('mermas_ante_mortem').select('*').eq('fecha_operativa', fecha),
            client.from('galpones').select('*'),
            client.from('placas').select('*'),
            client.from('choferes').select('*'),
            client.from('clientes').select('*'),
            client.from('vendedores').select('*'),
            client.from('cierres_turno').select('*').eq('fecha_operativa', fecha),
            client.from('autorizaciones_edicion').select('*').eq('fecha_operativa', fecha),
          ]);

          setIngresos((resIng.data || []).map(r => ({
            id: r.id, sector: r.sector, numeroGalpon: r.numero_galpon, empresa: r.empresa,
            placa: r.placa, chofer: r.chofer, jabas: r.jabas, aves: r.aves, modo: r.modo
          })));

          setGuias((resGuias.data || []).map(r => ({
            id: r.id, fecha: r.fecha_operativa, empresa: r.empresa, numero: r.numero,
            cod: r.cod_cliente, cliente: r.cliente, docIdentidad: r.doc_identidad,
            vendedor: r.vendedor, detalle: r.detalle, precioKg: r.precio_kg,
            jabas: r.jabas, aves: r.aves, peso: r.peso, totalSoles: r.total_soles,
            filas: r.filas_json || [], anulada: !!r.anulada, motivoAnulacion: r.motivo_anulacion || ''
          })));

          setMermasAnte((resMermas.data || []).map(r => ({
            id: r.id, placa: r.placa, aves: r.aves, peso: r.peso, motivo: r.motivo, conFoto: r.con_foto
          })));

          setGalpones((resGalp.data || []).map(r => ({
            id: r.id, sector: r.sector, numeroGalpon: r.numero_galpon, referencia: r.referencia, empresaId: r.empresa_id, activo: r.activo !== false
          })));

          setPlacas((resPlacas.data || []).map(r => ({
            id: r.id, placa: r.placa, modelo: r.modelo, empresaId: r.empresa_id, choferId: r.chofer_id, activo: r.activo !== false
          })));

          setChoferes((resChof.data || []).map(r => ({
            id: r.id, nombre: r.nombre, dni: r.dni, telefono: r.telefono, activo: r.activo !== false
          })));

          setClientes((resCli.data || []).map(r => ({
            cod: r.cod, cliente: r.cliente, apodo: r.apodo, docIdentidad: r.doc_identidad || '', activo: r.activo !== false
          })));

          if (!resVend.error && resVend.data) {
            setVendedores(resVend.data.map(r => ({
              id: r.id, nombres: r.nombres, apodo: r.apodo, dni: r.dni || '', activo: r.activo !== false
            })));
          }

          const cierres = resCierres.data || [];
          const cierrePre = cierres.find(c => c.tipo === 'CONTEO_PRE');
          setConfirmacionPre(cierrePre ? {
            teorico: cierrePre.teorico, fisico: cierrePre.fisico, diferencia: cierrePre.diferencia,
            responsable: cierrePre.responsable, hora: cierrePre.hora
          } : null);

          const cierrePost = cierres.find(c => c.tipo === 'CIERRE_POST');
          const regFaena = cierres.find(c => c.tipo === 'FAENADO_REG');
          if (cierrePost) {
            setFaenadoManana(cierrePost.faenado_aves ?? null);
            setPesoFaenado(cierrePost.faenado_kg ?? 0);
            setMermaPost(cierrePost.merma_post ?? 0);
            if (cierrePost.detalle_obs) setDetalleFaenadoObs(cierrePost.detalle_obs);
            setConfirmacionPost({
              teorico: cierrePost.teorico, fisico: cierrePost.fisico, diferencia: cierrePost.diferencia,
              responsable: cierrePost.responsable, hora: cierrePost.hora
            });
          } else if (regFaena) {
            setFaenadoManana(regFaena.faenado_aves ?? null);
            setPesoFaenado(regFaena.faenado_kg ?? 0);
            setMermaPost(regFaena.merma_post ?? 0);
            if (regFaena.detalle_obs) setDetalleFaenadoObs(regFaena.detalle_obs);
            setConfirmacionPost(null);
          } else {
            setFaenadoManana(null);
            setPesoFaenado(0);
            setMermaPost(0);
            setConfirmacionPost(null);
          }

          if (!resAuth.error && resAuth.data) {
            setAutorizaciones(resAuth.data);
          }
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        if (sbUrl && sbKey) conectarSupabase(sbUrl, sbKey, true);
      }, []);

      // Respaldo de sincronización cada 5s cuando hay solicitudes de autorización pendientes
      useEffect(() => {
        const hayPendiente = autorizaciones.some(a => a.estado === 'PENDIENTE');
        if (!hayPendiente || !supabaseRef.current) return;
        const interval = setInterval(() => {
          cargarDatosDelDiaDesdeNube(supabaseRef.current, fechaOperativa);
        }, 5000);
        return () => clearInterval(interval);
      }, [autorizaciones, fechaOperativa]);

      const sincronizarOperacionNube = async (tabla, payload, conceptoOffline) => {
        if (!online || !supabaseRef.current) {
          setColaOffline(prev => [...prev, { id: Date.now(), tabla, payload, concepto: conceptoOffline }]);
          return;
        }
        await supabaseRef.current.from(tabla).upsert(payload);
        if (webhookUrl) {
          fetch(webhookUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tabla, fechaOperativa, payload })
          }).catch(() => {});
        }
      };

      // =======================================================================
      // GESTIÓN DE SOLICITUDES DE AUTORIZACIÓN REMOTA (CONTEO Y FAENADO)
      // =======================================================================
      const solicitarAutorizacionEdicion = async (modulo, motivo) => {
        if (!motivo || motivo.trim().length < 3) {
          return notificar('Escribe el motivo por el cual necesitas editar este módulo.', 'err');
        }
        const nuevaSol = {
          id: `auth-${modulo}-${Date.now()}`,
          fecha_operativa: fechaOperativa,
          modulo,
          solicitado_por: usuarioActivo.nombre,
          motivo: motivo.trim(),
          estado: 'PENDIENTE',
          autorizado_por: null,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        };
        setAutorizaciones(prev => [...prev.filter(a => !(a.modulo === modulo && a.estado === 'PENDIENTE')), nuevaSol]);
        if (supabaseRef.current && online) {
          await supabaseRef.current.from('autorizaciones_edicion').upsert(nuevaSol);
        }
        notificar(`Solicitud enviada al Administrador para editar ${modulo === 'CONTEO' ? 'Conteo Físico' : 'Faenado'}.`, 'warn');
      };

      const aprobarSolicitudConPin = async (solicitud) => {
        if (!esAdminOSupervisor) return;
        if (pinAutorizadorInput !== usuarioActivo.pin) {
          return notificar('PIN de Administrador incorrecto. No se autorizó la edición.', 'err');
        }
        const aprobada = {
          ...solicitud,
          estado: 'APROBADA',
          autorizado_por: usuarioActivo.nombre,
          updated_at: new Date().toISOString(),
        };
        setAutorizaciones(prev => prev.map(a => a.id === solicitud.id ? aprobada : a));
        setPinAutorizadorInput('');
        if (supabaseRef.current && online) {
          await supabaseRef.current.from('autorizaciones_edicion').upsert(aprobada);
        }
        notificar(`✅ Edición de ${solicitud.modulo === 'CONTEO' ? 'Conteo Físico' : 'Faenado'} AUTORIZADA.`);
      };

      const rechazarSolicitud = async (solicitud) => {
        const rechazada = { ...solicitud, estado: 'RECHAZADA', updated_at: new Date().toISOString() };
        setAutorizaciones(prev => prev.map(a => a.id === solicitud.id ? rechazada : a));
        if (supabaseRef.current && online) {
          await supabaseRef.current.from('autorizaciones_edicion').upsert(rechazada);
        }
        notificar('Solicitud rechazada.', 'warn');
      };

      const consumirAutorizacionEdicion = async (modulo) => {
        const activa = autorizaciones.find(a => a.modulo === modulo && a.estado === 'APROBADA');
        if (!activa) return;
        const usada = { ...activa, estado: 'USADA', updated_at: new Date().toISOString() };
        setAutorizaciones(prev => prev.map(a => a.id === activa.id ? usada : a));
        if (supabaseRef.current && online) {
          await supabaseRef.current.from('autorizaciones_edicion').upsert(usada);
        }
      };

      // =======================================================================
      // VALIDACIÓN DE LOGIN CON DNI VISIBLE, PIN CON OJITO, BLOQUEO Y BAJAS
      // =======================================================================
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError('');
        setCuentaBloqueadaMsg(false);

        const dniLimpio = dniInput.trim();
        if (dniLimpio.length !== 8) {
          setLoginError('Ingrese un número de DNI válido de 8 dígitos.');
          return;
        }
        if (pinInput.length !== 4) {
          setLoginError('Ingrese su PIN de 4 dígitos.');
          return;
        }

        let listaBase = [...usuarios];
        if (supabaseRef.current && online) {
          const { data } = await supabaseRef.current.from('usuarios_app').select('*').eq('dni', dniLimpio).maybeSingle();
          if (data) {
            const idx = listaBase.findIndex(u => u.dni === dniLimpio);
            const objNube = {
              dni: data.dni,
              nombre: data.nombre,
              rol: data.rol,
              pin: data.pin,
              intentosFallidos: data.intentos_fallidos || 0,
              bloqueado: !!data.bloqueado,
              activo: data.activo !== false,
            };
            if (idx >= 0) listaBase[idx] = objNube;
            else listaBase.push(objNube);
          }
        }

        const userIdx = listaBase.findIndex(u => u.dni === dniLimpio);
        if (userIdx === -1) {
          setLoginError('DNI no registrado en Avimoa. Solicite su alta al Desarrollador.');
          return;
        }

        const user = listaBase[userIdx];

        if (user.activo === false) {
          setCuentaBloqueadaMsg(true);
          setLoginError('⛔ Este usuario fue dado de baja y ya no tiene acceso al sistema.');
          return;
        }

        if (tipoAccesoLogin === 'DESARROLLADOR' && user.rol !== 'DESARROLLADOR') {
          setLoginError('Este DNI corresponde a un Responsable/Administrador. Cambie a la opción "Responsable".');
          return;
        }
        if (tipoAccesoLogin === 'RESPONSABLE' && user.rol === 'DESARROLLADOR') {
          setLoginError('Este DNI pertenece al Desarrollador. Seleccione la opción "Desarrollador".');
          return;
        }

        if (user.bloqueado) {
          setCuentaBloqueadaMsg(true);
          setLoginError('USUARIO BLOQUEADO tras 3 intentos fallidos. Solo el Desarrollador puede generar un nuevo PIN.');
          return;
        }

        if (user.pin !== pinInput) {
          const nuevosIntentos = (user.intentosFallidos || 0) + 1;
          const debeBloquear = user.rol !== 'DESARROLLADOR' && nuevosIntentos >= 3;

          const userActualizado = {
            ...user,
            intentosFallidos: nuevosIntentos,
            bloqueado: debeBloquear,
          };
          listaBase[userIdx] = userActualizado;
          await guardarUsuariosLocalYNube(listaBase, userActualizado);

          if (debeBloquear) {
            setCuentaBloqueadaMsg(true);
            setLoginError('🔒 CUENTA BLOQUEADA: Alcanzaste el 3er intento fallido. Pide al Desarrollador que te genere un nuevo PIN.');
          } else if (user.rol === 'DESARROLLADOR') {
            setLoginError('PIN de Desarrollador incorrecto. Verifica con el ícono del ojito e intenta nuevamente.');
          } else {
            const restantes = 3 - nuevosIntentos;
            setLoginError(`⚠️ PIN incorrecto. Te ${restantes === 1 ? 'queda 1 intento' : `quedan ${restantes} intentos`} antes del bloqueo.`);
          }
          return;
        }

        const userLimpio = { ...user, intentosFallidos: 0, bloqueado: false };
        listaBase[userIdx] = userLimpio;
        await guardarUsuariosLocalYNube(listaBase, userLimpio);

        setUsuarioActivo(userLimpio);
        setPinInput('');
        setMostrarPin(false);
        setLoginError('');
        setCuentaBloqueadaMsg(false);

        const permitidos = PERMISOS_ROL[userLimpio.rol];
        setTabActiva(permitidos.includes('KARDEX') ? 'KARDEX' : permitidos[0]);
      };

      const nombreEmpresa = (empId) => EMPRESAS.find(e => e.id === empId)?.nombreCorto || 'CONSOLIDADO';
      const nombreChofer = (chId) => choferes.find(c => c.id === chId)?.nombre || 'Sin asignar';

      // Cálculos Kardex (las guías anuladas NO restan aves)
      const totalIngresosAves = ingresos.reduce((a, b) => a + b.aves, 0);
      const totalVentasVivoAves = guias.filter(g => !g.anulada).reduce((a, b) => a + b.aves, 0);
      const totalMermaAnteAves = mermasAnte.reduce((a, b) => a + b.aves, 0);
      const saldoTeoricoPreFaenado = saldoInicial + totalIngresosAves - totalVentasVivoAves - totalMermaAnteAves;
      const basePreFaenado = confirmacionPre ? confirmacionPre.fisico : saldoTeoricoPreFaenado;
      const saldoTeoricoPostFaenado = basePreFaenado - (faenadoManana || 0) - mermaPost;

      const toggleRed = async () => {
        const nuevoEstado = !online;
        setOnline(nuevoEstado);
        if (nuevoEstado && colaOffline.length > 0) {
          if (supabaseRef.current) {
            for (const item of colaOffline) {
              if (item.tabla && item.payload) {
                await supabaseRef.current.from(item.tabla).upsert(item.payload);
              }
            }
          }
          notificar(`Sincronizados ${colaOffline.length} registros pendientes con la nube.`);
          setColaOffline([]);
        } else if (!nuevoEstado) {
          notificar('Modo SIN SEÑAL activado: Los registros se guardarán localmente.', 'warn');
        }
      };

      // =======================================================================
      // PANTALLA DE INGRESO (LOGIN AVIMOA)
      // =======================================================================
      if (!usuarioActivo) {
        const bloqueadosCount = usuarios.filter(u => u.bloqueado && u.activo !== false).length;

        return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
            <div className="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
              <div className="pt-1">
                <LogoAvimoa />
                <div className="flex justify-center mt-2">
                  <span className={`inline-flex items-center gap-1.5 text-[10px] font-extrabold px-2.5 py-0.5 rounded-full uppercase border ${
                    sbConectado
                      ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30'
                      : 'bg-slate-800 text-slate-400 border-slate-700'
                  }`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${sbConectado ? 'bg-emerald-400 animate-ping' : 'bg-amber-400'}`}></span>
                    {sbConectado ? 'Nube Tiempo Real Activa' : 'Plumífero & Los 7 Pollitos'}
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-1.5 bg-slate-950 p-1.5 rounded-2xl border border-slate-800">
                <button
                  type="button"
                  onClick={() => {
                    setTipoAccesoLogin('RESPONSABLE');
                    setLoginError('');
                    setCuentaBloqueadaMsg(false);
                  }}
                  className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 ${
                    tipoAccesoLogin === 'RESPONSABLE'
                      ? 'bg-amber-500 text-slate-950 shadow-md'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>👷</span> RESPONSABLE / ADMIN
                </button>
                <button
                  type="button"
                  onClick={() => {
                    setTipoAccesoLogin('DESARROLLADOR');
                    setLoginError('');
                    setCuentaBloqueadaMsg(false);
                  }}
                  className={`py-2.5 px-3 rounded-xl text-xs font-black transition flex items-center justify-center gap-1.5 relative ${
                    tipoAccesoLogin === 'DESARROLLADOR'
                      ? 'bg-emerald-500 text-slate-950 shadow-md'
                      : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <span>🛡️</span> DESARROLLADOR
                  {bloqueadosCount > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-rose-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">
                      {bloqueadosCount}
                    </span>
                  )}
                </button>
              </div>

              <form onSubmit={handleLoginSubmit} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">
                    Número de DNI ({tipoAccesoLogin === 'DESARROLLADOR' ? 'Desarrollador' : 'Responsable / Administrador'})
                  </label>
                  <input
                    type="text"
                    inputMode="numeric"
                    maxLength={8}
                    value={dniInput}
                    onChange={(e) => {
                      setDniInput(e.target.value.replace(/\D/g, ''));
                      setLoginError('');
                    }}
                    placeholder="Ej. 47720216"

                      placeholder="••••"
                      className="w-full bg-slate-950 border-2 border-slate-700 focus:border-amber-500 rounded-2xl py-3.5 pl-4 pr-14 text-center text-3xl tracking-[0.6em] font-mono font-black text-amber-400 outline-none transition"

                    >
                      {mostrarPin ? (

                        </svg>

                        <svg className="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">

                          <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
